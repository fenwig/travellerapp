<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skills — Traveller</title>
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/reference.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>


  <div class="app-shell">
    <nav class="sidebar">
      <div class="sidebar-logo">
        <div class="sidebar-logo-text">TRAVELLER</div>
        <div class="sidebar-user" id="sidebar-user"></div>
      </div>
      <div class="sidebar-group-label">Character Resources</div>
      <a href="character-record.html" class="sidebar-nav-item">Character Record</a>
      <a href="spacecraft-record.html" class="sidebar-nav-item">Spacecraft Record</a>
      <a href="character-list.html" class="sidebar-nav-item">Character List</a>
      <a href="character-creation.html" class="sidebar-nav-item">Character Creation</a>
      <div class="sidebar-group-label">Reference</div>
      <a href="general-rules.html" class="sidebar-nav-item">General Rules</a>
      <a href="combat.html" class="sidebar-nav-item">Combat</a>
      <a href="vehicles.html" class="sidebar-nav-item">Vehicles</a>
      <a href="spacecraft-operations.html" class="sidebar-nav-item">Spacecraft Operations</a>
      <a href="spacecraft-combat.html" class="sidebar-nav-item">Spacecraft Combat</a>
      <a href="equipment.html" class="sidebar-nav-item">Equipment</a>
      <a href="weapons-armor.html" class="sidebar-nav-item">Weapons &amp; Armor</a>
      <a href="trade.html" class="sidebar-nav-item">Trade</a>
      <div class="sidebar-signout">
        <button onclick="doSignOut()">Sign Out</button>
      </div>
    </nav>

    <main class="page-main">
      <h1 class="page-title">SKILLS</h1>

      <div class="skill-controls">
        <input type="text" id="skill-search" placeholder="Search skills..." oninput="filterSkills()" />
        <div class="filter-row">
          <button class="filter-btn active" onclick="filterCategory('all', this)">All</button>
          <button class="filter-btn" onclick="filterCategory('combat', this)">Combat</button>
          <button class="filter-btn" onclick="filterCategory('social', this)">Social</button>
          <button class="filter-btn" onclick="filterCategory('technical', this)">Technical</button>
          <button class="filter-btn" onclick="filterCategory('spacecraft', this)">Spacecraft</button>
          <button class="filter-btn" onclick="filterCategory('physical', this)">Physical</button>
        </div>
      </div>

      <div id="skill-grid" class="skill-grid"></div>
    </main>
  </div>

  <script src="../js/supabase-config.js"></script>
  <script src="../js/sidebar.js"></script>
  <script src="../js/skills-data.js"></script>
  <script src="../js/skills-reference.js"></script>
  <script>
    async function doSignOut() {
      await supabaseClient.auth.signOut();
      window.location.href = '../../index.html';
    }
  </script>
</body>
</html>
