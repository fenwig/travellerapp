<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Passenger Calculator — Traveller</title>
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/reference.css" />
  <link rel="stylesheet" href="../css/calculators.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/nav.js" defer></script>
</head>
<body>

  <div class="app-shell">
    <nav class="sidebar">
      <div class="sidebar-logo">
        <div class="sidebar-logo-text">TRAVELLER</div>
        <div class="sidebar-user" id="sidebar-user"></div>
      </div>
      <div class="sidebar-signout">
        <button onclick="doSignOut()">Sign Out</button>
      </div>
    </nav>

    <main class="page-main">
      <h1 class="page-title">PASSENGER CALCULATOR</h1>
      <p class="calc-intro">Seeking passengers (Core Rulebook pp.238–239). Enter the details and roll, then choose how many of each class to take. Fares come from the Passage and Freight table for a single jump of the distance travelled.</p>
      <div id="form"></div>
      <div class="calc-actions"><button class="btn-primary" onclick="rollPassengers()">Roll for Passengers</button>
        <button class="btn-outline" onclick="TC.reset()">Reset</button></div>
      <div id="results"></div>
    </main>
  </div>

  <script src="../js/supabase-config.js"></script>
  <script src="../js/sidebar.js"></script>
  <script src="../js/trade-calc.js"></script>
  <script>
    document.getElementById('form').innerHTML = `
      <div class="calc-block calc-row">
        <div class="calc-block-title">Ship &amp; Journey</div>
        <div class="calc-fields">
          <label>Highest Steward skill on ship<input type="number" id="steward" min="0" max="6" value="0" /></label>
          <label>Distance (parsecs)<select id="dist">${TC.opts([1,2,3,4,5,6], 1)}</select></label>
        </div>
      </div>
      ${TC.worldBlock('src', 'Source World (where you are)', false)}
      ${TC.worldBlock('dst', 'Destination World', false)}
      <div class="calc-block calc-row">
        <div class="calc-block-title">Skill Check</div>
        <label class="calc-check"><input type="checkbox" id="use-check" checked /> Roll 8+ check (Effect added to rolls)</label>
        <div class="calc-fields">
          <label>Skill<select id="chk-skill">${TC.opts(['Broker','Carouse','Streetwise'], 'Broker')}</select></label>
          <label>Skill level<input type="number" id="chk-level" min="-3" max="6" value="0" /></label>
          <label>Characteristic DM<input type="number" id="chk-dm" min="-3" max="6" value="0" /></label>
        </div>
      </div>`;

    const CLASSES = [
      { key: 'low',    label: 'Low Passage',    classDM: 1,  note: 'DM+1 for Low' },
      { key: 'basic',  label: 'Basic Passage',  classDM: 0,  note: '' },
      { key: 'middle', label: 'Middle Passage', classDM: 0,  note: '' },
      { key: 'high',   label: 'High Passage',   classDM: -4, note: 'DM−4 for High' }
    ];
    let current = null;   // { dist, avail: {key: n} }

    function rollPassengers() {
      const dist = TC.num('dist');
      const src = TC.readWorld('src'), dst = TC.readWorld('dst');
      const steward = TC.num('steward');

      let effect = 0, checkText = '';
      if (document.getElementById('use-check').checked) {
        const c = TC.skillCheck(document.getElementById('chk-skill').value, TC.num('chk-level'), TC.num('chk-dm'));
        effect = c.effect; checkText = c.text;
      }

      const baseRows = [['Chief Steward skill', steward]];
      if (checkText) baseRows.push(['Skill check Effect', effect]);
      baseRows.push(...TC.passengerWorldDMs(src, 'Source'), ...TC.passengerWorldDMs(dst, 'Destination'), ...TC.distanceDM(dist));

      current = { dist, avail: {} };
      let html = '<div class="calc-result-title">PASSENGERS AVAILABLE</div>';
      if (checkText) html += '<div class="calc-note">' + checkText + '</div>';

      CLASSES.forEach(c => {
        const rows = baseRows.slice();
        if (c.classDM) rows.push([c.note, c.classDM]);
        const dm = TC.sum(rows.map(r => r[1]));
        const dice = [TC.d6(), TC.d6()];
        const total = TC.sum(dice) + dm;
        const n = TC.diceFor(TC.PASSENGER_DICE, total);
        const pax = TC.rollDice(n);
        const count = TC.sum(pax);
        current.avail[c.key] = count;
        const fare = TC.FARES[dist][c.key];
        html += `<div class="calc-block">
          <div class="calc-block-title">${c.label} — ${count} available</div>
          <div class="calc-roll-line">2D [${dice.join('+')}] ${TC.signed(dm)} = <b>${total}</b> → ${n}D${n ? ' [' + pax.join('+') + '] = <b>' + count + '</b>' : ' = <b>0</b>'}
            &nbsp;·&nbsp; Fare <b>${TC.cr(fare)}</b> each</div>
          ${TC.dmList(rows)}
          <div class="calc-take">Take
            <input type="number" id="take-${c.key}" min="0" max="${count}" value="0" ${count ? '' : 'disabled'} oninput="updateTotals()" />
            of ${count}
            <span class="calc-line-total" id="line-${c.key}">Cr0</span>
          </div>
        </div>`;
      });
      html += '<div class="calc-total"><small id="total-pax">0 passengers</small><span id="grand-total">Cr0</span></div>' + TC.transferBlock();
      document.getElementById('results').innerHTML = html;
      TC.save();
    }

    async function transferToShip() {
      const n = {};
      CLASSES.forEach(c => { n[c.key] = Math.max(0, Math.min(parseInt(document.getElementById('take-' + c.key).value, 10) || 0, current.avail[c.key])); });
      const pax = n.low + n.basic + n.middle + n.high;
      if (!pax) { TC.xferMsg('Choose at least one passenger to take first.', false); return; }
      try {
        const ship = await TC.activeShip();
        const { error } = await supabaseClient.from('spacecraft_passengers').insert({
          spacecraft_id: ship.id,
          destination: document.getElementById('xfer-dest').value.trim() || null,
          high_passage: n.high, middle_passage: n.middle, basic_passage: n.basic, low_passage: n.low
        });
        if (error) throw error;
        TC.xferDone();
        TC.xferMsg('Added ' + pax + ' passenger' + (pax === 1 ? '' : 's') + ' to <b>' + ship.name + '</b>. <a href="spacecraft-record.html" style="color:#00e5ff">View Spacecraft Record</a> (Finance &amp; Cargo tab).', true);
      } catch (e) { TC.xferMsg('Transfer failed: ' + (e.message || e), false); }
    }

    function updateTotals() {
      let grand = 0, pax = 0;
      CLASSES.forEach(c => {
        const el = document.getElementById('take-' + c.key);
        let n = parseInt(el.value, 10) || 0;
        n = Math.max(0, Math.min(n, current.avail[c.key]));
        if (String(n) !== el.value && el.value !== '') el.value = n;
        const pay = n * TC.FARES[current.dist][c.key];
        document.getElementById('line-' + c.key).textContent = TC.cr(pay);
        grand += pay; pax += n;
      });
      document.getElementById('total-pax').textContent = pax + ' passenger' + (pax === 1 ? '' : 's');
      document.getElementById('grand-total').textContent = TC.cr(grand);
    }
    TC.persist('passenger', () => current, v => { current = v; });
  </script>
</body>
</html>
