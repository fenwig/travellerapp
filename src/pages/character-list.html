<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roster — Traveller</title>
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/reference.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .roster-section { margin-bottom: 40px; }
    .roster-section-head {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 14px;
    }
    .roster-section-title {
      color: #00e5ff; font-size: 1.05rem; font-weight: 600;
      letter-spacing: 0.06em; text-transform: uppercase;
    }
    .roster-table tbody tr { cursor: pointer; }
    .status-badge {
      display: inline-block; padding: 3px 12px; border-radius: 4px;
      font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;
    }
    .status-active    { background: rgba(0,255,170,0.12);  color: #00ffaa; border: 1px solid #00ffaa44; }
    .status-deceased  { background: rgba(255,90,74,0.12);  color: #ff5a4a; border: 1px solid #ff5a4a44; }
    .status-archived  { background: rgba(74,154,184,0.12); color: #4a9ab8; border: 1px solid #4a9ab844; }
    .status-other     { background: rgba(176,216,232,0.10); color: #b0d8e8; border: 1px solid #b0d8e844; }
    .status-draft      { background: rgba(0,229,255,0.10);  color: #00e5ff; border: 1px solid #00e5ff44; }
    .status-reserve   { background: rgba(74,154,184,0.12); color: #4a9ab8; border: 1px solid #4a9ab844; }
    .status-sold      { background: rgba(176,216,232,0.10); color: #b0d8e8; border: 1px solid #b0d8e844; }
    .status-destroyed { background: rgba(255,90,74,0.12);  color: #ff5a4a; border: 1px solid #ff5a4a44; }
    .status-stolen    { background: rgba(255,90,74,0.12);  color: #ff5a4a; border: 1px solid #ff5a4a44; }
    .onboard-check { width: 18px; height: 18px; accent-color: #00e5ff; cursor: pointer; }
    .status-select {
      border: none; cursor: pointer; font-family: inherit;
      -webkit-appearance: none; -moz-appearance: none; appearance: none;
    }
    .status-select option { background: #0a1a22; color: #b0d8e8; }
    .roster-thumb { display: inline-block; vertical-align: middle; width: 36px; height: 36px; margin-right: 10px;
      border-radius: 4px; border: 1px solid #0a4a60; background: #0d1520; }
    .campaign-bar { display: flex; align-items: center; gap: 10px; margin: -4px 0 18px; }
    .campaign-bar label { font-size: 0.7rem; color: #4a9ab8; text-transform: uppercase; letter-spacing: 0.08em; }
    .campaign-bar select { background: #080d12; border: 1px solid #0a4a60; color: #00e5ff; border-radius: 4px; padding: 6px 10px; font-size: 0.9rem; min-width: 220px; }
    .roster-empty td { color: #4a9ab8; font-size: 0.85rem; }
  </style>
  <script src="../js/nav.js" defer></script>
</head>
<body>

  <div class="app-shell">
    <nav class="sidebar">
      <div class="sidebar-logo">
        <div class="sidebar-logo-text">TRAVELLER</div>
        <div class="sidebar-user" id="sidebar-user"></div>
      </div>
      <div class="sidebar-signout">
        <button onclick="doSignOut()">Sign Out</button>
      </div>
    </nav>

    <main class="page-main">
      <h1 class="page-title">ROSTER</h1>
      <div class="campaign-bar" id="campaign-bar" style="display:none">
        <label for="campaign-select">Campaign</label>
        <select id="campaign-select" onchange="switchCampaign(this.value)"></select>
      </div>

      <div class="roster-section">
        <div class="roster-section-head">
          <div class="roster-section-title">Characters</div>
          <div style="display:flex; gap:10px;">
            <button class="btn-outline" id="new-campaign-btn" style="display:none" onclick="newCampaign()">+ New Campaign</button>
            <button class="btn-outline" onclick="window.location.href='character-creation.html'">+ Character Creation</button>
            <button class="btn-outline" onclick="createCharacter()">+ Blank Character</button>
          </div>
        </div>
        <table class="ref-table roster-table" id="char-table">
          <thead>
            <tr>
              <th>Character Name</th>
              <th>Player Name</th>
              <th>Race</th>
              <th>Primary Role</th>
              <th>Secondary Role</th>
              <th>Status</th>
              <th>Onboard</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="char-tbody">
            <tr class="roster-empty"><td colspan="8">Loading…</td></tr>
          </tbody>
        </table>
      </div>

      <div class="roster-section">
        <div class="roster-section-head">
          <div class="roster-section-title">Spacecraft</div>
          <button class="btn-outline" onclick="createSpacecraft()">+ New Spacecraft</button>
        </div>
        <table class="ref-table roster-table" id="ship-table">
          <thead>
            <tr>
              <th>Name</th>
              <th>Class</th>
              <th>Status</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="ship-tbody">
            <tr class="roster-empty"><td colspan="4">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="../js/supabase-config.js"></script>
  <script src="../js/sidebar.js"></script>
  <script src="../js/portrait.js"></script>
  <script>
    let currentUser = null;
    let campaignId = null;
    const STATUS_OPTIONS = ['active', 'reserve', 'archived', 'deceased', 'other'];
    const SPACECRAFT_STATUS_OPTIONS = ['active', 'reserve', 'destroyed', 'sold', 'stolen', 'other'];

    async function init() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) { window.location.href = '../../index.html'; return; }
      currentUser = session.user;
      document.getElementById('sidebar-user').textContent =
        currentUser.user_metadata?.display_name || currentUser.email;

      await initCampaignBar();
      await loadCharacters();
      await loadSpacecraft();
    }

    async function initCampaignBar() {
      const list = await loadCampaigns();
      campaignId = await currentCampaignId();
      if (list.length) {
        document.getElementById('campaign-select').innerHTML = list.map(c =>
          `<option value="${c.id}" ${c.id === campaignId ? 'selected' : ''}>${c.name}</option>`).join('');
        document.getElementById('campaign-bar').style.display = 'flex';
        if (isGM(currentUser)) document.getElementById('new-campaign-btn').style.display = '';
      }
    }

    async function switchCampaign(id) {
      setCampaignId(id);
      window.location.reload();
    }

    async function newCampaign() {
      const name = prompt('Name of the new campaign:');
      if (!name || !name.trim()) return;
      const { data, error } = await supabaseClient.from('campaigns').insert({ name: name.trim() }).select().single();
      if (error) { alert('Could not create the campaign: ' + error.message); return; }
      setCampaignId(data.id);
      window.location.reload();
    }

    function statusLabel(s) {
      s = s || 'active';
      return s.charAt(0).toUpperCase() + s.slice(1);
    }

    async function loadCharacters() {
      const { data, error } = await inCampaign(supabaseClient
        .from('characters')
        .select('id,portrait_url,portrait_crop,name,player_name,species,primary_role,secondary_role,status,onboard,user_id'), campaignId)
        .order('name');

      const tbody = document.getElementById('char-tbody');
      if (error || !data || data.length === 0) {
        tbody.innerHTML = '<tr class="roster-empty"><td colspan="8">No characters yet.</td></tr>';
        return;
      }

      const gm = isGM(currentUser);
      tbody.innerHTML = data.map(c => {
        const canManage = gm || c.user_id === currentUser.id;
        return `
        <tr data-id="${c.id}">
          <td onclick="openCharacter('${c.id}', '${c.status}')"><span class="roster-thumb" data-url="${c.portrait_url || ''}" data-crop='${c.portrait_crop ? JSON.stringify(c.portrait_crop) : ''}'></span>${c.name || '—'}</td>
          <td onclick="openCharacter('${c.id}', '${c.status}')">${c.player_name || '—'}</td>
          <td onclick="openCharacter('${c.id}', '${c.status}')">${c.species || '—'}</td>
          <td onclick="openCharacter('${c.id}', '${c.status}')">${c.primary_role || '—'}</td>
          <td onclick="openCharacter('${c.id}', '${c.status}')">${c.secondary_role || '—'}</td>
          <td onclick="event.stopPropagation()">${canManage && c.status !== 'draft'
            ? `<select class="status-select status-badge status-${c.status||'active'}" onchange="changeStatus('${c.id}', this.value)">
                ${STATUS_OPTIONS.map(s => `<option value="${s}" ${(c.status||'active') === s ? 'selected' : ''}>${statusLabel(s)}</option>`).join('')}
              </select>`
            : `<span class="status-badge status-${c.status||'active'}" onclick="openCharacter('${c.id}', '${c.status}')">${statusLabel(c.status)}</span>`}</td>
          <td><input type="checkbox" class="onboard-check" ${c.onboard ? 'checked' : ''} ${canManage && (c.status || 'active') === 'active' ? '' : 'disabled'}
                title="${(c.status || 'active') === 'active' ? '' : 'Only the active character can be marked onboard'}"
                onclick="event.stopPropagation()" onchange="toggleOnboard('${c.id}', this.checked)" /></td>
          <td onclick="event.stopPropagation()">
            <span class="delete-cell" data-id="${c.id}">
              ${canManage ? `<button class="btn-outline-danger" onclick="confirmDelete(this, 'char')">Delete</button>` : ''}
            </span>
          </td>
        </tr>
      `;
      }).join('');
      tbody.querySelectorAll('.roster-thumb').forEach(el => {
        renderPortrait(el, el.dataset.url, el.dataset.crop ? JSON.parse(el.dataset.crop) : null);
      });
    }

    function confirmDelete(btn, kind) {
      const cell = btn.closest('.delete-cell');
      const id = cell.dataset.id;
      cell.innerHTML = `
        <span style="font-size:0.78rem; color:#ff5a4a;">Delete?</span>
        <button class="btn-outline-danger" onclick="${kind === 'char' ? 'deleteCharacter' : 'deleteSpacecraft'}('${id}')">Yes</button>
        <button class="btn-small" onclick="${kind === 'char' ? 'loadCharacters' : 'loadSpacecraft'}()">Cancel</button>
      `;
    }

    async function deleteCharacter(id) {
      const { data, error } = await supabaseClient.from('characters').delete().eq('id', id).select();
      if (error) { alert('Error: ' + error.message); return; }
      if (!data || data.length === 0) {
        alert('Delete did not go through — the database\'s row-level security rejected it (this character\'s user_id likely doesn\'t match your account, and there is no GM override at the database level yet, only in this app\'s UI). Ask Mikel to remove it directly via the Supabase SQL editor, or set up an RLS policy granting the GM account delete rights.');
        return;
      }
      await loadCharacters();
    }

    async function changeSpacecraftStatus(id, newStatus) {
      if (newStatus === 'active') {
        const { data: others } = await inCampaign(supabaseClient.from('spacecraft')
          .select('id,name').eq('status', 'active').neq('id', id), campaignId);
        if (others && others.length > 0) {
          alert('"' + others[0].name + '" is already the active spacecraft. Set it to Reserve first.');
          await loadSpacecraft();
          return;
        }
      }
      const { error } = await supabaseClient.from('spacecraft').update({ status: newStatus }).eq('id', id);
      if (error) alert('Could not change status: ' + error.message);
      await loadSpacecraft();
    }

    async function deleteSpacecraft(id) {
      const { error } = await supabaseClient.from('spacecraft').delete().eq('id', id);
      if (error) { alert('Error: ' + error.message); return; }
      await loadSpacecraft();
    }

    function openCharacter(id, status) {
      if (status === 'draft') {
        window.location.href = 'character-creation.html?id=' + id;
      } else {
        window.location.href = 'character-record.html?id=' + id;
      }
    }

    async function toggleOnboard(id, val) {
      await supabaseClient.from('characters').update({ onboard: val }).eq('id', id);
    }

    async function changeStatus(id, newStatus) {
      if (newStatus === 'active') {
        // Only one active character per player — archive this player's
        // other active character(s) first.
        const { data: row } = await supabaseClient.from('characters').select('user_id,campaign_id').eq('id', id).single();
        if (row) {
          await inCampaign(supabaseClient.from('characters').update({ status: 'archived', onboard: false })
            .eq('user_id', row.user_id).eq('status', 'active').neq('id', id), row.campaign_id);
        }
        await supabaseClient.from('characters').update({ status: 'active' }).eq('id', id);
      } else {
        await supabaseClient.from('characters').update({ status: newStatus, onboard: false }).eq('id', id);
      }
      await loadCharacters();
    }

    async function createCharacter() {
      // Only one active character per player — archive any other active
      // characters this user owns before this new one becomes active.
      await inCampaign(supabaseClient.from('characters').update({ status: 'archived', onboard: false })
        .eq('user_id', currentUser.id).eq('status', 'active'), campaignId);
      const { data, error } = await supabaseClient.from('characters')
        .insert({
          ...(campaignId ? { campaign_id: campaignId } : {}),
          user_id: currentUser.id,
          name: 'New Character',
          player_name: currentUser.user_metadata?.display_name || currentUser.email,
          species: 'Human',
          status: 'active'
        })
        .select().single();
      if (error) { alert('Error: ' + error.message); return; }
      openCharacter(data.id);
    }

    async function loadSpacecraft() {
      const { data, error } = await inCampaign(supabaseClient
        .from('spacecraft')
        .select('id,name,ship_class,status'), campaignId)
        .order('name');

      const tbody = document.getElementById('ship-tbody');
      if (error || !data || data.length === 0) {
        tbody.innerHTML = '<tr class="roster-empty"><td colspan="4">No spacecraft yet.</td></tr>';
        return;
      }

      tbody.innerHTML = data.map(s => `
        <tr data-id="${s.id}">
          <td onclick="openSpacecraft('${s.id}')">${s.name || '—'}</td>
          <td onclick="openSpacecraft('${s.id}')">${s.ship_class || '—'}</td>
          <td onclick="event.stopPropagation()">
            <select class="status-select status-badge status-${s.status||'active'}" onchange="changeSpacecraftStatus('${s.id}', this.value)">
              ${SPACECRAFT_STATUS_OPTIONS.map(opt => `<option value="${opt}" ${(s.status||'active') === opt ? 'selected' : ''}>${statusLabel(opt)}</option>`).join('')}
            </select>
          </td>
          <td onclick="event.stopPropagation()">
            <span class="delete-cell" data-id="${s.id}">
              <button class="btn-outline-danger" onclick="confirmDelete(this, 'ship')">Delete</button>
            </span>
          </td>
        </tr>
      `).join('');
    }

    function openSpacecraft(id) {
      window.location.href = 'spacecraft-record.html?id=' + id;
    }

    async function createSpacecraft() {
      const { data, error } = await supabaseClient.from('spacecraft')
        .insert({ ...(campaignId ? { campaign_id: campaignId } : {}), name: 'New Ship', ship_class: 'Unknown', status: 'reserve', streamlined_status: 'Streamlined' })
        .select().single();
      if (error) { alert('Error: ' + error.message); return; }
      openSpacecraft(data.id);
    }

    async function doSignOut() {
      await supabaseClient.auth.signOut();
      window.location.href = '../../index.html';
    }

    init();
  </script>
</body>
</html>
