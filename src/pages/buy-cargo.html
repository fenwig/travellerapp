<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buy Cargo — Traveller</title>
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/reference.css" />
  <link rel="stylesheet" href="../css/calculators.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/nav.js" defer></script>
</head>
<body>

  <div class="app-shell">
    <nav class="sidebar">
      <div class="sidebar-logo">
        <div class="sidebar-logo-text">TRAVELLER</div>
        <div class="sidebar-user" id="sidebar-user"></div>
      </div>
      <div class="sidebar-signout">
        <button onclick="doSignOut()">Sign Out</button>
      </div>
    </nav>

    <main class="page-main">
      <h1 class="page-title">BUY CARGO</h1>
      <p class="calc-intro">Speculative trade (Core Rulebook pp.241–244) is worked through step by step, and your progress is saved as you go. <b>Step 1: Find a Supplier or Broker</b> (p.241). Enter the world you are on, choose what you are looking for, and roll.</p>
      <div id="form"></div>
      <div class="calc-actions">
        <button class="btn-primary" onclick="rollFind()">Search</button>
        <button class="btn-outline" onclick="TC.reset()">Reset</button>
      </div>
      <div id="step1"></div>
      <div class="calc-block calc-row" id="neg-block">
        <div class="calc-block-title">Negotiation</div>
        <div class="calc-fields">
          <label id="neg-mine">Your Broker skill<input type="number" id="my-broker" min="0" max="6" value="0" /></label>
          <span id="neg-broker" style="display:none"></span>
          <label>Supplier's Broker skill<input type="number" id="sup-broker" min="0" max="6" value="2" /></label>
        </div>
      </div>
      <div class="calc-actions">
        <button class="btn-primary" id="goods-btn" onclick="findGoods()" disabled>Find Goods</button>
      </div>
      <div id="step2"></div>
    </main>
  </div>

  <script src="../js/supabase-config.js"></script>
  <script src="../js/sidebar.js"></script>
  <script src="../js/trade-calc.js"></script>
  <script src="../js/trade-goods.js"></script>
  <script>
    // Trade codes, Core Rulebook p.260
    const TRADE_CODES = [
      ['Ag','Agricultural'], ['As','Asteroids'], ['Ba','Barren'], ['De','Desert'], ['Fl','Fluid Oceans'],
      ['Ga','Garden'], ['Hi','High Population'], ['Ht','High Tech'], ['Ic','Ice-Capped'], ['In','Industrial'],
      ['Lo','Low Population'], ['Lt','Low Tech'], ['Na','Non-Agricultural'], ['Ni','Non-Industrial'],
      ['Po','Poor'], ['Ri','Rich'], ['Va','Vacuum'], ['Wa','Water World']
    ];

    // What the player can look for (p.241)
    const FIND_TYPES = [
      { key: 'supplier',   label: 'Supplier',                 skill: 'Broker',     char: 'EDU or SOC', unit: 'days',  illegal: false, broker: false, online: false },
      { key: 'broker',     label: 'Broker',                   skill: 'Broker',     char: 'EDU or SOC', unit: 'days',  illegal: false, broker: true,  online: false, fee: 10, brokerSkill: 'Broker' },
      { key: 'bm-supplier',label: 'Black Market Supplier',    skill: 'Streetwise', char: 'EDU or SOC', unit: 'days',  illegal: true,  broker: false, online: false },
      { key: 'bm-broker',  label: 'Broker of Illegal Goods',  skill: 'Streetwise', char: 'EDU or SOC', unit: 'days',  illegal: true,  broker: true,  online: false, fee: 20, brokerSkill: 'Streetwise' },
      { key: 'on-supplier',label: 'Online Supplier (TL8+)',   skill: 'Admin',      char: 'EDU',        unit: 'hours', illegal: false, broker: false, online: true },
      { key: 'on-broker',  label: 'Online Broker (TL8+)',     skill: 'Admin',      char: 'EDU',        unit: 'hours', illegal: false, broker: true,  online: true,  fee: 10, brokerSkill: 'Broker' }
    ];
    const STARPORT_FIND_DM = { A: 6, B: 4, C: 2, D: 0, E: 0, X: 0 };

    const codeSelects = Array.from({ length: 5 }, (_, i) =>
      `<select id="tc-${i}" style="width:165px"><option value="">—</option>${TRADE_CODES.map(c => `<option value="${c[0]}" title="${c[1]}">${c[0]} – ${c[1]}</option>`).join('')}</select>`
    ).join('');

    document.getElementById('form').innerHTML = `
      ${TC.worldBlock('src', 'Source World', true)}
      <div class="calc-block calc-row" style="flex-wrap:wrap">
        <div class="calc-block-title">Trade Codes</div>
        <div class="calc-fields" style="flex-wrap:wrap">${codeSelects}</div>
      </div>
      <div class="calc-block calc-row">
        <div class="calc-block-title">Looking For</div>
        <div class="calc-fields">
          <label><select id="find-type" onchange="updateFindLabels()">${FIND_TYPES.map(t => `<option value="${t.key}">${t.label}</option>`).join('')}</select></label>
          <label><span id="lbl-skill">Broker</span> skill<input type="number" id="find-level" min="-3" max="6" value="0" /></label>
          <label><span id="lbl-char">EDU or SOC</span> DM<input type="number" id="find-dm" min="-3" max="6" value="0" /></label>
          <label>Previous attempts this month<input type="number" id="find-prev" min="0" max="30" value="0" /></label>
        </div>
      </div>
`;

    let trade = { supplier: null };   // result of Step 1, used by later steps

    function findType() { return FIND_TYPES.find(t => t.key === document.getElementById('find-type').value); }

    function updateFindLabels() {
      const t = findType();
      document.getElementById('lbl-skill').textContent = t.skill;
      document.getElementById('lbl-char').textContent = t.char;
    }

    function rollFind() {
      const t = findType();
      const src = TC.readWorld('src');
      const out = document.getElementById('step1');
      trade.goods = null; document.getElementById('step2').innerHTML = '';

      if (t.online && src.tl < 8) {
        out.innerHTML = '<div class="calc-block"><div class="calc-empty">Online suppliers and brokers are only available on worlds of TL8 or higher. Choose another option or change the world.</div></div>';
        trade.supplier = null; syncGoodsButton(); TC.save(); return;
      }

      const level = TC.num('find-level'), charDM = TC.num('find-dm'), prev = TC.num('find-prev');
      const portDM = STARPORT_FIND_DM[src.port] || 0;
      const rows = [
        [t.skill + ' skill', level],
        [t.char + ' characteristic DM', charDM],
        ['Starport ' + src.port + ' (supplier/broker bonus)', portDM],
        ['Previous attempts this month (−1 each)', -prev]
      ];
      const dm = TC.sum(rows.map(r => r[1]));
      const dice = [TC.d6(), TC.d6()], total = TC.sum(dice) + dm;
      const time = TC.d6();
      const success = total >= 8;

      let html = '<div class="calc-result-title">STEP 1 — FIND A ' + t.label.toUpperCase() + '</div><div class="calc-block">';
      html += `<div class="calc-roll-line">${t.skill} check: 2D [${dice.join('+')}] ${TC.signed(dm)} = <b>${total}</b> vs 8+ → <b style="color:${success ? '#00ffaa' : '#ff5a4a'}">${success ? 'SUCCESS' : 'FAILED'}</b>
        &nbsp;·&nbsp; Took 1D [${time}] = <b>${time} ${t.unit === 'days' ? (time === 1 ? 'day' : 'days') : (time === 1 ? 'hour' : 'hours')}</b></div>${TC.dmList(rows)}`;

      if (success) {
        const s = { kind: t.key, label: t.label, illegal: t.illegal, online: t.online, broker: t.broker };
        if (t.broker) {
          const bd = [TC.d6(), TC.d6()];
          const sk = Math.floor(TC.sum(bd) / 3);
          s.brokerSkill = sk; s.brokerSkillName = t.brokerSkill; s.fee = t.fee; s.negotiationDM = 2;
          html += `<div class="calc-note" style="margin-top:10px"><b>${t.label} found.</b> Their ${t.brokerSkill} skill: 2D [${bd.join('+')}] = ${TC.sum(bd)} ÷ 3 (round down) = <b>${sk}</b>.
            They charge <b>${t.fee}%</b> of the gross proceeds of each transaction and add <b>DM+2</b> to negotiations.</div>`;
        } else {
          html += `<div class="calc-note" style="margin-top:10px"><b>${t.label} found.</b> You negotiate the deals yourself.</div>`;
        }
        if (t.illegal) html += '<div class="calc-note">Illegal goods are available from this contact. Selling them on a world risks fines or imprisonment (see Law Levels, p.255).</div>';
        trade.supplier = s;
      } else {
        html += '<div class="calc-empty" style="margin-top:10px">No ' + t.label.toLowerCase() + ' found. You can search again (each attempt this month is DM−1).</div>';
        trade.supplier = null;
      }
      html += '</div>';
      out.innerHTML = html;

      // each attempt counts against the next one this month
      document.getElementById('find-prev').value = prev + 1;
      syncGoodsButton();
      TC.save();
    }

    // ── Step 2: Goods available ──
    // Modified Price table, Purchase column (p.243): total -> % of base price
    const PURCHASE_PCT = { '-2':250,'-1':200,'0':175,'1':150,'2':135,'3':125,'4':120,'5':115,'6':110,'7':105,'8':100,
      '9':95,'10':90,'11':85,'12':80,'13':75,'14':70,'15':65,'16':60,'17':55,'18':50,'19':45,'20':40,'21':35,
      '22':30,'23':25,'24':20 };
    function purchasePct(t) { return t <= -3 ? 300 : t >= 25 ? 15 : PURCHASE_PCT[String(t)]; }

    function worldCodeSet() {
      const set = new Set();
      for (let i = 0; i < 5; i++) { const v = document.getElementById('tc-' + i).value; if (v) set.add(v); }
      const zone = TC.readWorld('src').zone;
      if (zone === 'Amber' || zone === 'Red') set.add(zone);
      return set;
    }

    // largest matching DM from one column (none matching = 0)
    function bestDM(list, codes) {
      const hit = list.filter(([c]) => codes.has(c));
      if (!hit.length) return { dm: 0, label: 'none' };
      const top = hit.reduce((a, b) => (b[1] > a[1] ? b : a));
      return { dm: top[1], label: top[0] + ' ' + TC.signed(top[1]) };
    }

    function goodsById(id) { return TRADE_GOODS.find(g => g.id === id); }

    function makeItem(g, kind, ctx) {
      // quantity: dice total + population DM (min 0), times the multiplier
      const dice = TC.rollDice(g.tons[0]);
      const qtyTotal = Math.max(0, TC.sum(dice) + ctx.popDM);
      const tons = qtyTotal * g.tons[1];
      // price: 3D + skill (+ broker DM) + Purchase DM - Sale DM - supplier Broker
      const pd = [TC.d6(), TC.d6(), TC.d6()];
      const buy = bestDM(g.buy, ctx.codes), sell = bestDM(g.sell, ctx.codes);
      const total = TC.sum(pd) + ctx.skill + ctx.brokerDM + buy.dm - sell.dm - ctx.supplierBroker;
      const pct = purchasePct(total);
      return {
        id: g.id, name: g.name, example: g.example, illegal: !!g.illegal, kind, tons, price: Math.round(g.price * pct / 100),
        base: g.price, pct, mod: pct - 100, extra: 0,
        qtyText: g.tons[0] + 'D [' + dice.join('+') + ']' + (ctx.popDM ? ' ' + TC.signed(ctx.popDM) + ' (population)' : '') +
          (g.tons[1] > 1 ? ' × ' + g.tons[1] : '') + ' = ' + tons + ' tons',
        priceText: '3D [' + pd.join('+') + '] ' + TC.signed(ctx.skill) + ' ' + ctx.skillLabel +
          (ctx.brokerDM ? ' ' + TC.signed(ctx.brokerDM) + ' local broker' : '') + ' ' + TC.signed(buy.dm) + ' Purchase DM (' + buy.label + ') ' +
          TC.signed(-sell.dm) + ' Sale DM (' + sell.label + ') ' + TC.signed(-ctx.supplierBroker) + ' supplier Broker = ' + total +
          ' → ' + pct + '% of ' + TC.cr(g.price)
      };
    }

    function findGoods() {
      const s = trade.supplier;
      if (!s || trade.goods) return;
      const src = TC.readWorld('src');
      const codes = worldCodeSet();
      const ctx = {
        codes,
        popDM: src.pop <= 3 ? -3 : src.pop >= 9 ? 3 : 0,
        skill: s.broker ? s.brokerSkill : TC.num('my-broker'),
        skillLabel: s.broker ? "local broker's Broker skill" : 'your Broker skill',
        brokerDM: s.broker ? 2 : 0,
        supplierBroker: TC.num('sup-broker')
      };
      const items = new Map();
      const add = (g, kind) => { if (!items.has(g.id)) items.set(g.id, makeItem(g, kind, ctx)); };

      if (s.illegal) {
        // illicit contact: only the illegal goods for this world's codes (random rolls below may add more)
        TRADE_GOODS.filter(g => g.illegal && g.codes.some(c => codes.has(c))).forEach(g => add(g, 'illegal'));
      } else {
        TRADE_GOODS.filter(g => g.codes === 'all').forEach(g => add(g, 'common'));
        TRADE_GOODS.filter(g => g.codes !== 'all' && !g.illegal && g.codes.some(c => codes.has(c))).forEach(g => add(g, 'code'));
      }

      // random extras: one roll per point of Population (d56, or d66 for illegal contacts)
      const rolls = [];
      let exotics = 0;
      for (let i = 0; i < src.pop; i++) {
        const first = s.illegal ? Math.floor(Math.random() * 6) + 1 : Math.floor(Math.random() * 5) + 1;
        const id = first * 10 + TC.d6();
        rolls.push(id);
        if (id === 66) { exotics++; continue; }
        const g = goodsById(id);
        if (items.has(id)) {
          const it = items.get(id);                 // repeat: add tons, keep the first price
          const dice = TC.rollDice(g.tons[0]);
          const more = Math.max(0, TC.sum(dice) + ctx.popDM) * g.tons[1];
          it.tons += more; it.extra++;
          it.qtyText += ' &nbsp;+&nbsp; random repeat: ' + g.tons[0] + 'D [' + dice.join('+') + ']' + (g.tons[1] > 1 ? ' × ' + g.tons[1] : '') + ' = ' + more + ' tons';
        } else {
          items.set(id, makeItem(g, 'random', ctx));
        }
      }

      const list = [...items.values()];
      const shown = list.filter(i => i.tons > 0), hidden = list.length - shown.length;
      shown.forEach(i => { i.bought = 0; });
      trade.goods = shown;
      trade.goodsMeta = { hidden, rolls, exotics };
      trade.loadMsg = '';
      renderGoods();
      syncGoodsButton();
      TC.save();
    }

    function goodsRow(i) {
      const left = i.tons - (i.bought || 0);
      const good = i.mod < 0, flat = i.mod === 0;
      const col = good ? '#00ffaa' : flat ? '#b0d8e8' : '#ff5a4a';
      const pctText = (i.mod > 0 ? '+' : i.mod < 0 ? '−' : '') + Math.abs(i.mod) + '%';
      return `<div class="good-row">
        <div class="good-main"><b>${i.name}</b> (${i.id})
          <span class="good-tons">${left} ton${left === 1 ? '' : 's'}</span>
          <span>price: <b>${TC.cr(i.price)}</b> per ton <b style="color:${col}">(${pctText})</b></span>
          ${i.illegal ? '<span class="good-badge" style="color:#ff5a4a">ILLEGAL</span>' : ''}
          ${i.extra ? '<span class="good-badge">rolled again ×' + i.extra + '</span>' : ''}
          ${i.bought ? '<span class="good-badge">' + i.bought + ' loaded</span>' : ''}
          ${left > 0 ? '<label class="good-buy">Buy <input type="number" id="buy-' + i.id + '" min="0" max="' + left + '" value="0" oninput="updateBuyTotals()" /> tons</label>' : '<span class="good-badge">all purchased</span>'}
        </div>
        <div class="good-ex">${i.example}</div>
        <details class="dm-detail"><summary>How this was worked out</summary>
          <div>Quantity: ${i.qtyText}</div><div>Price: ${i.priceText}</div></details>
      </div>`;
    }

    function renderGoods() {
      const shown = trade.goods || [], m = trade.goodsMeta || { hidden: 0, rolls: [], exotics: 0 }, s = trade.supplier;
      if (!s) return;
      const sec = (title, kind) => {
        const rows = shown.filter(i => i.kind === kind).sort((a, b) => a.id - b.id);
        return rows.length ? `<div class="calc-block"><div class="calc-block-title">${title}</div>${rows.map(goodsRow).join('')}</div>` : '';
      };
      let html = '<div class="calc-result-title" style="margin-top:20px">STEP 2 — GOODS AVAILABLE</div>';
      html += `<div class="calc-note">Supplier: <b>${s.label}</b>${s.broker ? ' (broker skill ' + s.brokerSkill + ', ' + s.fee + '% fee, DM+2)' : ''}.
        A green % is below the base price (a good deal); red is above it.</div>`;
      if (s.illegal) {
        html += sec("Illegal Goods for this world's trade codes", 'illegal');
        if (!shown.some(i => i.kind === 'illegal')) html += '<div class="calc-note">No illegal goods match this world\'s trade codes.</div>';
        html += sec('Random Goods', 'random');
      } else {
        html += sec("Trade Goods for this world's trade codes", 'code');
        html += sec('Random Goods', 'random');
        html += sec('Common Goods (available everywhere)', 'common');
      }
      if (m.exotics) {
        html += `<div class="calc-block" style="border-color:#ffb020">
          <div class="calc-block-title" style="color:#ffb020">Exotic Goods (66)${m.exotics > 1 ? ' × ' + m.exotics : ''}</div>
          <div class="calc-note" style="margin:0">Exotic goods were rolled. They fall outside the normal trade rules (alien relics, prototype technology, unique life, priceless treasures and so on). <b>Consult with the Referee.</b></div>
        </div>`;
      }
      html += `<div class="calc-note">Random rolls (${m.rolls.length}, ${s.illegal ? 'd66' : 'd56'}): ${m.rolls.length ? m.rolls.join(', ') : 'none (Population 0)'}.
        ${m.hidden ? m.hidden + ' good' + (m.hidden === 1 ? '' : 's') + ' had no quantity available.' : ''}</div>`;
      html += `<div class="calc-block calc-row">
        <div class="calc-block-title">Purchase</div>
        <span id="buy-summary">0 tons selected</span>
        <button class="btn-primary" onclick="loadGoods()">Load onto Active Ship</button>
        <span id="load-msg" class="calc-note" style="margin:0">${trade.loadMsg || ''}</span>
      </div>`;
      document.getElementById('step2').innerHTML = html;
    }

    // tons chosen per good (clamped to what is left)
    function buyPicks() {
      return (trade.goods || []).map(i => {
        const el = document.getElementById('buy-' + i.id);
        const left = i.tons - (i.bought || 0);
        const n = el ? Math.max(0, Math.min(parseInt(el.value, 10) || 0, left)) : 0;
        return { i, n };
      }).filter(p => p.n > 0);
    }

    function updateBuyTotals() {
      const picks = buyPicks();
      const tons = picks.reduce((t, p) => t + p.n, 0);
      const cost = picks.reduce((t, p) => t + p.n * p.i.price, 0);
      document.getElementById('buy-summary').innerHTML = '<b>' + tons + ' ton' + (tons === 1 ? '' : 's') + '</b> selected · total <b>' + TC.cr(cost) +
        '</b> <span style="color:#4a9ab8">(any broker fee is settled after the sale)</span>';
    }

    function loadMessage(text, ok) {
      trade.loadMsg = '<span style="color:' + (ok ? '#00ffaa' : '#ff5a4a') + '">' + text + '</span>';
      const el = document.getElementById('load-msg');
      if (el) el.innerHTML = trade.loadMsg;
      TC.save();
    }

    async function loadGoods() {
      const picks = buyPicks();
      if (!picks.length) { loadMessage('Enter how many tons to buy of at least one good first.', false); return; }
      const total = picks.reduce((t, p) => t + p.n, 0);
      const world = document.getElementById('src-name').value.trim();
      try {
        const ship = await TC.activeShip();
        const { data: cargo, error: ce } = await supabaseClient.from('spacecraft_cargo').select('tonnage').eq('spacecraft_id', ship.id);
        if (ce) throw ce;
        const used = (cargo || []).reduce((t, r) => t + (parseFloat(r.tonnage) || 0), 0);
        const free = (parseFloat(ship.cargo_max) || 0) - used;
        if (total > free) {
          loadMessage('Not enough cargo space on ' + ship.name + ': you selected ' + total + ' tons but only ' + Math.max(0, free) + ' tons are free (capacity ' + (ship.cargo_max || 0) + ', loaded ' + used + ').', false);
          return;
        }
        const rows = picks.map(p => ({
          spacecraft_id: ship.id,
          description: p.i.name + ' (' + p.i.id + ') — bought at ' + TC.cr(p.i.price) + '/ton' + (world ? ' on ' + world : ''),
          tonnage: p.n,
          trade_good_id: p.i.id, purchase_price: p.i.price, base_price: p.i.base, origin_world: world || null, illegal: !!p.i.illegal
        }));
        const { error } = await supabaseClient.from('spacecraft_cargo').insert(rows);
        if (error) {
          if (/column|schema cache/i.test(error.message)) throw new Error('The cargo table needs the new trade columns. Run docs/cargo-trade-columns.sql in Supabase first.');
          throw error;
        }
        const cost = picks.reduce((t, p) => t + p.n * p.i.price, 0);
        picks.forEach(p => { p.i.bought = (p.i.bought || 0) + p.n; });
        trade.loadMsg = '<span style="color:#00ffaa">Loaded ' + total + ' ton' + (total === 1 ? '' : 's') + ' onto <b>' + ship.name + '</b> for ' + TC.cr(cost) +
          '. <a href="spacecraft-record.html" style="color:#00e5ff">View Spacecraft Record</a> (Finance &amp; Cargo tab).</span>';
        renderGoods();
        TC.save();
      } catch (e) { loadMessage('Could not load the cargo: ' + (e.message || e), false); }
    }

    function renderNegotiation() {
      const s = trade.supplier;
      const mine = document.getElementById('neg-mine'), b = document.getElementById('neg-broker');
      if (s && s.broker) {
        mine.style.display = 'none';
        b.style.display = 'inline';
        b.innerHTML = s.brokerSkillName + ' skill of the broker (2D/3) = <b>' + s.brokerSkill + '</b> &nbsp;+&nbsp; DM+2 (local) &nbsp;=&nbsp; <b>' + TC.signed(s.brokerSkill + 2) + '</b>';
      } else {
        mine.style.display = '';
        b.style.display = 'none';
      }
    }

    function syncGoodsButton() {
      renderNegotiation();
      const b = document.getElementById('goods-btn');
      const s = trade.supplier;
      b.disabled = !s || !!trade.goods;
      b.title = !s ? 'Find a supplier or broker first (Step 1)'
        : trade.goods ? 'To roll a new list, search for a supplier or broker again (Step 1)' : '';
    }

    updateFindLabels();
    TC.persist('speculative', () => trade, v => { trade = v || { supplier: null }; }, ['step1', 'step2']);
    updateFindLabels();
    syncGoodsButton();
  </script>
</body>
</html>
