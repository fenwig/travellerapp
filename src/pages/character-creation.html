    const DRAFT_TABLE = { 1: 'navy', 2: 'army', 3: 'marine', 4: 'merchant', 5: 'scout', 6: 'agent' };

    function careerData(id) { return CAREERS_DATA[id]; }

    // Some careers (Navy, Drifter) have a distinct Service Skills table
    // per assignment; others (Agent) share ONE Service Skills table across
    // all assignments and instead vary by a separate per-assignment
    // Specialist table. Career-level serviceSkills wins if present.
    function serviceSkillsFor(c, a) { return c.serviceSkills || a.serviceSkills; }

    // Union of a military career's Service Skills (career-level if shared,
    // else the union of each assignment's own table), de-duplicated.
    function militaryServiceSkillPool(branch) {
      const c = branch === 'Army' ? CAREERS_DATA.army : CAREERS_DATA.navy;
      if (!c) return [];
      if (c.serviceSkills) return c.serviceSkills;
      const seen = new Map();
      c.assignments.forEach(a => (a.serviceSkills || []).forEach(sk => {
        seen.set(skillKey(sk.name, sk.specialty), sk);
      }));
      return Array.from(seen.values());
    }

    function step5State() {
      return (draft.creation_data && draft.creation_data.step5) || { phase: 'choose', terms: 0, careerHistory: [], draftUsed: false };
    }

    async function saveStep5State(patch) {
      const data = draft.creation_data || {};
      data.step5 = Object.assign({}, step5State(), patch);
      draft.creation_data = data;
      await supabaseClient.from('characters').update({ creation_data: data }).eq('id', draft.id);
    }

    // ── Pending Modifiers — tracks +/- DMs and flags that an event or
    // benefit grants to a FUTURE roll, so they actually apply when that
    // roll happens instead of just being text. Numeric fields are
    // additive (multiple sources can stack) and consumed (zeroed) the
    // moment they're used; `autoPromote` is a one-shot flag.
    function pendingMods() {
      return (draft.creation_data && draft.creation_data.pendingMods) || {};
    }

    async function addPendingMod(key, amount) {
      const m = Object.assign({}, pendingMods());
      m[key] = (m[key] || 0) + amount;
      const data = draft.creation_data || {};
      data.pendingMods = m;
      draft.creation_data = data;
      await supabaseClient.from('characters').update({ creation_data: data }).eq('id', draft.id);
    }

    async function setPendingFlag(key, value) {
      const m = Object.assign({}, pendingMods());
      m[key] = value;
      const data = draft.creation_data || {};
      data.pendingMods = m;
      draft.creation_data = data;
      await supabaseClient.from('characters').update({ creation_data: data }).eq('id', draft.id);
    }

    async function consumePendingMod(key) {
      const m = pendingMods();
      const v = m[key] || 0;
      if (v) {
        const m2 = Object.assign({}, m);
        delete m2[key];
        const data = draft.creation_data || {};
        data.pendingMods = m2;
        draft.creation_data = data;
        await supabaseClient.from('characters').update({ creation_data: data }).eq('id', draft.id);
      }
      return v;
    }

    async function consumePendingFlag(key) {
      const m = pendingMods();
      const v = !!m[key];
      if (v) {
        const m2 = Object.assign({}, m);
        delete m2[key];
        const data = draft.creation_data || {};
        data.pendingMods = m2;
        draft.creation_data = data;
        await supabaseClient.from('characters').update({ creation_data: data }).eq('id', draft.id);
      }
      return v;
    }

    function gainSkillStep(skills, name, specialty) {
      const key = skillKey(name, specialty);
      const existing = skills[key];
      const newLevel = existing ? Math.min(4, existing.level + 1) : 1;
      skills[key] = { name, specialty: specialty || null, level: newLevel };
    }

    async function applyStatChange(key, amount) {
      const update = {};
      update[key] = (draft[key] || 0) + amount;
      await supabaseClient.from('characters').update(update).eq('id', draft.id);
      Object.assign(draft, update);
    }

    function currentAge() {
      return 18 + 4 * step5State().terms;
    }

    // ── Ageing — Core Rulebook p.48 ───────────────────────────
    // Begins at 34 (end of 4th term); rolled at the end of every term from
    // then on, DM = −(total terms served). Player chooses which
    // characteristics absorb the reduction. Reducing any characteristic to
    // 0 triggers an Ageing Crisis (pay 1D×Cr10000 or die).
    const AGEING_PHYS = ['str', 'dex', 'end_stat'];
    const AGEING_MENTAL = ['int_stat', 'edu', 'soc'];

    // ── Injury Table — Core Rulebook p.49 ─────────────────────
    // Triggered by mishaps/events whose text says "Roll on the Injury
    // table." A 1D roll, worst at 1 and trivial at 6. Physical
    // characteristics only (STR/DEX/END — reuses AGEING_PHYS).
    const INJURY_TABLE = [
      { roll: 1, text: 'Nearly killed — reduce one physical characteristic by 1D, and the other two physical characteristics by 2 each.' },
      { roll: 2, text: 'Severely injured — reduce one physical characteristic by 1D.' },
      { roll: 3, text: 'Missing an eye or limb — reduce STR or DEX by 2.' },
      { roll: 4, text: 'Scarred — reduce any physical characteristic by 2.' },
      { roll: 5, text: 'Injured — reduce any physical characteristic by 1.' },
      { roll: 6, text: 'Lightly injured — no permanent effect.' }
    ];

    // ── Life Events Table — Core Rulebook p.46 ────────────────
    // Triggered by mishaps/events whose text says "Life Event. Roll on
    // the Life Events table." 2D roll; roll 12 has its own 1D sub-table.
    const LIFE_EVENTS_TABLE = [
      { roll: 2, text: 'Sickness or Injury — roll on the Injury table.', injury: true, tools: [] },
      { roll: 3, text: 'Birth or Death — someone close to you dies or gives birth, and you are involved in some way.', tools: [] },
      { roll: 4, text: 'Ending of a Relationship — a romantic relationship of yours ends badly. Gain a Rival or Enemy.', tools: ['associate'] },
      { roll: 5, text: 'Improved Relationship — a relationship deepens. Gain an Ally.', tools: ['associate'] },
      { roll: 6, text: 'New Relationship — you become romantically involved with someone. Gain an Ally.', tools: ['associate'] },
      { roll: 7, text: 'New Contact — you gain a new Contact.', tools: ['associate'] },
      { roll: 8, text: 'Betrayal — a friend betrays you. Convert an existing Contact or Ally into a Rival or Enemy, or gain a fresh Rival/Enemy if you have neither.', tools: ['associate'] },
      { roll: 9, text: 'Travel — you move to another world. Gain DM+2 to your next qualification roll.', tools: [], autoDM: { key: 'qualificationDM', amount: 2 } },
      { roll: 10, text: 'Good Fortune — something good happens to you. Gain DM+2 to any one Benefit roll.', tools: [], autoDM: { key: 'benefitRollDM', amount: 2 } },
      { roll: 11, text: "Crime — you commit, suffer, or are accused of a crime. Lose one Benefit roll, or take the Prisoner career next term instead (Prisoner isn't built — note it yourself if you choose this).", tools: [], autoDM: { key: 'extraBenefitRolls', amount: -1 } },
      { roll: 12, text: 'Unusual Event — roll 1D for what happens.', unusual: true, tools: [] }
    ];

    const LIFE_EVENTS_UNUSUAL = {
      1: 'Psionics — you encounter a Psionic institute and may test your Psionic Strength (not tracked in this app).',
      2: 'Aliens — you spend time among an alien species. Gain Science 1 and a Contact among that species.',
      3: "Alien Artefact — you come into possession of a strange device not normally available to humans.",
      4: 'Amnesia — something happened to you, but you have no idea what.',
      5: 'Contact with Government — you briefly cross paths with the highest levels of the Imperium.',
      6: 'Ancient Technology — you have something older than the Imperium, or even older than humanity.'
    };

    function ageingRequirements(sum) {
      if (sum <= -6) return [{ type: 'phys', amount: 2 }, { type: 'phys', amount: 2 }, { type: 'phys', amount: 2 }, { type: 'mental', amount: 1 }];
      if (sum === -5) return [{ type: 'phys', amount: 2 }, { type: 'phys', amount: 2 }, { type: 'phys', amount: 2 }];
      if (sum === -4) return [{ type: 'phys', amount: 2 }, { type: 'phys', amount: 2 }, { type: 'phys', amount: 1 }];
      if (sum === -3) return [{ type: 'phys', amount: 2 }, { type: 'phys', amount: 1 }, { type: 'phys', amount: 1 }];
      if (sum === -2) return [{ type: 'phys', amount: 1 }, { type: 'phys', amount: 1 }, { type: 'phys', amount: 1 }];
      if (sum === -1) return [{ type: 'phys', amount: 1 }, { type: 'phys', amount: 1 }];
      if (sum === 0) return [{ type: 'phys', amount: 1 }];
      return [];
    }

    async function goToAgeingOrPhase(resumePhase) {
      const s = step5State();
      if (s.terms >= 4) {
        await saveStep5State({ phase: 'ageing', ageingRoll: null, ageingPicks: {}, ageingResumePhase: resumePhase });
      } else {
        await saveStep5State({ phase: resumePhase });
      }
      renderStep();
    }

    function renderCareerAgeing() {
      const s = step5State();
      const c = careerData(s.careerId);

      if (!s.ageingRoll) {
        return `
          <div class="rule-card wizard-card">
            <div class="wizard-card-title">Ageing — Age ${currentAge()}</div>
            <div class="wizard-card-sub">Roll 2D, DM−${s.terms} (your total terms served). (Core Rulebook p.48)</div>
            <div class="wizard-actions" style="justify-content:flex-start;">
              <button class="btn-outline" onclick="rollAgeing()">Roll Ageing</button>
            </div>
          </div>
        `;
      }

      const reqs = s.ageingReqs || [];
      const picks = s.ageingPicks || {};
      const allPicked = reqs.every((r, i) => picks[i]);

      if (!reqs.length) {
        return `
          <div class="rule-card wizard-card">
            <div class="wizard-card-title">Ageing — No Effect</div>
            <div class="wizard-card-sub">Rolled ${s.ageingRoll.total} (${s.ageingRoll.dice.join(' + ')} − ${s.terms}) — no effect this term.</div>
            <div class="wizard-actions"><button class="btn-outline" onclick="resumeAfterAgeing()">Continue</button></div>
          </div>
        `;
      }

      return `
        <div class="rule-card wizard-card">
          <div class="wizard-card-title">Ageing — Effects</div>
          <div class="wizard-card-sub">Rolled ${s.ageingRoll.total} (${s.ageingRoll.dice.join(' + ')} − ${s.terms}). Choose which characteristics absorb each reduction (your choice, Core p.48).</div>
          ${reqs.map((r, i) => {
            const pool = r.type === 'phys' ? AGEING_PHYS : AGEING_MENTAL;
            const labelMap = { str: 'STR', dex: 'DEX', end_stat: 'END', int_stat: 'INT', edu: 'EDU', soc: 'SOC' };
            return `
              <div class="wizard-field">
                <label>Reduce a ${r.type === 'phys' ? 'physical' : 'mental'} characteristic by ${r.amount}</label>
                <select onchange="pickAgeingTarget(${i}, this.value)">
                  <option value="">— choose —</option>
                  ${pool.map(k => `<option value="${k}" ${picks[i] === k ? 'selected' : ''}>${labelMap[k]} (currently ${draft[k]})</option>`).join('')}
                </select>
              </div>
            `;
          }).join('')}
          <div class="wizard-actions">
            <button class="btn-outline" onclick="applyAgeingPicks()" ${allPicked ? '' : 'disabled'}>Apply</button>
          </div>
        </div>
      `;
    }

    async function rollAgeing() {
      const s = step5State();
      const d1 = rollDie(), d2 = rollDie();
      const total = d1 + d2 - s.terms;
      const reqs = ageingRequirements(total);
      await saveStep5State({ ageingRoll: { dice: [d1, d2], total }, ageingReqs: reqs, ageingPicks: {} });
      await logCreation(`Ageing roll at age ${currentAge()}: ${total} (${d1}+${d2}−${s.terms})${reqs.length ? ' — characteristic reduction required.' : ' — no effect.'}`);
      if (!reqs.length) renderStep();
      else renderStep();
    }

    function pickAgeingTarget(idx, key) {
      const s = step5State();
      const picks = Object.assign({}, s.ageingPicks, { [idx]: key });
      saveStep5State({ ageingPicks: picks }).then(renderStep);
    }

    async function applyAgeingPicks() {
      const s = step5State();
      const reqs = s.ageingReqs || [];
      const picks = s.ageingPicks || {};
      for (let i = 0; i < reqs.length; i++) {
        await applyStatChange(picks[i], -reqs[i].amount);
      }
      const crisisKey = AGEING_PHYS.concat(AGEING_MENTAL).find(k => (draft[k] || 0) <= 0);
      await logCreation(`Ageing applied: ${reqs.map((r, i) => `${picks[i]} −${r.amount}`).join(', ')}.`);
      if (crisisKey) {
        await saveStep5State({ phase: 'ageingCrisis', ageingCrisisKey: crisisKey });
      } else {
        await resumeAfterAgeing();
        return;
      }
      renderStep();
    }

    function renderCareerAgeingCrisis() {
      const s = step5State();
      const labelMap = { str: 'STR', dex: 'DEX', end_stat: 'END', int_stat: 'INT', edu: 'EDU', soc: 'SOC' };
      return `
        <div class="rule-card wizard-card">
          <div class="wizard-card-title">Ageing Crisis — ${labelMap[s.ageingCrisisKey]} Reduced to 0</div>
          <div class="wizard-card-sub">The Traveller dies unless they pay 1D×Cr10000 for medical care, which restores any characteristic at 0 back to 1. Doing so means automatically failing all future qualification rolls.</div>
          <div class="wizard-actions" style="justify-content:flex-start; gap:12px;">
            <button class="btn-outline" onclick="payAgeingCrisis()">Pay for Medical Care</button>
            <button class="btn-outline-danger" onclick="dieFromAgeingCrisis()">Cannot Pay — Character Dies</button>
          </div>
        </div>
      `;
    }

    async function payAgeingCrisis() {
      const cost = rollDie() * 10000;
      await applyStatChange('cash_on_hand', -cost);
      const restores = {};
      AGEING_PHYS.concat(AGEING_MENTAL).forEach(k => { if ((draft[k] || 0) <= 0) restores[k] = 1; });
      await supabaseClient.from('characters').update(restores).eq('id', draft.id);
      Object.assign(draft, restores);
      const data = draft.creation_data || {};
      data.ageingCrisisOccurred = true;
      draft.creation_data = data;
      await supabaseClient.from('characters').update({ creation_data: data }).eq('id', draft.id);
      await logCreation(`Ageing Crisis — paid Cr${cost} for medical care. Will automatically fail all future qualification rolls.`);
      await resumeAfterAgeing();
    }

    async function dieFromAgeingCrisis() {
      await supabaseClient.from('characters').update({ status: 'deceased' }).eq('id', draft.id);
      await logCreation('Ageing Crisis — could not afford medical care. The Traveller has died.');
      document.getElementById('wizard-shell').innerHTML = `
        <div class="rule-card wizard-card">
          <div class="wizard-card-title">The Traveller Has Died</div>
          <div class="wizard-card-sub">This character record has been marked deceased.</div>
          <div class="wizard-actions"><button class="btn-outline" onclick="window.location.href='character-list.html'">Return to Roster</button></div>
        </div>
      `;
    }

    async function resumeAfterAgeing() {
      const s = step5State();
      await saveStep5State({ phase: s.ageingResumePhase || 'survival' });
      renderStep();
    }

    function renderStepCareer() {
      const s = step5State();
      switch (s.phase) {
        case 'qualify':         return renderCareerQualify();
        case 'qualifyResult':   return renderCareerQualifyResult();
        case 'draftOrDrifter':  return renderDraftOrDrifter();
        case 'draftResult':     return renderDraftResult();
        case 'assignment':      return renderCareerAssignment();
        case 'commission':      return renderCareerCommission();
        case 'survival':        return renderCareerSurvival();
        case 'mishap':          return renderCareerMishap();
        case 'events':          return renderCareerEvents();
        case 'advancement':     return renderCareerAdvancement();
        case 'skillTraining':   return renderCareerSkillTraining();
        case 'termEnd':         return renderCareerTermEnd();
        case 'mustering':       return renderCareerMustering();
        case 'musteringDone':   return renderCareerMusteringDone();
        case 'ageing':          return renderCareerAgeing();
        case 'ageingCrisis':    return renderCareerAgeingCrisis();
        default:                return renderCareerChoose();
      }
    }

    function renderCareerChoose() {
      const s = step5State();
      const rows = CAREER_LIST.map(c => {
        const built = !!CAREERS_DATA[c.id];
        return `
          <div style="display:flex; align-items:center; justify-content:space-between; padding:10px 14px; border:1px solid #0a4a60; border-radius:6px; margin-bottom:8px;">
            <span style="font-weight:600; ${built ? 'color:#00e5ff;' : 'color:#4a9ab8;'}">${c.name}</span>
            ${built
              ? `<button class="btn-outline" onclick="chooseCareer('${c.id}')">Attempt Qualification</button>`
              : `<span style="font-size:0.75rem; color:#4a9ab8;">Not yet built</span>`
            }
          </div>
        `;
      }).join('');

      return `
        <div class="rule-card wizard-card" style="max-width:none;">
          <div class="wizard-card-title">Choose a Career</div>
          <div class="wizard-card-sub">
            ${s.terms ? `Age ${currentAge()}, ${s.terms} term${s.terms === 1 ? '' : 's'} served so far.` : 'Pick a career to attempt qualification for.'}
            Only Navy and Drifter are fully built right now — the rest are listed for reference. (Core Rulebook pp.17-37)
          </div>
          ${s.forcedDraftNextTerm ? `
            <div style="border:1px solid #ff5a4a; border-radius:6px; padding:10px 14px; margin-bottom:14px; font-size:0.85rem;">
              A prior event forced a Draft roll this term instead of a free choice.
              <button class="btn-outline" style="margin-top:8px;" onclick="rollForcedDraft()">Roll the Draft</button>
            </div>
          ` : ''}
          ${rows}
          <div class="wizard-actions">
            <button class="btn-outline" onclick="goStep(4)">Back</button>
          </div>
        </div>
      `;
    }

    async function rollForcedDraft() {
      await saveStep5State({ forcedDraftNextTerm: false });
      await rollDraft();
    }

    async function chooseCareer(id) {
      await saveStep5State({ phase: 'qualify', careerId: id, qualResult: null });
      renderStep();
    }

    function renderCareerQualify() {
      const s = step5State();
      const c = careerData(s.careerId);
      const previousCount = (s.careerHistory || []).length;

      if (c.qualification.auto) {
        return `
          <div class="rule-card wizard-card">
            <div class="wizard-card-title">${c.name} — Qualification</div>
            <div class="wizard-card-sub">Automatic qualification.</div>
            <div class="wizard-actions" style="justify-content:flex-start;">
              <button class="btn-outline" onclick="doCareerQualify(true)">Confirm Entry</button>
            </div>
            <div class="wizard-actions">
              <button class="btn-outline" onclick="saveStep5State({phase:'choose'}).then(renderStep)">Back</button>
            </div>
          </div>
        `;
      }

      const statLabel = (CHARS.find(x => x.key === c.qualification.stat) || {}).label || c.qualification.stat.toUpperCase();
      const agePenalty = c.qualification.agePenalty && currentAge() >= c.qualification.agePenalty.minAge ? c.qualification.agePenalty.dm : 0;
      return `
        <div class="rule-card wizard-card">
          <div class="wizard-card-title">${c.name} — Qualification</div>
          <div class="wizard-card-sub">
            Roll 2D + ${statLabel} DM (need ${c.qualification.target}+).
            DM-1 for every previous career (${previousCount} so far${previousCount ? ', DM-' + previousCount : ''}).
            ${agePenalty ? `DM${agePenalty} for being age ${c.qualification.agePenalty.minAge}+.` : ''}
          </div>
          <div class="wizard-actions" style="justify-content:flex-start;">
            <button class="btn-outline" onclick="doCareerQualify(false)">Roll Qualification</button>
          </div>
          <div class="wizard-actions">
            <button class="btn-outline" onclick="saveStep5State({phase:'choose'}).then(renderStep)">Back</button>
          </div>
        </div>
      `;
    }

    async function doCareerQualify(auto) {
      const s = step5State();
      const c = careerData(s.careerId);
      let result;

      if (auto) {
        result = { success: true, auto: true };
      } else if (draft.creation_data && draft.creation_data.ageingCrisisOccurred) {
        result = { success: false, forcedByAgeingCrisis: true, dice: [0, 0], statDM: 0, previousCount: 0, agePenalty: 0, total: 0, target: c.qualification.target };
      } else {
        const d1 = rollDie(), d2 = rollDie();
        const previousCount = (s.careerHistory || []).length;
        const agePenalty = c.qualification.agePenalty && currentAge() >= c.qualification.agePenalty.minAge ? c.qualification.agePenalty.dm : 0;
        const statDM = dmNum(draft[c.qualification.stat]);
        const bonusDM = await consumePendingMod('qualificationDM');
        const total = d1 + d2 + statDM - previousCount + agePenalty + bonusDM;
        result = { dice: [d1, d2], statDM, previousCount, agePenalty, bonusDM, total, target: c.qualification.target, success: total >= c.qualification.target };
      }

      await saveStep5State({ phase: 'qualifyResult', qualResult: result });
      await logCreation(`${c.name} — Qualification ${result.success ? 'succeeded' : 'failed'}${result.total !== undefined ? ` (rolled ${result.total} vs ${result.target}+)` : ' (automatic)'}.`);
      renderStep();
    }

    function renderCareerQualifyResult() {
      const s = step5State();
      const c = careerData(s.careerId);
      const r = s.qualResult;

      if (r.success) {
        return `
          <div class="rule-card wizard-card">
            <div class="wizard-card-title">${c.name} — Qualified!</div>
            <div class="wizard-card-sub">${r.dice ? `Rolled ${r.total} (${r.dice.join(' + ')} + ${r.statDM} stat DM − ${r.previousCount} previous careers${r.agePenalty ? ' + ' + r.agePenalty + ' age' : ''}${r.bonusDM ? ' + ' + r.bonusDM + ' from a prior bonus' : ''}), needed ${r.target}+.` : 'Entry was automatic.'}</div>
            <div class="wizard-actions">
              <button class="btn-outline" onclick="goCareerAssignment()">Continue</button>
            </div>
          </div>
        `;
      }
      return `
        <div class="rule-card wizard-card">
          <div class="wizard-card-title">${c.name} — Qualification Failed</div>
          <div class="wizard-card-sub">${r.forcedByAgeingCrisis ? 'An Ageing Crisis means you automatically fail all qualification rolls from now on.' : `Rolled ${r.total} (${r.dice.join(' + ')} + ${r.statDM} − ${r.previousCount}${r.agePenalty ? ' + ' + r.agePenalty : ''}${r.bonusDM ? ' + ' + r.bonusDM + ' from a prior bonus' : ''}), needed ${r.target}+.`}</div>
          <div class="wizard-card-sub">You must either submit to the Draft (if you haven't already in this lifetime) or spend this term as a Drifter.</div>
          <div class="wizard-actions" style="justify-content:flex-start; gap:12px;">
            <button class="btn-outline" onclick="saveStep5State({phase:'draftOrDrifter'}).then(renderStep)">Continue</button>
          </div>
        </div>
      `;
    }

    function renderDraftOrDrifter() {
      const s = step5State();
      return `
        <div class="rule-card wizard-card">
          <div class="wizard-card-title">Draft or Drifter</div>
          <div class="wizard-card-sub">Core Rulebook p.19. A Traveller may only enter the draft once in their lifetime.</div>
          <div class="wizard-actions" style="justify-content:flex-start; gap:12px;">
            <button class="btn-outline" onclick="rollDraft()" ${s.draftUsed ? 'disabled' : ''}>${s.draftUsed ? 'Draft Already Used' : 'Submit to the Draft'}</button>
            <button class="btn-outline" onclick="chooseCareer('drifter')">Become a Drifter This Term</button>
          </div>
        </div>
      `;
    }

    async function rollDraft() {
      const roll = rollDie();
      const branch = DRAFT_TABLE[roll];
      const built = !!CAREERS_DATA[branch];
      await saveStep5State({ draftUsed: true, phase: 'draftResult', draftRoll: roll, draftBranch: branch, draftBuilt: built });
      await logCreation(`Drafted: rolled ${roll} — ${branch}${built ? '' : ' (not yet built — substituting Drifter for this term)'}.`);
      renderStep();
    }

    function renderDraftResult() {
      const s = step5State();
      const branchName = (CAREER_LIST.find(c => c.id === s.draftBranch) || {}).name || s.draftBranch;
      return `
        <div class="rule-card wizard-card">
          <div class="wizard-card-title">Drafted: ${branchName}</div>
          <div class="wizard-card-sub">
            ${s.draftBuilt
              ? `You are automatically enlisted into ${branchName} for this term — no qualification roll needed.`
              : `${branchName} isn't built yet in this app — substituting the Drifter career for this term instead. Note this in your background notes if you'd like to track the real outcome.`}
          </div>
          <div class="wizard-actions">
            <button class="btn-outline" onclick="confirmDraftEntry()">Continue</button>
          </div>
        </div>
      `;
    }

    async function confirmDraftEntry() {
      const s = step5State();
      const id = s.draftBuilt ? s.draftBranch : 'drifter';
      await saveStep5State({ careerId: id, phase: 'assignment' });
      renderStep();
    }

    async function goCareerAssignment() {
      await saveStep5State({ phase: 'assignment' });
      renderStep();
    }

    function renderCareerAssignment() {
      const s = step5State();
      const c = careerData(s.careerId);
      return `
        <div class="rule-card wizard-card">
          <div class="wizard-card-title">${c.name} — Choose an Assignment</div>
          <div class="wizard-actions" style="justify-content:flex-start; gap:12px; flex-wrap:wrap;">
            ${c.assignments.map(a => `<button class="btn-outline" onclick="chooseAssignment('${a.key}')">${a.label}</button>`).join('')}
          </div>
        </div>
      `;
    }

    async function chooseAssignment(key) {
      const s = step5State();
      const c = careerData(s.careerId);
      const isFirstCareer = (s.careerHistory || []).length === 0;
      const assignment = c.assignments.find(a => a.key === key);
      const skills = Object.assign({}, draft.skills || {});

      let basicTrainingGrant = null;
      if (isFirstCareer) {
        const granted = serviceSkillsFor(c, assignment);
        granted.forEach(sk => grantSkillMin(skills, sk.name, sk.specialty, 0));
        basicTrainingGrant = granted.map(sk => `${sk.name}${sk.specialty ? ' (' + sk.specialty + ')' : ''} 0`).join(', ');
      }
      await supabaseClient.from('characters').update({ skills }).eq('id', draft.id);
      draft.skills = skills;

      await saveStep5State({
        assignmentKey: key, rank: 0, isOfficer: false, termInCareer: 0,
        basicTrainingDone: isFirstCareer, benefitRolls: 0,
        phase: 'survival', basicTrainingGrant
      });
      await logCreation(`${c.name} — chose ${assignment.label} assignment.${basicTrainingGrant ? ` Basic Training: gained ${basicTrainingGrant}.` : ''}`);
      renderStep();
    }

    function currentAssignment(s, c) { return c.assignments.find(a => a.key === s.assignmentKey); }

    function renderCareerSurvival() {
      const s = step5State();
      const c = careerData(s.careerId);
      const a = currentAssignment(s, c);
      const statLabel = (CHARS.find(x => x.key === a.survival.stat) || {}).label || a.survival.stat.toUpperCase();
      const r = s.survivalResult;

      if (!r) {
        return `
          <div class="rule-card wizard-card">
            <div class="wizard-card-title">${c.name} (${a.label}) — Term ${s.termInCareer + 1}, Survival</div>
            ${s.basicTrainingGrant ? `<div class="wizard-card-sub" style="color:#00ffaa;">Basic Training — gained: ${s.basicTrainingGrant}.</div>` : ''}
            <div class="wizard-card-sub">Roll 2D + ${statLabel} DM (need ${a.survival.target}+). A natural 2 always fails.</div>
            <div class="wizard-actions" style="justify-content:flex-start;">
              <button class="btn-outline" onclick="rollCareerSurvival()">Roll Survival</button>
            </div>
          </div>
        `;
      }

      if (r.success) {
        return `
          <div class="rule-card wizard-card">
            <div class="wizard-card-title">Survived</div>
            <div class="wizard-card-sub">Rolled ${r.total} (${r.dice.join(' + ')} + ${r.statDM}), needed ${a.survival.target}+.</div>
            <div class="wizard-actions">
              <button class="btn-outline" onclick="goCareerEvents()">Continue to Events</button>
            </div>
          </div>
        `;
      }
      return `
        <div class="rule-card wizard-card">
          <div class="wizard-card-title">Survival Failed</div>
          <div class="wizard-card-sub">Rolled ${r.total} (${r.dice.join(' + ')} + ${r.statDM}), needed ${a.survival.target}+. You must roll on the Mishap table.</div>
          <div class="wizard-actions">
            <button class="btn-outline" onclick="goCareerMishap()">Roll Mishap</button>
          </div>
        </div>
      `;
    }

    async function rollCareerSurvival() {
      const s = step5State();
      const c = careerData(s.careerId);
      const a = currentAssignment(s, c);
      const d1 = rollDie(), d2 = rollDie();
      const statDM = dmNum(draft[a.survival.stat]);
      const total = d1 + d2 + statDM;
      const success = (d1 + d2) !== 2 && total >= a.survival.target;
      await saveStep5State({ survivalResult: { dice: [d1, d2], statDM, total, success }, basicTrainingGrant: null });
      await logCreation(`${c.name} (${a.label}) — Survival: rolled ${total} (need ${a.survival.target}+) — ${success ? 'survived.' : 'failed.'}`);
      renderStep();
    }

    async function goCareerMishap() {
      await saveStep5State({ phase: 'mishap', mishapRoll: null, mishapResolved: false, autoGranted: null });
      renderStep();
    }

    function renderCareerMishap() {
      const s = step5State();
      const c = careerData(s.careerId);
      if (!s.mishapRoll) {
        return `
          <div class="rule-card wizard-card">
            <div class="wizard-card-title">${c.name} — Mishap</div>
            <div class="wizard-card-sub">This mishap forces you to leave the career immediately (unless its text says otherwise), and you lose this term's Benefit roll.</div>
            <div class="wizard-actions" style="justify-content:flex-start;">
              <button class="btn-outline" onclick="rollCareerMishap()">Roll 1D</button>
            </div>
          </div>
        `;
      }
      const m = c.mishaps.find(x => x.roll === s.mishapRoll);
      const bespoke = renderBespokeOutcome('mishap', s.careerId, 'mishap' + s.mishapRoll);
      return `
        <div class="rule-card wizard-card">
          <div class="wizard-card-title">${c.name} — Mishap ${s.mishapRoll}</div>
          <p style="margin-bottom:14px;">${m.text}</p>
          ${s.autoGranted ? `<div class="wizard-card-sub" style="color:#00ffaa;">Applied automatically: ${s.autoGranted}.</div>` : ''}
          ${bespoke !== null ? bespoke : renderGenericResolver('mishap', m.tools)}
          <div class="wizard-actions">
            ${m.noEject
              ? `<button class="btn-outline" onclick="continueCareerAfterMishap()" ${s.mishapResolved ? '' : 'disabled'}>Continue Career — Not Ejected</button>`
              : `<button class="btn-outline" onclick="leaveCareerAfterMishap()" ${s.mishapResolved ? '' : 'disabled'}>Leave Career</button>`
            }
          </div>
        </div>
      `;
    }

    // Applies an entry's unconditional autoSkill/autoDM grants (no player
    // choice involved) the moment it's rolled, and returns a description
    // of what was applied for the log line.
    async function applyAutoGrants(entry) {
      const parts = [];
      if (entry.autoSkill) {
        const skills = Object.assign({}, draft.skills || {});
        grantSkillMin(skills, entry.autoSkill.name, entry.autoSkill.specialty, entry.autoSkill.level);
        await supabaseClient.from('characters').update({ skills }).eq('id', draft.id);
        draft.skills = skills;
        parts.push(`${entry.autoSkill.name}${entry.autoSkill.specialty ? ' (' + entry.autoSkill.specialty + ')' : ''} ${entry.autoSkill.level}`);
      }
      if (entry.autoDM) {
        await addPendingMod(entry.autoDM.key, entry.autoDM.amount);
        parts.push(`banked DM${entry.autoDM.amount > 0 ? '+' : ''}${entry.autoDM.amount} (${entry.autoDM.key})`);
      }
      if (entry.autoStat) {
        await applyStatChange(entry.autoStat.key, entry.autoStat.amount);
        parts.push(`${entry.autoStat.key} ${entry.autoStat.amount > 0 ? '+' : ''}${entry.autoStat.amount}`);
      }
      return parts.join(', ');
    }

    async function rollCareerMishap() {
      const roll = rollDie();
      const s0 = step5State();
      const c = careerData(s0.careerId);
      const entry = c.mishaps.find(x => x.roll === roll);
      const granted = await applyAutoGrants(entry);
      await saveStep5State({ mishapRoll: roll, autoGranted: granted || null });
      await logCreation(`${c.name} — Mishap roll: ${roll} — ${entry.text}${granted ? ` Applied automatically: ${granted}.` : ''}`);
      renderStep();
    }

    async function leaveCareerAfterMishap() {
      await recordCareerHistory(false);
      const s = step5State();
      const newTerms = s.terms + 1;
      await supabaseClient.from('characters').update({ age: 18 + 4 * newTerms }).eq('id', draft.id);
      draft.age = 18 + 4 * newTerms;
      await saveStep5State({ terms: newTerms });
      await goToAgeingOrPhase('mustering');
    }

    async function continueCareerAfterMishap() {
      const s = step5State();
      const c = careerData(s.careerId);
      await logCreation(`${c.name} — survived the mishap without ejection; continuing this term.`);
      await saveStep5State({ phase: 'events', eventRoll: null, eventResolved: false, mishapRoll: null, mishapResolved: false });
      renderStep();
    }

    // ── Generic resolver — Grant Skill / Adjust Characteristic / Add Associate ──
    function renderGenericResolver(tag, tools, hideMarkButton) {
      tools = tools || [];
      const toolButtons = {
        skill: `<button class="btn-outline" onclick="openResolver('${tag}','skill')">Grant Skill</button>`,
        stat: `<button class="btn-outline" onclick="openResolver('${tag}','stat')">Adjust Characteristic</button>`,
        associate: `<button class="btn-outline" onclick="openResolver('${tag}','associate')">Add Associate</button>`,
        injury: `<button class="btn-outline" onclick="openInjuryResolver('${tag}')">Roll on the Injury Table</button>`,
        lifeEvent: `<button class="btn-outline" onclick="openLifeEventResolver('${tag}')">Roll a Life Event</button>`
      };
      return `
        <div style="display:flex; gap:10px; flex-wrap:wrap; margin-bottom:12px;">
          ${tools.map(t => toolButtons[t]).join('')}
          ${hideMarkButton ? '' : `<button class="btn-outline" onclick="markResolverDone('${tag}')">Mark Resolved / No Further Effect</button>`}
        </div>
        <div id="resolver-${tag}"></div>
      `;
    }

    function openResolver(tag, kind) {
      const el = document.getElementById('resolver-' + tag);
      if (kind === 'skill') {
        el.innerHTML = `
          <div class="wizard-field"><label>Skill</label>
            <select id="resolver-${tag}-skill">
              <option value="">— choose —</option>
              ${SKILLS.map(sk => `<option value="${sk.name}">${sk.name}</option>`).join('')}
            </select>
          </div>
          <div class="wizard-field"><label>Level</label>
            <input id="resolver-${tag}-level" type="number" min="0" max="4" value="1" />
          </div>
          <button class="btn-outline" onclick="applyResolverSkill('${tag}')">Apply</button>
        `;
      } else if (kind === 'stat') {
        el.innerHTML = `
          <div class="wizard-field"><label>Characteristic</label>
            <select id="resolver-${tag}-stat">${CHARS.map(c => `<option value="${c.key}">${c.label}</option>`).join('')}</select>
          </div>
          <div class="wizard-field"><label>Amount (+/-)</label><input id="resolver-${tag}-amount" type="number" value="1" /></div>
          <button class="btn-outline" onclick="applyResolverStat('${tag}')">Apply</button>
        `;
      } else {
        el.innerHTML = `
          <div class="wizard-field"><label>Type</label>
            <select id="resolver-${tag}-type">
              <option value="ally">Ally</option><option value="contact">Contact</option>
              <option value="rival">Rival</option><option value="enemy">Enemy</option>
            </select>
          </div>
          <div class="wizard-field"><label>Name</label><input id="resolver-${tag}-name" type="text" /></div>
          <button class="btn-outline" onclick="applyResolverAssociate('${tag}')">Apply</button>
        `;
      }
    }

    async function applyResolverSkill(tag) {
      const name = document.getElementById(`resolver-${tag}-skill`).value;
      const level = parseInt(document.getElementById(`resolver-${tag}-level`).value, 10) || 0;
      if (!name) return;
      const skills = Object.assign({}, draft.skills || {});
      grantSkillMin(skills, name, null, level);
      await supabaseClient.from('characters').update({ skills }).eq('id', draft.id);
      draft.skills = skills;
      await logCreation(`Resolved outcome — granted ${name} ${level}.`);
      document.getElementById('resolver-' + tag).innerHTML = `<p style="color:#00ffaa; font-size:0.85rem;">Applied.</p>`;
    }

    async function applyResolverStat(tag) {
      const key = document.getElementById(`resolver-${tag}-stat`).value;
      const amount = parseInt(document.getElementById(`resolver-${tag}-amount`).value, 10) || 0;
      await applyStatChange(key, amount);
      await logCreation(`Resolved outcome — ${key} ${amount > 0 ? '+' : ''}${amount}.`);
      document.getElementById('resolver-' + tag).innerHTML = `<p style="color:#00ffaa; font-size:0.85rem;">Applied.</p>`;
    }

    async function applyResolverAssociate(tag) {
      const type = document.getElementById(`resolver-${tag}-type`).value;
      const name = document.getElementById(`resolver-${tag}-name`).value.trim();
      if (!name) return;
      await addAssociate(type, name, 'Gained during a career term.');
      await logCreation(`Resolved outcome — gained ${name} as a ${type}.`);
      document.getElementById('resolver-' + tag).innerHTML = `<p style="color:#00ffaa; font-size:0.85rem;">Applied.</p>`;
    }

    function markResolverDone(tag) {
      if (tag === 'mishap') saveStep5State({ mishapResolved: true }).then(renderStep);
      else if (tag === 'event') saveStep5State({ eventResolved: true }).then(renderStep);
    }

    // ── Injury Table (Core p.49) — reachable from any mishap/event that
    // lists 'injury' as a tool. Reduces physical characteristics (reuses
    // AGEING_PHYS); always closes out via markResolverDone(tag).
    const INJURY_LABEL = { str: 'STR', dex: 'DEX', end_stat: 'END' };

    function openInjuryResolver(tag) {
      document.getElementById('resolver-' + tag).innerHTML =
        `<button class="btn-outline" onclick="rollInjuryTable('${tag}')">Roll 1D on the Injury Table</button>`;
    }

    function rollInjuryTable(tag) {
      const roll = rollDie();
      const entry = INJURY_TABLE.find(x => x.roll === roll);
      renderInjuryPicker(tag, roll, entry);
    }

    function renderInjuryPicker(tag, roll, entry) {
      const el = document.getElementById('resolver-' + tag);
      const picker = (id) => `<select id="${id}">${AGEING_PHYS.map(k => `<option value="${k}">${INJURY_LABEL[k]}</option>`).join('')}</select>`;
      let body = `<div style="margin-bottom:8px;">Rolled ${roll} — ${entry.text}</div>`;
      if (roll === 6) {
        body += `<button class="btn-outline" onclick="finishInjury('${tag}', null)">Continue</button>`;
      } else if (roll === 3) {
        body += `<select id="injury-pick-${tag}"><option value="str">STR</option><option value="dex">DEX</option></select>
          <button class="btn-outline" onclick="applyInjurySimple('${tag}', 2)">Apply −2</button>`;
      } else if (roll === 4 || roll === 5) {
        body += `${picker('injury-pick-' + tag)}
          <button class="btn-outline" onclick="applyInjurySimple('${tag}', ${roll === 4 ? 2 : 1})">Apply −${roll === 4 ? 2 : 1}</button>`;
      } else if (roll === 2) {
        body += `${picker('injury-pick-' + tag)}
          <button class="btn-outline" onclick="applyInjuryDie('${tag}')">Roll 1D and Apply</button>`;
      } else {
        body += `<div style="margin-bottom:6px; font-size:0.82rem; color:#4a9ab8;">Choose which characteristic takes the 1D hit — the other two automatically take −2 each.</div>
          ${picker('injury-pick-' + tag)}
          <button class="btn-outline" onclick="applyInjuryNearlyKilled('${tag}')">Roll 1D and Apply</button>`;
      }
      el.innerHTML = body;
    }

    async function applyInjurySimple(tag, amount) {
      const key = document.getElementById('injury-pick-' + tag).value;
      await applyStatChange(key, -amount);
      offerMedicalCare(tag, [{ key, amount }]);
    }

    async function applyInjuryDie(tag) {
      const key = document.getElementById('injury-pick-' + tag).value;
      const amt = rollDie();
      await applyStatChange(key, -amt);
      offerMedicalCare(tag, [{ key, amount: amt }]);
    }

    async function applyInjuryNearlyKilled(tag) {
      const key = document.getElementById('injury-pick-' + tag).value;
      const amt = rollDie();
      await applyStatChange(key, -amt);
      const others = AGEING_PHYS.filter(k => k !== key);
      for (const k of others) await applyStatChange(k, -2);
      offerMedicalCare(tag, [{ key, amount: amt }, ...others.map(k => ({ key: k, amount: 2 }))]);
    }

    // ── Medical Care (Core p.49) — restoring a lost characteristic costs
    // Cr5000/point. If injured during a career, roll 2D + rank on the
    // Medical Bills table for that career's coverage tier; the covered
    // portion is free, the rest (and all of it if no career is active)
    // goes straight to debt rather than being deducted from cash on hand,
    // per the user's call. No cap — debt can go as high as it needs to.
    const MEDICAL_BILLS_TIER = {
      army: 'A', navy: 'A', marine: 'A',
      agent: 'B', noble: 'B', scholar: 'B', entertainer: 'B', merchant: 'B', citizen: 'B',
      scout: 'C', rogue: 'C', drifter: 'C'
    };

    function medicalBillsCoverage(careerId, roll) {
      const tier = MEDICAL_BILLS_TIER[careerId];
      if (!tier) return 0;
      if (tier === 'A') return roll >= 8 ? 1 : roll >= 4 ? 0.75 : 0;
      if (tier === 'B') return roll >= 12 ? 1 : roll >= 8 ? 0.75 : roll >= 4 ? 0.5 : 0;
      return roll >= 12 ? 0.75 : roll >= 8 ? 0.5 : 0; // tier C
    }

    function offerMedicalCare(tag, reductions) {
      const desc = reductions.map(r => `${INJURY_LABEL[r.key]} −${r.amount}`).join(', ');
      saveMechanic(tag, { medCare: { reductions, desc } }).then(() => renderMedicalCareOffer(tag));
    }

    function renderMedicalCareOffer(tag) {
      const m = mechanicState(tag);
      const mc = m.medCare;
      const el = document.getElementById('resolver-' + tag);
      const rows = mc.reductions.map((r, i) => `
        <div style="margin-bottom:6px;">
          ${INJURY_LABEL[r.key]} lost ${r.amount} — restore
          <input id="medcare-${tag}-${i}" type="number" min="0" max="${r.amount}" value="0" style="width:50px;" /> point(s) at Cr5000 each
        </div>
      `).join('');
      el.innerHTML = `
        <div style="margin-bottom:8px;">${mc.desc}.</div>
        <div style="margin-bottom:8px; font-size:0.85rem; color:#4a9ab8;">Medical care can restore lost characteristics at Cr5000 per point. Unpaid (and any uncovered) cost goes to debt — no cap.</div>
        ${rows}
        <div class="wizard-actions" style="justify-content:flex-start; gap:10px; margin-top:8px;">
          <button class="btn-outline" onclick="confirmMedicalCare('${tag}')">Seek Medical Care</button>
          <button class="btn-outline" onclick="declineMedicalCare('${tag}')">Decline — Leave the Damage</button>
        </div>
      `;
    }

    async function declineMedicalCare(tag) {
      const m = mechanicState(tag);
      await finishInjury(tag, m.medCare.desc);
    }

    async function confirmMedicalCare(tag) {
      const m = mechanicState(tag);
      const mc = m.medCare;
      let totalPoints = 0;
      for (let i = 0; i < mc.reductions.length; i++) {
        const r = mc.reductions[i];
        const points = Math.max(0, Math.min(r.amount, parseInt(document.getElementById(`medcare-${tag}-${i}`).value, 10) || 0));
        totalPoints += points;
        if (points) await applyStatChange(r.key, points);
      }

      if (totalPoints === 0) {
        await finishInjury(tag, mc.desc);
        return;
      }

      const cost = totalPoints * 5000;
      const s = step5State();
      let coverage = 0, rollText = 'No career active — no coverage.';
      if (s.careerId && MEDICAL_BILLS_TIER[s.careerId]) {
        const roll = roll2d6() + (s.rank || 0);
        coverage = medicalBillsCoverage(s.careerId, roll);
        rollText = `Medical Bills roll: ${roll} (incl. rank ${s.rank || 0}) — ${Math.round(coverage * 100)}% covered.`;
      }
      const debtAdded = Math.round(cost * (1 - coverage));
      if (debtAdded > 0) await applyStatChange('debt', debtAdded);

      const resultText = `Restored ${totalPoints} point(s) for Cr${cost}. ${rollText}${debtAdded > 0 ? ` Cr${debtAdded} added to debt (total debt now Cr${(draft.debt || 0)}).` : ' Fully covered — no debt added.'}`;
      await logCreation(`Medical Care — ${resultText}`);
      await finishInjury(tag, `${mc.desc} (partially restored — see Creation Log)`, resultText);
    }

    async function finishInjury(tag, desc, medicalResultText) {
      document.getElementById('resolver-' + tag).innerHTML =
        `<p style="color:#00ffaa; font-size:0.85rem;">Injury resolved${desc ? ': ' + desc : ' (no permanent effect)'}.</p>` +
        (medicalResultText ? `<p style="color:#00ffaa; font-size:0.85rem;">${medicalResultText}</p>` : '');
      if (!medicalResultText) await logCreation(`Injury Table — ${desc || 'no permanent effect'}.`);
      markResolverDone(tag);
    }

    // ── Life Events Table (Core p.46) — reachable from any mishap/event
    // that lists 'lifeEvent' as a tool. Nests the generic resolver tools
    // for its own associate/skill grants, then closes out the parent tag.
    function openLifeEventResolver(tag) {
      document.getElementById('resolver-' + tag).innerHTML =
        `<button class="btn-outline" onclick="rollLifeEvent('${tag}')">Roll 2D for a Life Event</button>`;
    }

    function rollLifeEvent(tag) {
      const roll = roll2d6();
      const entry = LIFE_EVENTS_TABLE.find(x => x.roll === roll);
      logCreation(`Life Event roll: ${roll} — ${entry.text}`);
      renderLifeEventBody(tag, entry);
    }

    function renderLifeEventBody(tag, entry) {
      const el = document.getElementById('resolver-' + tag);
      let body = `<div style="margin-bottom:8px;">Rolled ${entry.roll} — ${entry.text}</div>`;
      if (entry.injury) {
        body += `<button class="btn-outline" onclick="openInjuryResolver('${tag}')">Roll on the Injury Table</button>`;
      } else if (entry.unusual) {
        body += `<button class="btn-outline" onclick="rollLifeEventUnusual('${tag}')">Roll 1D for the Unusual Event</button>`;
      } else {
        body += renderGenericResolver(tag + 'Life', entry.tools, true) +
          `<button class="btn-outline" onclick="finishLifeEvent('${tag}')">Mark Resolved</button>`;
      }
      el.innerHTML = body;
      if (entry.autoDM) {
        addPendingMod(entry.autoDM.key, entry.autoDM.amount);
        logCreation(`Life Event — banked DM${entry.autoDM.amount > 0 ? '+' : ''}${entry.autoDM.amount} (${entry.autoDM.key}).`);
      }
    }

    function rollLifeEventUnusual(tag) {
      const roll = rollDie();
      document.getElementById('resolver-' + tag).innerHTML =
        `<p style="color:#00ffaa; font-size:0.85rem;">${LIFE_EVENTS_UNUSUAL[roll]}</p>`;
      logCreation(`Life Event — Unusual Event roll ${roll}: ${LIFE_EVENTS_UNUSUAL[roll]}`);
      markResolverDone(tag);
    }

    function finishLifeEvent(tag) {
      markResolverDone(tag);
    }

    // ── Bespoke event/mishap mechanics ────────────────────────
    // For rolls whose text calls for a specific roll/choice beyond the
    // generic resolver (e.g. "throw Gambler 8+ for an extra Benefit roll,
    // lose one if you fail"), this replaces the generic resolver with the
    // real mechanic. Resolution still writes into s.eventMechanic /
    // s.mishapMechanic and flips eventResolved/mishapResolved so the
    // existing Continue/Leave gating keeps working unchanged.
    function bespokeKey(careerId, roll) { return careerId + ':' + roll; }

    function mechanicState(tag) {
      const s = step5State();
      return (tag === 'mishap' ? s.mishapMechanic : s.eventMechanic) || {};
    }

    async function saveMechanic(tag, patch) {
      const key = tag === 'mishap' ? 'mishapMechanic' : 'eventMechanic';
      const merged = Object.assign({}, mechanicState(tag), patch);
      await saveStep5State({ [key]: merged });
    }

    async function resolveMechanic(tag) {
      const key = tag === 'mishap' ? 'mishapResolved' : 'eventResolved';
      await saveStep5State({ [key]: true });
    }

    function renderBespokeOutcome(tag, careerId, roll) {
      const key = bespokeKey(careerId, roll);
      const m = mechanicState(tag);
      switch (key) {
        case 'navy:2':
        case 'drifter:2':   return renderInlineMishapNotEjected(tag, careerId, m);
        case 'navy:3':      return renderOptionalSkillRollForBenefit(tag, m, ['Gambler', 'Deception'], 'Gambler', 8);
        case 'navy:5':      return renderRollSkillToGainLevel(tag, m, 'edu', 8);
        case 'navy:9':      return renderAutoAssociatePlusDM(tag, m, 'enemy', 'advancementDM', 2);
        case 'navy:10':     return renderAcceptRefuse(tag, m, 'Abuse your position — extra Benefit roll this term', 'Refuse — DM+2 to your next advancement roll', () => addPendingMod('extraBenefitRolls', 1), () => addPendingMod('advancementDM', 2));
        case 'navy:11':     return renderChooseSkillOrDM(tag, m, { name: 'Tactics', specialty: 'Naval', level: 1 }, 'advancementDM', 4);
        case 'navy:12':     return renderBankAutoPromote(tag, m);
        case 'drifter:3':   return renderAcceptRefuse(tag, m, 'Accept the job — DM+4 to your next qualification roll (you owe a favour)', 'Decline', () => addPendingMod('qualificationDM', 4), () => Promise.resolve());
        case 'drifter:9':   return renderDrifterAdventureRoll(tag, m);
        case 'drifter:11':  return renderForcedDraftNextTerm(tag, m);
        case 'drifter:12':  return renderBankAutoPromote(tag, m);
        case 'navy:mishap3': return renderNavyMishap3(tag, m);
        case 'navy:mishap4': return renderNavyMishap4(tag, m);
        case 'agent:2':     return renderInlineMishapNotEjected(tag, careerId, m);
        case 'agent:3':     return renderAgentEvent3(tag, m);
        case 'agent:5':     return renderGainDiceAssociates(tag, m, 'contact', 3);
        case 'agent:6':     return renderRollSkillToGainLevel(tag, m, 'edu', 8);
        case 'agent:8':     return renderAgentEvent8(tag, m);
        case 'agent:9':     return renderBankPendingMod(tag, m, 'DM+2 to your next advancement roll', 'advancementDM', 2);
        case 'agent:11':    return renderChooseSkillOrDM(tag, m, { name: 'Investigate', level: 1 }, 'advancementDM', 4);
        case 'agent:12':    return renderBankAutoPromote(tag, m);
        case 'agent:mishap2': return renderAgentMishap2(tag, m);
        case 'agent:mishap3': return renderAgentMishap3(tag, m);
        case 'army:2':       return renderInlineMishapNotEjected(tag, careerId, m);
        case 'army:6':       return renderArmyEvent6(tag, m);
        case 'army:8':       return renderRollSkillToGainLevel(tag, m, 'edu', 8);
        case 'army:11':      return renderChooseSkillOrDM(tag, m, { name: 'Tactics', specialty: 'Military', level: 1 }, 'advancementDM', 4);
        case 'army:12':      return renderBankAutoPromote(tag, m);
        case 'army:mishap3': return renderArmyMishap3(tag, m);
        case 'army:mishap4': return renderArmyMishap4(tag, m);
        default: return null;
      }
    }

    function resolverHeader(text) {
      return `<div class="wizard-card-sub" style="margin-bottom:10px;">${text}</div>`;
    }

    // "Gain SkillA 1 or SkillB 1. You may throw SkillX 8+: success gains an
    // extra Benefit roll, failure loses one." (Navy event 3)
    function renderOptionalSkillRollForBenefit(tag, m, skillChoices, rollSkill, target) {
      if (!m.skillChosen) {
        return resolverHeader('Choose which skill to gain:') + `
          <div class="wizard-actions" style="justify-content:flex-start; gap:10px; margin-top:0;">
            ${skillChoices.map(name => `<button class="btn-outline" onclick="pickOptionalSkill('${tag}','${name}')">${name} 1</button>`).join('')}
          </div>
        `;
      }
      if (!m.rollOffered) {
        return resolverHeader(`Gained ${m.skillChosen} 1. You may throw ${rollSkill} ${target}+ for an extra Benefit roll (lose one if you fail).`) + `
          <div class="wizard-actions" style="justify-content:flex-start; gap:10px; margin-top:0;">
            <button class="btn-outline" onclick="rollOptionalBenefit('${tag}','${rollSkill}',${target})">Throw ${rollSkill} ${target}+</button>
            <button class="btn-outline" onclick="declineOptionalBenefit('${tag}')">Don't Risk It</button>
          </div>
        `;
      }
      return resolverHeader(m.resultText) ;
    }

    async function pickOptionalSkill(tag, name) {
      const skills = Object.assign({}, draft.skills || {});
      grantSkillMin(skills, name, null, 1);
      await supabaseClient.from('characters').update({ skills }).eq('id', draft.id);
      draft.skills = skills;
      await saveMechanic(tag, { skillChosen: name });
      await logCreation(`Gained ${name} 1.`);
      renderStep();
    }

    async function rollOptionalBenefit(tag, rollSkill, target) {
      const key = skillKey(rollSkill, null);
      const level = draft.skills && draft.skills[key] ? draft.skills[key].level : -3;
      const total = roll2d6() + level;
      const success = total >= target;
      await addPendingMod('extraBenefitRolls', success ? 1 : -1);
      await saveMechanic(tag, { rollOffered: true, resultText: `Rolled ${total} (need ${target}+) — ${success ? 'gained an extra Benefit roll.' : 'lost one Benefit roll.'}` });
      await resolveMechanic(tag);
      await logCreation(`Rolled ${total} on ${rollSkill} (need ${target}+) — ${success ? 'extra Benefit roll.' : 'lost a Benefit roll.'}`);
      renderStep();
    }

    async function declineOptionalBenefit(tag) {
      await saveMechanic(tag, { rollOffered: true, resultText: 'Declined the risk — no change to Benefit rolls.' });
      await resolveMechanic(tag);
      renderStep();
    }

    // "Roll STAT 8+ to gain one level in any skill you already have." (Navy event 5)
    function renderRollSkillToGainLevel(tag, m, statKey, target) {
      const owned = Object.keys(draft.skills || {}).map(k => draft.skills[k]);
      if (!owned.length) {
        return resolverHeader('You have no skills yet to improve — nothing to roll for.') +
          `<button class="btn-outline" onclick="markMechanicResolved('${tag}')">Continue</button>`;
      }
      if (!m.chosenKey) {
        return resolverHeader('Choose a skill you already have:') + `
          <select id="skillgain-${tag}">
            ${owned.map(o => `<option value="${skillKey(o.name, o.specialty)}">${o.name}${o.specialty ? ' (' + o.specialty + ')' : ''} ${o.level}</option>`).join('')}
          </select>
          <button class="btn-outline" onclick="chooseSkillGainTarget('${tag}')">Choose</button>
        `;
      }
      if (!m.rolled) {
        const statLabel = (CHARS.find(x => x.key === statKey) || {}).label || statKey.toUpperCase();
        return resolverHeader(`Roll 2D + ${statLabel} DM (need ${target}+) to increase ${m.chosenKey}.`) + `
          <button class="btn-outline" onclick="rollSkillGain('${tag}','${statKey}',${target})">Roll</button>
        `;
      }
      return resolverHeader(m.resultText);
    }

    async function chooseSkillGainTarget(tag) {
      const key = document.getElementById('skillgain-' + tag).value;
      await saveMechanic(tag, { chosenKey: key });
      renderStep();
    }

    async function rollSkillGain(tag, statKey, target) {
      const m = mechanicState(tag);
      const total = roll2d6() + dmNum(draft[statKey]);
      const success = total >= target;
      if (success) {
        const skills = Object.assign({}, draft.skills || {});
        const owned = skills[m.chosenKey];
        bumpSkill(skills, owned.name, owned.specialty, 1);
        await supabaseClient.from('characters').update({ skills }).eq('id', draft.id);
        draft.skills = skills;
      }
      await saveMechanic(tag, { rolled: true, resultText: `Rolled ${total} (need ${target}+) — ${success ? 'gained a level.' : 'no improvement this time.'}` });
      await resolveMechanic(tag);
      await logCreation(`Skill-gain roll: ${total} (need ${target}+) on ${m.chosenKey} — ${success ? 'success.' : 'failed.'}`);
      renderStep();
    }

    function markMechanicResolved(tag) { resolveMechanic(tag).then(renderStep); }

    // Gain an Enemy/Rival automatically, plus an automatic DM to a future roll.
    function renderAutoAssociatePlusDM(tag, m, type, dmKey, amount) {
      if (m.resolved) return resolverHeader(m.resultText);
      return resolverHeader(`Name the ${type === 'enemy' ? 'Enemy' : 'Rival'} you gained:`) + `
        <input id="assoc-${tag}" type="text" placeholder="Name" />
        <button class="btn-outline" onclick="confirmAutoAssociate('${tag}','${type}','${dmKey}',${amount})">Confirm</button>
      `;
    }

    async function confirmAutoAssociate(tag, type, dmKey, amount) {
      const name = document.getElementById('assoc-' + tag).value.trim() || 'Unnamed';
      await addAssociate(type, name, 'Gained during a career term.');
      await addPendingMod(dmKey, amount);
      await saveMechanic(tag, { resolved: true, resultText: `Gained ${name} as a ${type}. Banked DM${amount > 0 ? '+' : ''}${amount} to your next roll.` });
      await resolveMechanic(tag);
      await logCreation(`Gained ${name} as a ${type}; banked DM${amount > 0 ? '+' : ''}${amount} to a future roll.`);
      renderStep();
    }

    // Accept/Refuse style choice with two different consequences.
    function renderAcceptRefuse(tag, m, acceptLabel, refuseLabel, onAccept, onRefuse) {
      if (m.resolved) return resolverHeader(m.resultText);
      window.__acceptRefuse = window.__acceptRefuse || {};
      window.__acceptRefuse[tag] = { onAccept, onRefuse };
      return `
        <div class="wizard-actions" style="justify-content:flex-start; gap:10px; margin-top:0;">
          <button class="btn-outline" onclick="chooseAcceptRefuse('${tag}', true)">${acceptLabel}</button>
          <button class="btn-outline" onclick="chooseAcceptRefuse('${tag}', false)">${refuseLabel}</button>
        </div>
      `;
    }

    async function chooseAcceptRefuse(tag, accepted) {
      const handlers = (window.__acceptRefuse || {})[tag];
      if (handlers) await (accepted ? handlers.onAccept() : handlers.onRefuse())();
      await saveMechanic(tag, { resolved: true, resultText: accepted ? 'Accepted.' : 'Declined.' });
      await resolveMechanic(tag);
      await logCreation(accepted ? 'Accepted the opportunity.' : 'Declined the opportunity.');
      renderStep();
    }

    // "Gain SKILL, or DM+N to your next ADVANCEMENT/QUALIFICATION roll." choice.
    function renderChooseSkillOrDM(tag, m, skillGrant, dmKey, amount) {
      if (m.resolved) return resolverHeader(m.resultText);
      const label = `${skillGrant.name}${skillGrant.specialty ? ' (' + skillGrant.specialty + ')' : ''} ${skillGrant.level}`;
      return `
        <div class="wizard-actions" style="justify-content:flex-start; gap:10px; margin-top:0;">
          <button class="btn-outline" onclick="chooseSkillOrDM('${tag}', true, '${skillGrant.name}', '${skillGrant.specialty || ''}', ${skillGrant.level}, '${dmKey}', ${amount})">Gain ${label}</button>
          <button class="btn-outline" onclick="chooseSkillOrDM('${tag}', false, '${skillGrant.name}', '${skillGrant.specialty || ''}', ${skillGrant.level}, '${dmKey}', ${amount})">DM${amount > 0 ? '+' : ''}${amount} to next roll instead</button>
        </div>
      `;
    }

    async function chooseSkillOrDM(tag, takeSkill, name, specialty, level, dmKey, amount) {
      let resultText;
      if (takeSkill) {
        const skills = Object.assign({}, draft.skills || {});
        grantSkillMin(skills, name, specialty || null, level);
        await supabaseClient.from('characters').update({ skills }).eq('id', draft.id);
        draft.skills = skills;
        resultText = `Gained ${name}${specialty ? ' (' + specialty + ')' : ''} ${level}.`;
      } else {
        await addPendingMod(dmKey, amount);
        resultText = `Banked DM${amount > 0 ? '+' : ''}${amount} to your next roll.`;
      }
      await saveMechanic(tag, { resolved: true, resultText });
      await resolveMechanic(tag);
      await logCreation(resultText);
      renderStep();
    }

    // "Automatically pass your next promotion or commission roll."
    function renderBankAutoPromote(tag, m) {
      if (m.resolved) return resolverHeader(m.resultText);
      return `<button class="btn-outline" onclick="bankAutoPromote('${tag}')">Bank an Automatic Promotion/Commission</button>`;
    }

    async function bankAutoPromote(tag) {
      await setPendingFlag('autoPromote', true);
      await saveMechanic(tag, { resolved: true, resultText: 'Banked — your next promotion or commission roll auto-succeeds.' });
