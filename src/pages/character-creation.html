<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Character Creation — Traveller</title>
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/reference.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .wizard-shell { max-width: 720px; margin: 0 auto; }
    .wizard-steps {
      display: flex; gap: 6px; margin-bottom: 28px; flex-wrap: wrap;
    }
    .wizard-step-pill {
      padding: 5px 12px; border-radius: 999px; font-size: 0.75rem;
      letter-spacing: 0.04em; border: 1px solid #0a4a60; color: #4a9ab8;
    }
    .wizard-step-pill.done   { border-color: #00ffaa; color: #00ffaa; }
    .wizard-step-pill.active { border-color: #00e5ff; color: #00e5ff; background: rgba(0,229,255,0.08); }
    .wizard-card { max-width: 720px; }
    .wizard-card-title { font-size: 1.1rem; color: #00e5ff; font-weight: 600; margin-bottom: 4px; }
    .wizard-card-sub { color: #4a9ab8; font-size: 0.85rem; margin-bottom: 18px; }
    .wizard-field { margin-bottom: 16px; }
    .wizard-field label { display: block; font-size: 0.8rem; color: #4a9ab8; margin-bottom: 6px; letter-spacing: 0.04em; text-transform: uppercase; }
    .wizard-field input, .wizard-field select {
      width: 100%; padding: 10px 12px; font-size: 1rem;
    }
    .wizard-actions { display: flex; justify-content: space-between; margin-top: 24px; }
    .wizard-error { color: #ff5a4a; font-size: 0.85rem; margin-top: 10px; }
    .status-draft { background: rgba(0,229,255,0.10); color: #00e5ff; border: 1px solid #00e5ff44; }
  </style>
</head>
<body>

  <div class="app-shell">
    <nav class="sidebar">
      <div class="sidebar-logo">
        <div class="sidebar-logo-text">TRAVELLER</div>
        <div class="sidebar-user" id="sidebar-user"></div>
      </div>
      <div class="sidebar-group-label">Character Resources</div>
      <a href="character-record.html" class="sidebar-nav-item">Character Record</a>
      <a href="spacecraft-record.html" class="sidebar-nav-item">Spacecraft Record</a>
      <a href="character-list.html" class="sidebar-nav-item">Roster</a>
      <a href="character-creation.html" class="sidebar-nav-item active">Character Creation</a>
      <div class="sidebar-group-label">Reference</div>
      <a href="general-rules.html" class="sidebar-nav-item">General Rules</a>
      <a href="combat.html" class="sidebar-nav-item">Combat</a>
      <a href="vehicles.html" class="sidebar-nav-item">Vehicles</a>
      <a href="spacecraft-operations.html" class="sidebar-nav-item">Spacecraft Operations</a>
      <a href="spacecraft-combat.html" class="sidebar-nav-item">Spacecraft Combat</a>
      <a href="equipment.html" class="sidebar-nav-item">Equipment</a>
      <a href="weapons-armor.html" class="sidebar-nav-item">Weapons &amp; Armor</a>
      <a href="trade.html" class="sidebar-nav-item">Trade</a>
      <div class="sidebar-signout">
        <button onclick="doSignOut()">Sign Out</button>
      </div>
    </nav>

    <main class="page-main">
      <h1 class="page-title">CHARACTER CREATION</h1>

      <div class="wizard-shell" id="wizard-shell">
        <p class="placeholder-msg">Loading…</p>
      </div>
    </main>
  </div>

  <script src="../js/supabase-config.js"></script>
  <script src="../js/sidebar.js"></script>
  <script>
    let currentUser = null;
    let draft = null;

    // Step registry — each step builds further on the Traveller 2022 core
    // rulebook creation flowchart (pp.8-15). Steps beyond STEP_COUNT are
    // not built yet.
    const STEP_COUNT = 8;
    const STEP_LABELS = [
      'Name & Species', 'Characteristics', 'Background Skills', 'Pre-Career Education',
      'Career', 'Terms', 'Mustering Out', 'Finalize'
    ];

    // Species characteristic modifiers + traits — Core Rulebook pp.53-54.
    // mods are applied to rolled characteristics in Step 2 (Characteristics).
    const SPECIES_DATA = {
      Human: { mods: {}, traits: [] },
      Aslan: {
        mods: { str: 2, dex: -2 },
        traits: [
          'Dewclaw: vicious close combat weapon, uses Melee (natural) skill, 1D+2 damage.',
          'Heightened Senses: DM+1 to Recon and Survival checks.'
        ]
      },
      Vargr: {
        mods: { str: -1, dex: 1, end_stat: -1 },
        traits: [
          'Bite: close combat weapon, uses Melee (natural) skill, 1D+1 damage.',
          'Heightened Senses: DM+1 to Recon and Survival checks; DM-1 to sight-based checks in dark conditions.'
        ]
      }
    };

    const SPECIES_NOTE_START = '[SPECIES TRAITS]';
    const SPECIES_NOTE_END = '[/SPECIES TRAITS]';

    function modsLine(mods) {
      const labels = { str: 'STR', dex: 'DEX', end_stat: 'END', int_stat: 'INT', edu: 'EDU', soc: 'SOC' };
      const parts = Object.keys(mods).map(k => `${labels[k]}${mods[k] > 0 ? '+' : ''}${mods[k]}`);
      return parts.length ? parts.join(', ') : 'None';
    }

    function buildSpeciesNote(species) {
      const sp = SPECIES_DATA[species] || SPECIES_DATA.Human;
      if (species === 'Human' || !sp.traits.length) return '';
      return `${SPECIES_NOTE_START}\n${species} — Characteristics: ${modsLine(sp.mods)}.\n` +
        sp.traits.map(t => `- ${t}`).join('\n') + `\n${SPECIES_NOTE_END}`;
    }

    // Replaces any existing species-traits block in notes, preserving the rest.
    function applySpeciesNote(existingNotes, species) {
      const notes = existingNotes || '';
      const startIdx = notes.indexOf(SPECIES_NOTE_START);
      const endIdx = notes.indexOf(SPECIES_NOTE_END);
      let rest = notes;
      if (startIdx !== -1 && endIdx !== -1) {
        rest = (notes.slice(0, startIdx) + notes.slice(endIdx + SPECIES_NOTE_END.length)).trim();
      }
      const block = buildSpeciesNote(species);
      if (!block) return rest;
      return rest ? `${block}\n\n${rest}` : block;
    }

    async function init() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) { window.location.href = '../../index.html'; return; }
      currentUser = session.user;
      document.getElementById('sidebar-user').textContent =
        currentUser.user_metadata?.display_name || currentUser.email;

      const params = new URLSearchParams(window.location.search);
      let id = params.get('id');

      if (!id) {
        // Starting fresh — create a draft character and move into the wizard.
        const { data, error } = await supabaseClient.from('characters')
          .insert({
            user_id: currentUser.id,
            name: 'New Traveller',
            species: 'Human',
            status: 'draft',
            creation_step: 1
          })
          .select().single();
        if (error) {
          document.getElementById('wizard-shell').innerHTML =
            `<p class="wizard-error">Could not start creation: ${error.message}</p>`;
          return;
        }
        window.location.href = 'character-creation.html?id=' + data.id;
        return;
      }

      await loadDraft(id);
    }

    async function loadDraft(id) {
      const { data, error } = await supabaseClient
        .from('characters').select('*').eq('id', id).single();
      if (error || !data) {
        document.getElementById('wizard-shell').innerHTML =
          `<p class="wizard-error">Character not found.</p>`;
        return;
      }
      draft = data;
      renderStep();
    }

    function renderSteps() {
      const current = draft.creation_step || 1;
      return `
        <div class="wizard-steps">
          ${STEP_LABELS.map((label, i) => {
            const n = i + 1;
            const cls = n < current ? 'done' : (n === current ? 'active' : '');
            return `<span class="wizard-step-pill ${cls}">${n}. ${label}</span>`;
          }).join('')}
        </div>
      `;
    }

    function renderStep() {
      const shell = document.getElementById('wizard-shell');
      const step = draft.creation_step || 1;
      let body = '';

      if (step === 1) {
        body = renderStepName();
      } else {
        body = `
          <div class="rule-card wizard-card">
            <div class="wizard-card-title">Step ${step}: ${STEP_LABELS[step - 1]}</div>
            <div class="wizard-card-sub">Not built yet — coming in a future session.</div>
            <div class="wizard-actions">
              <button class="btn-outline" onclick="goStep(${step - 1})">Back</button>
            </div>
          </div>
        `;
      }

      shell.innerHTML = renderSteps() + body;
      if (step === 1) renderSpeciesPreview();
    }

    function renderSpeciesPreview() {
      const species = document.getElementById('f-species').value;
      const sp = SPECIES_DATA[species];
      const el = document.getElementById('species-preview');
      if (!sp.traits.length) { el.innerHTML = ''; return; }
      el.innerHTML = `
        <div class="rule-card" style="margin-bottom:16px;">
          <div style="color:#00e5ff; font-size:0.85rem; font-weight:600; margin-bottom:6px;">
            Characteristics: ${modsLine(sp.mods)}
          </div>
          ${sp.traits.map(t => `<div style="font-size:0.85rem; margin-bottom:4px;">${t}</div>`).join('')}
        </div>
      `;
    }

    function renderStepName() {
      return `
        <div class="rule-card wizard-card">
          <div class="wizard-card-title">Name &amp; Species</div>
          <div class="wizard-card-sub">Name your Traveller before anything else — trust us on this. (Core Rulebook p.13)</div>

          <div class="wizard-field">
            <label for="f-name">Name</label>
            <input id="f-name" type="text" value="${draft.name === 'New Traveller' ? '' : (draft.name || '')}" placeholder="Traveller name" />
          </div>

          <div class="wizard-field">
            <label for="f-species">Species</label>
            <select id="f-species" onchange="renderSpeciesPreview()">
              ${Object.keys(SPECIES_DATA).map(sp =>
                `<option value="${sp}" ${(draft.species || 'Human') === sp ? 'selected' : ''}>${sp}</option>`
              ).join('')}
            </select>
          </div>

          <div id="species-preview"></div>

          <div id="step1-error"></div>

          <div class="wizard-actions">
            <button class="btn-outline-danger" onclick="abandonDraft()">Abandon</button>
            <button class="btn-outline" onclick="submitStepName()">Continue</button>
          </div>
        </div>
      `;
    }

    async function submitStepName() {
      const name = document.getElementById('f-name').value.trim();
      const species = document.getElementById('f-species').value.trim() || 'Human';
      const errEl = document.getElementById('step1-error');

      if (!name) {
        errEl.innerHTML = '<p class="wizard-error">Your Traveller needs a name.</p>';
        return;
      }

      const background_notes = applySpeciesNote(draft.background_notes, species);

      const { error } = await supabaseClient.from('characters')
        .update({ name, species, background_notes, creation_step: 2 })
        .eq('id', draft.id);
      if (error) {
        errEl.innerHTML = `<p class="wizard-error">${error.message}</p>`;
        return;
      }
      draft.name = name;
      draft.species = species;
      draft.background_notes = background_notes;
      draft.creation_step = 2;
      renderStep();
    }

    async function goStep(n) {
      if (n < 1) { window.location.href = 'character-list.html'; return; }
      const { error } = await supabaseClient.from('characters')
        .update({ creation_step: n }).eq('id', draft.id);
      if (error) { alert('Error: ' + error.message); return; }
      draft.creation_step = n;
      renderStep();
    }

    async function abandonDraft() {
      if (!confirm('Discard this Traveller? This cannot be undone.')) return;
      await supabaseClient.from('characters').delete().eq('id', draft.id);
      window.location.href = 'character-list.html';
    }

    async function doSignOut() {
      await supabaseClient.auth.signOut();
      window.location.href = '../../index.html';
    }

    init();
  </script>
</body>
</html>
