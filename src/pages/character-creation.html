      const s = step5State();
      const id = s.draftBuilt ? s.draftBranch : 'drifter';
      await saveStep5State({ careerId: id, phase: 'assignment' });
      renderStep();
    }

    async function goCareerAssignment() {
      await saveStep5State({ phase: 'assignment' });
      renderStep();
    }

    function renderCareerAssignment() {
      const s = step5State();
      const c = careerData(s.careerId);
      return `
        <div class="rule-card wizard-card">
          <div class="wizard-card-title">${c.name} — Choose an Assignment</div>
          <div class="wizard-actions" style="justify-content:flex-start; gap:12px; flex-wrap:wrap;">
            ${c.assignments.map(a => `<button class="btn-outline" onclick="chooseAssignment('${a.key}')">${a.label}</button>`).join('')}
          </div>
        </div>
      `;
    }

    async function chooseAssignment(key) {
      const s = step5State();
      const c = careerData(s.careerId);
      const isFirstCareer = (s.careerHistory || []).length === 0;
      const assignment = c.assignments.find(a => a.key === key);
      const skills = Object.assign({}, draft.skills || {});

      let basicTrainingGrant = null;
      if (isFirstCareer) {
        const granted = serviceSkillsFor(c, assignment);
        granted.forEach(sk => grantSkillMin(skills, sk.name, sk.specialty, 0));
        basicTrainingGrant = granted.map(sk => `${sk.name}${sk.specialty ? ' (' + sk.specialty + ')' : ''} 0`).join(', ');
      }
      await supabaseClient.from('characters').update({ skills }).eq('id', draft.id);
      draft.skills = skills;

      // Prisoner's Parole Threshold (Core p.53) starts at 1D+2 the moment
      // you're sentenced, and persists for the whole stay — only rolled
      // once here, never reset by continueCareerTerm().
      let extraPatch = {};
      if (c.id === 'prisoner') {
        const threshold = rollDie() + 2;
        extraPatch = { paroleThreshold: threshold, survivalDMBonus: 0 };
        await logCreation(`Prisoner — initial Parole Threshold set to ${threshold} (1D+2).`);
      }

      const merchantBonus = (c.id === 'merchant' || c.id === 'citizen') ? merchantAcademyAutoEntry() : null;
      const militaryBonus = c.military ? militaryAcademyAutoEntry(c.id) : null;
      const startRank = merchantBonus ? (merchantBonus.honours ? 2 : 1) : (militaryBonus ? 1 : 0);
      const startOfficer = !!militaryBonus;
      const academyNote = merchantBonus ? ` Merchant Academy auto-entry: starting at rank ${startRank}.`
        : militaryBonus ? ' Military Academy auto-entry: starting as an officer at rank 1.' : '';

      const basePatch = Object.assign({
        assignmentKey: key, rank: startRank, isOfficer: startOfficer, termInCareer: 0,
        basicTrainingDone: isFirstCareer, benefitRolls: 0,
        phase: 'survival', basicTrainingGrant,
        survivalResult: null, eventRoll: null, eventResolved: false,
        commissionResult: null, advancementResult: null, skillRollsRemaining: 0
      }, extraPatch);

      // The rank table's entry for whatever rank you START at (rank 0 for
      // a normal entry, or rank 1/2 via an Academy auto-entry) has its own
      // skill/stat reward, same shape as a promotion's reward — but
      // nothing granted it until now, since only rollAdvancement() ever
      // read the rank table. Found via Army's rank-0 "Private" (Gun
      // Combat 1) silently never being applied; also affects Marine and
      // Prisoner's rank-0 entries.
      const table = (startOfficer ? c.ranksOfficer : null) || c.ranksEnlisted || assignment.ranks || [];
      const startEntry = table.find(x => x.rank === startRank);
      if (startEntry && startEntry.skill && !startEntry.skill.specialty && skillSpecialtiesFor(startEntry.skill.name).length) {
        await saveStep5State(Object.assign({}, basePatch, { phase: 'startRankGate', startRankPending: { entry: startEntry, basePatch, academyNote, basicTrainingGrant } }));
        await gateSpecialty('startRank', startEntry.skill.name, (specialty) => finishStartRankGrant(specialty));
        return;
      }

      let rankNote = '';
      if (startEntry && startEntry.skill) {
        rankNote = await grantStartRankSkill(startEntry.skill, startEntry.skill.specialty || null);
      }
      if (startEntry && startEntry.stat) {
        rankNote += (rankNote ? ', ' : '') + await grantStartRankStat(startEntry.stat);
      }

      await saveStep5State(basePatch);
      await logCreation(`${c.name} — chose ${assignment.label} assignment.${academyNote}${basicTrainingGrant ? ` Basic Training: gained ${basicTrainingGrant}.` : ''}${rankNote ? ` Starting rank reward: ${rankNote}.` : ''}`);
      renderStep();
    }

    async function grantStartRankSkill(skillEntry, specialty) {
      const skills = Object.assign({}, draft.skills || {});
      if (specialty) grantSpecialtySkillMin(skills, skillEntry.name, specialty, skillEntry.level);
      else grantSkillMin(skills, skillEntry.name, null, skillEntry.level);
      await supabaseClient.from('characters').update({ skills }).eq('id', draft.id);
      draft.skills = skills;
      return `${skillEntry.name}${specialty ? ' (' + specialty + ')' : ''} ${skillEntry.level}`;
    }

    async function grantStartRankStat(statEntry) {
      if (statEntry.min !== undefined) {
        if ((draft[statEntry.key] || 0) < statEntry.min) await applyStatChange(statEntry.key, statEntry.min - (draft[statEntry.key] || 0));
        else await applyStatChange(statEntry.key, 1);
      } else {
        await applyStatChange(statEntry.key, statEntry.amount);
      }
      return `${statEntry.key} adjusted`;
    }

    function renderStartRankGate() {
      const s = step5State();
      const sm = mechanicState('startRank');
      const c = careerData(s.careerId);
      return `<div class="rule-card wizard-card"><div class="wizard-card-title">${c.name} — Starting Rank</div>${renderSpecialtyGate('startRank', sm.specialtyGateFor)}</div>`;
    }

    async function finishStartRankGrant(specialty) {
      const s = step5State();
      const { entry, basePatch, academyNote, basicTrainingGrant } = s.startRankPending;
      const c = careerData(s.careerId);
      const assignment = currentAssignment(Object.assign({}, s, basePatch), c);
      let rankNote = await grantStartRankSkill(entry.skill, specialty);
      if (entry.stat) rankNote += ', ' + await grantStartRankStat(entry.stat);
      await saveStep5State(Object.assign({}, basePatch, { startRankPending: null }));
      await logCreation(`${c.name} — chose ${assignment.label} assignment.${academyNote}${basicTrainingGrant ? ` Basic Training: gained ${basicTrainingGrant}.` : ''} Starting rank reward: ${rankNote}.`);
      renderStep();
    }

    function currentAssignment(s, c) { return c.assignments.find(a => a.key === s.assignmentKey); }

    function renderCareerSurvival() {
      const s = step5State();
      const c = careerData(s.careerId);
      const a = currentAssignment(s, c);
      const statLabel = (CHARS.find(x => x.key === a.survival.stat) || {}).label || a.survival.stat.toUpperCase();
      const r = s.survivalResult;

      if (!r) {
        return `
          <div class="rule-card wizard-card">
            <div class="wizard-card-title">${c.name} (${a.label}) — Term ${s.termInCareer + 1}, Survival</div>
            ${s.basicTrainingGrant ? `<div class="wizard-card-sub" style="color:#00ffaa;">Basic Training — gained: ${s.basicTrainingGrant}.</div>` : ''}
            <div class="wizard-card-sub">Roll 2D + ${statLabel} DM (need ${a.survival.target}+). A natural 2 always fails.</div>
            <div class="wizard-actions" style="justify-content:flex-start;">
              <button class="btn-outline" onclick="rollCareerSurvival()">Roll Survival</button>
            </div>
          </div>
        `;
      }

      if (r.success) {
        return `
          <div class="rule-card wizard-card">
            <div class="wizard-card-title">Survived</div>
            <div class="wizard-card-sub">Rolled ${r.total} (${r.dice.join(' + ')} + ${r.statDM}${r.bonusDM ? (r.bonusDM > 0 ? ' + ' : ' − ') + Math.abs(r.bonusDM) + ' banked DM' : ''}${r.persistentDM ? (r.persistentDM > 0 ? ' + ' : ' − ') + Math.abs(r.persistentDM) + ' persistent DM' : ''}), needed ${a.survival.target}+.</div>
            <div class="wizard-actions">
              <button class="btn-outline" onclick="goCareerEvents()">Continue to Events</button>
            </div>
          </div>
        `;
      }
      return `
        <div class="rule-card wizard-card">
          <div class="wizard-card-title">Survival Failed</div>
          <div class="wizard-card-sub">Rolled ${r.total} (${r.dice.join(' + ')} + ${r.statDM}${r.bonusDM ? (r.bonusDM > 0 ? ' + ' : ' − ') + Math.abs(r.bonusDM) + ' banked DM' : ''}), needed ${a.survival.target}+. You must roll on the Mishap table.</div>
          <div class="wizard-actions">
            <button class="btn-outline" onclick="goCareerMishap()">Roll Mishap</button>
          </div>
        </div>
      `;
    }

    async function rollCareerSurvival() {
      const s = step5State();
      const c = careerData(s.careerId);
      const a = currentAssignment(s, c);
      const d1 = rollDie(), d2 = rollDie();
      // Truther's Survival target is keyed off Following directly (the
      // raw value, not the normal characteristic-DM curve) — FOL isn't a
      // characteristic, it's a standing reputation score (Companion p.35).
      const statDM = a.survival.stat === 'following' ? (draft.following || 0) : dmNum(draft[a.survival.stat]);
      const bonusDM = await consumePendingMod('survivalDM');
      // Unlike bonusDM (a one-shot pending modifier, consumed the instant
      // it's used), survivalDMBonus is a PERSISTENT buff for the rest of
      // this stay in the career — Prisoner event 5 ("gang membership")
      // grants DM+1 to all survival rolls for the remainder of the career,
      // not just the next one.
      const persistentDM = s.survivalDMBonus || 0;
      const total = d1 + d2 + statDM + bonusDM + persistentDM;
      const success = (d1 + d2) !== 2 && total >= a.survival.target;
      await saveStep5State({ survivalResult: { dice: [d1, d2], statDM, bonusDM, persistentDM, total, success }, basicTrainingGrant: null });
      await logCreation(`${c.name} (${a.label}) — Survival: rolled ${d1}+${d2}=${d1+d2}${statDM !== 0 ? (statDM > 0 ? '+' : '')+statDM+' stat' : ''}${bonusDM ? (bonusDM > 0 ? '+' : '')+bonusDM+' banked' : ''}${persistentDM ? (persistentDM > 0 ? '+' : '')+persistentDM+' persistent' : ''} = ${total} (need ${a.survival.target}+) — ${success ? 'survived.' : 'failed.'}`);
      renderStep();
    }

    async function goCareerMishap() {
      await saveStep5State({ phase: 'mishap', mishapRoll: null, mishapResolved: false, mishapResolvedText: null, mishapMechanic: {}, autoGranted: null });
      renderStep();
    }

    function renderCareerMishap() {
      const s = step5State();
      const c = careerData(s.careerId);
      if (!s.mishapRoll) {
        return `
          <div class="rule-card wizard-card">
            <div class="wizard-card-title">${c.name} — Mishap</div>
            <div class="wizard-card-sub">This mishap forces you to leave the career immediately (unless its text says otherwise), and you lose this term's Benefit roll.</div>
            <div class="wizard-actions" style="justify-content:flex-start;">
              <button class="btn-outline" onclick="rollCareerMishap()">Roll 1D</button>
            </div>
          </div>
        `;
      }
      const m = c.mishaps.find(x => x.roll === s.mishapRoll);
      const bespoke = renderBespokeOutcome('mishap', s.careerId, 'mishap' + s.mishapRoll);
      // Most mishaps' eject/stay outcome is fixed per entry (m.noEject), but
      // a few (Scholar mishap 5) let the player CHOOSE whether they're
      // ejected — bespoke mechanics signal that via mishapMechanic.noEjectOverride.
      // Prisoner is a blanket exception: "not even Mishaps will force them
      // to leave" (Core p.53) — leaving is governed entirely by the Parole
      // Threshold check at term end, never by a mishap roll.
      const noEject = m.noEject || (s.mishapMechanic && s.mishapMechanic.noEjectOverride) || c.id === 'prisoner';
      const medCareDone = !s.medCareReductions || s.medCareResolved;
      const ready = s.mishapResolved && medCareDone;
      // Once resolved via the generic resolver, show the persisted outcome
      // instead of re-rendering the tool buttons — otherwise the full-card
      // re-render after "Mark Resolved" rebuilds a fresh "Roll on the
      // Injury Table" (etc.) button with no sign the first roll happened,
      // inviting a second, unintended roll.
      const genericBody = (bespoke !== null) ? bespoke
        : (s.mishapResolved
          ? `<div class="wizard-card-sub" style="color:#00ffaa;">${s.mishapResolvedText || 'Resolved.'}</div>`
          : (s.mishapRoll === 1 && !m.tools.length ? renderMishapRoll1Choice('mishap') : renderGenericResolver('mishap', m.tools, false, { skillOptions: m.skillOptions, associateTypes: m.associateTypes, statOptions: m.statOptions, statAmount: m.statAmount })));
      return `
        <div class="rule-card wizard-card">
          <div class="wizard-card-title">${c.name} — Mishap ${s.mishapRoll}</div>
          <p style="margin-bottom:14px;">${m.text}</p>
          ${s.autoGranted ? `<div class="wizard-card-sub" style="color:#00ffaa;">Applied automatically: ${s.autoGranted}.</div>` : ''}
          ${s.medCareReductions ? renderAutoMedCareBlock('mishap', s.medCareReductions, s.medCareResolved, s.medCareResultText) : ''}
          ${genericBody}
          <div class="wizard-actions">
            ${noEject
              ? `<button class="btn-outline" onclick="continueCareerAfterMishap()" ${ready ? '' : 'disabled'}>Continue Career — Not Ejected</button>`
              : `<button class="btn-outline" onclick="leaveCareerAfterMishap()" ${ready ? '' : 'disabled'}>Leave Career</button>`
            }
          </div>
        </div>
      `;
    }

    // Applies an entry's unconditional autoSkill/autoDM grants (no player
    // choice involved) the moment it's rolled, and returns a description
    // of what was applied for the log line.
    async function applyAutoGrants(entry) {
      const parts = [];
      if (entry.autoSkill) {
        const skills = Object.assign({}, draft.skills || {});
        grantSkillMin(skills, entry.autoSkill.name, entry.autoSkill.specialty, entry.autoSkill.level);
        await supabaseClient.from('characters').update({ skills }).eq('id', draft.id);
        draft.skills = skills;
        parts.push(`${entry.autoSkill.name}${entry.autoSkill.specialty ? ' (' + entry.autoSkill.specialty + ')' : ''} ${entry.autoSkill.level}`);
      }
      if (entry.autoDM) {
        await addPendingMod(entry.autoDM.key, entry.autoDM.amount);
        parts.push(`banked DM${entry.autoDM.amount > 0 ? '+' : ''}${entry.autoDM.amount} (${entry.autoDM.key})`);
      }
      if (entry.autoStat) {
        await applyStatChange(entry.autoStat.key, entry.autoStat.amount);
        parts.push(`${entry.autoStat.key} ${entry.autoStat.amount > 0 ? '+' : ''}${entry.autoStat.amount}`);
      }
      if (entry.autoStats) {
        for (const s of entry.autoStats) {
          await applyStatChange(s.key, s.amount);
          parts.push(`${s.key} ${s.amount > 0 ? '+' : ''}${s.amount}`);
        }
      }
      if (entry.autoParole) {
        const newThreshold = await adjustParoleThreshold(entry.autoParole.amount);
        parts.push(`Parole Threshold ${entry.autoParole.amount > 0 ? '+' : ''}${entry.autoParole.amount} (now ${newThreshold})`);
      }
      return parts.join(', ');
    }

    // ── Prisoner's Parole Threshold (Core p.53) — persists for the whole
    // stay in the career, capped at 12 (the book sets no floor, so none is
    // imposed here either). Adjusted by many of Prisoner's own mishaps and
    // events; re-rolled fresh on a prison transfer.
    async function adjustParoleThreshold(amount) {
      const s = step5State();
      const newThreshold = Math.min(12, (s.paroleThreshold || 0) + amount);
      await saveStep5State({ paroleThreshold: newThreshold });
      return newThreshold;
    }

    // Truther's Following (FOL, Companion p.35) is a persistent
    // characteristic, not career-scoped state — `applyStatChange('following', amount)`
    // already handles it generically (needs truther-believer-schema.sql
    // run in Supabase). No floor/cap on FOL per the book.

    async function rerollParoleThreshold() {
      const newThreshold = rollDie() + 2;
      await saveStep5State({ paroleThreshold: newThreshold });
      return newThreshold;
    }

    async function rollCareerMishap() {
      const roll = rollDie();
      const s0 = step5State();
      const c = careerData(s0.careerId);
      const entry = c.mishaps.find(x => x.roll === roll);
      const granted = await applyAutoGrants(entry);
      const physReductions = physicalAutoReductions(entry);
      await saveStep5State({
        mishapRoll: roll, autoGranted: granted || null,
        medCareReductions: physReductions.length ? physReductions : null,
        medCareResolved: false, medCareResultText: null
      });
      await logCreation(`${c.name} — Mishap roll: ${roll} — ${entry.text}${granted ? ` Applied automatically: ${granted}.` : ''}`);
      renderStep();
    }

    async function leaveCareerAfterMishap() {
      try {
        await recordCareerHistory(false);
        const s = step5State();
        const termsInCareer = s.termInCareer + 1;
        const newTerms = s.terms + 1;
        const { error } = await supabaseClient.from('characters').update({ age: ageForTerms(newTerms) }).eq('id', draft.id);
        if (error) throw error;
        draft.age = ageForTerms(newTerms);
        await saveStep5State({ terms: newTerms, benefitRolls: (s.benefitRolls || 0) + termsInCareer });
        await goToAgeingOrPhase('mustering');
      } catch (err) {
        console.error('leaveCareerAfterMishap failed:', err);
        alert('Error leaving career: ' + (err.message || err));
      }
    }

    async function continueCareerAfterMishap() {
      const s = step5State();
      const c = careerData(s.careerId);
      await logCreation(`${c.name} — survived the mishap without ejection; continuing this term.`);
      await saveStep5State({ phase: 'events', eventRoll: null, eventResolved: false, eventResolvedText: null, eventMechanic: {}, mishapRoll: null, mishapResolved: false, mishapResolvedText: null, mishapMechanic: {} });
      renderStep();
    }

    // ── Generic resolver — Grant Skill / Adjust Characteristic / Add Associate ──
    // `restrict` narrows the generic Grant Skill / Add Associate pickers to
    // what the rolled text actually offers (e.g. "Gain one of Electronics,
    // Engineer, Gunner or Pilot" or "gain them as a Rival") instead of
    // showing every skill/associate type. Optional — entries without it
    // keep the full picker. Stashed on a module-level cache since the
    // picker is opened later, from an onclick, after this render call returns.
    window.__resolverRestrict = window.__resolverRestrict || {};

    function renderGenericResolver(tag, tools, hideMarkButton, restrict) {
      tools = tools || [];
      window.__resolverRestrict[tag] = Object.assign({}, restrict, { __soleTool: tools.length === 1 ? tools[0] : null });
      const toolButtons = {
        skill: `<button class="btn-outline" onclick="openResolver('${tag}','skill')">Grant Skill</button>`,
        stat: `<button class="btn-outline" onclick="openResolver('${tag}','stat')">Adjust Characteristic</button>`,
        associate: `<button class="btn-outline" onclick="openResolver('${tag}','associate')">Add Associate</button>`,
        injury: `<button class="btn-outline" onclick="openInjuryResolver('${tag}')">Roll on the Injury Table</button>`,
        lifeEvent: `<button class="btn-outline" onclick="openLifeEventResolver('${tag}')">Roll a Life Event</button>`
      };
      return `
        <div style="display:flex; gap:10px; flex-wrap:wrap; margin-bottom:12px;">
          ${tools.map(t => toolButtons[t]).join('')}
          ${hideMarkButton ? '' : `<button class="btn-outline" onclick="markResolverDone('${tag}', 'No further effect.')">Mark Resolved / No Further Effect</button>`}
        </div>
        <div id="resolver-${tag}"></div>
      `;
    }

    async function openResolver(tag, kind) {
      const el = document.getElementById('resolver-' + tag);
      const restrict = window.__resolverRestrict[tag] || {};
      if (kind === 'skill') {
        const options = restrict.skillOptions && restrict.skillOptions.length ? restrict.skillOptions : SKILLS.map(sk => ({ name: sk.name }));
        // Single option with no specialty decision needed — auto-apply immediately
        if (options.length === 1) {
          const only = options[0];
          const needsSpecialtyChoice = skillSpecialtiesFor(only.name).length > 0 && !only.specialty;
          if (!needsSpecialtyChoice) {
            await applyResolverSkill(tag, only.name, only.specialty || null, only.level || 1);
            return;
          }
        }
        const isBumpEvent = options.some(o => o.bump);
        el.innerHTML = `
          <div class="wizard-field"><label>Skill</label>
            <select id="resolver-${tag}-skill" onchange="updateResolverSkillSpecialty('${tag}')">
              <option value="">— choose —</option>
              ${options.map(sk => `<option value="${sk.name}" data-level="${sk.level || 1}" data-bump="${sk.bump ? 'true' : 'false'}">${sk.name}</option>`).join('')}
            </select>
          </div>
          <div id="resolver-${tag}-specialty-wrap"></div>
          ${!isBumpEvent ? `
            <div class="wizard-field"><label>Level</label>
              <input id="resolver-${tag}-level" type="number" min="0" max="4" value="${(options[0] && options[0].level) || 1}" />
            </div>
          ` : `
            <input id="resolver-${tag}-level" type="hidden" value="${(options[0] && options[0].level) || 1}" />
          `}
          <button class="btn-outline" onclick="applyResolverSkill('${tag}')" id="resolver-${tag}-apply-btn">Apply</button>
        `;
      } else if (kind === 'stat') {
        const statChars = restrict.statOptions && restrict.statOptions.length ? CHARS.filter(c => restrict.statOptions.includes(c.key)) : CHARS;
        el.innerHTML = `
          <div class="wizard-field"><label>Characteristic</label>
            <select id="resolver-${tag}-stat">${statChars.map(c => `<option value="${c.key}">${c.label}</option>`).join('')}</select>
          </div>
          <div class="wizard-field"><label>Amount (+/-)</label><input id="resolver-${tag}-amount" type="number" value="${restrict.statAmount || 1}" ${restrict.statAmount ? `readonly` : ''} /></div>
          <button class="btn-outline" id="resolver-${tag}-stat-apply-btn" onclick="applyResolverStat('${tag}')">Apply</button>
        `;
      } else {
        const typeLabels = { ally: 'Ally', contact: 'Contact', rival: 'Rival', enemy: 'Enemy' };
        const types = restrict.associateTypes && restrict.associateTypes.length ? restrict.associateTypes : ['ally', 'contact', 'rival', 'enemy'];
        el.innerHTML = `
          ${types.length > 1 ? `
            <div class="wizard-field"><label>Type</label>
              <select id="resolver-${tag}-type">
                ${types.map(t => `<option value="${t}">${typeLabels[t]}</option>`).join('')}
              </select>
            </div>
          ` : `
            <input type="hidden" id="resolver-${tag}-type" value="${types[0]}" />
            <div class="wizard-card-sub">Type: ${typeLabels[types[0]]}</div>
          `}
          <div class="wizard-field"><label>Name</label><input id="resolver-${tag}-name" type="text" /></div>
          <button class="btn-outline" id="resolver-${tag}-assoc-apply-btn" onclick="applyResolverAssociate('${tag}')">Apply</button>
        `;
      }
    }

    function updateResolverSkillSpecialty(tag) {
      const sel = document.getElementById(`resolver-${tag}-skill`);
      const wrap = document.getElementById(`resolver-${tag}-specialty-wrap`);
      const name = sel.value;
      const opt = sel.selectedOptions[0];
      const levelEl = document.getElementById(`resolver-${tag}-level`);
      if (opt && opt.dataset.level) {
        levelEl.value = opt.dataset.level;
        // When bump:true, level is fixed and read-only (represents delta to increase by)
        levelEl.readOnly = opt.dataset.bump === 'true';
      }
      const specs = name ? skillSpecialtiesFor(name) : [];
      wrap.innerHTML = specs.length ? `
        <div class="wizard-field"><label>Specialty</label>
          <select id="resolver-${tag}-specialty">
            <option value="">— specialty —</option>
            ${specs.map(sp => `<option value="${sp.name}">${sp.name}</option>`).join('')}
          </select>
        </div>
      ` : '';
    }

    async function applyResolverSkill(tag, _name, _specialty, _level) {
      const nameEl = document.getElementById(`resolver-${tag}-skill`);
      const applyBtn = document.getElementById(`resolver-${tag}-apply-btn`);
      // Prevent double-application
      if (applyBtn && applyBtn.disabled) return;

      const name = _name !== undefined ? _name : (nameEl ? nameEl.value : '');
      const level = _level !== undefined ? _level : (parseInt(document.getElementById(`resolver-${tag}-level`)?.value, 10) || 0);
      if (!name) return;
      const specEl = document.getElementById(`resolver-${tag}-specialty`);
      const specialty = _specialty !== undefined ? _specialty : (specEl ? (specEl.value || null) : null);
      if (level >= 1 && skillSpecialtiesFor(name).length && !specialty) {
        alert('Choose a specialty for this skill.');
        return;
      }
      // Core Rulebook p.18: a skillOption flagged `bump: true` means the
      // table text says "gain/increase a level" with no explicit number —
      // that's a +1-from-current grant (untrained -> 1), not a floor at a
      // fixed level. Most skillOptions DO give an explicit number (e.g.
      // "Gain Streetwise 1") and stay on the min/floor grant.
      const restrict = window.__resolverRestrict[tag] || {};
      const opt = (restrict.skillOptions || []).find(o => o.name === name);
      const isBump = !!(opt && opt.bump);
      const skills = Object.assign({}, draft.skills || {});
      if (skillSpecialtiesFor(name).length) {
        if (isBump) bumpSpecialtySkill(skills, name, specialty, level);
        else grantSpecialtySkillMin(skills, name, specialty, level);
      } else {
        if (isBump) bumpSkill(skills, name, null, level);
        else grantSkillMin(skills, name, null, level);
      }
      await supabaseClient.from('characters').update({ skills }).eq('id', draft.id);
      draft.skills = skills;
      const skillKey2 = skillKey(name, specialty);
      const resultLevel = skills[skillKey2] ? skills[skillKey2].level : level;
      const desc = isBump
        ? `${name}${specialty ? ' (' + specialty + ')' : ''} increased to ${resultLevel}.`
        : `Granted ${name}${specialty ? ' (' + specialty + ')' : ''} ${level}.`;
      await logCreation(`Resolved outcome — ${desc}`);

      // Disable the apply button to prevent double-application
      if (applyBtn) {
        applyBtn.disabled = true;
        applyBtn.style.opacity = '0.5';
        applyBtn.style.cursor = 'not-allowed';
      }

      if ((window.__resolverRestrict[tag] || {}).__soleTool === 'skill') {
        markResolverDone(tag, desc);
        return;
      }
      document.getElementById('resolver-' + tag).innerHTML = `<p style="color:#00ffaa; font-size:0.85rem;">Applied.</p>`;
      await persistResolverNote(tag, desc);
    }

    async function applyResolverStat(tag) {
      const btn = document.getElementById(`resolver-${tag}-stat-apply-btn`);
      if (btn && btn.disabled) return;
      if (btn) {
        btn.disabled = true;
        btn.style.opacity = '0.5';
        btn.style.cursor = 'not-allowed';
      }
      const key = document.getElementById(`resolver-${tag}-stat`).value;
      const amount = parseInt(document.getElementById(`resolver-${tag}-amount`).value, 10) || 0;
      await applyStatChange(key, amount);
      const desc = `${key} ${amount > 0 ? '+' : ''}${amount}.`;
      await logCreation(`Resolved outcome — ${desc}`);
      // A physical-characteristic reduction via this generic tool is the
      // same kind of injury the Injury Table/autoStat path already offers
      // Medical Care for — route it through the same offer instead of
      // just marking it applied with no recourse.
      if (AGEING_PHYS.includes(key) && amount < 0) {
        offerMedicalCare(tag, [{ key, amount: -amount }]);
        return;
      }
      if ((window.__resolverRestrict[tag] || {}).__soleTool === 'stat') {
        markResolverDone(tag, desc);
        return;
      }
      document.getElementById('resolver-' + tag).innerHTML = `<p style="color:#00ffaa; font-size:0.85rem;">Applied.</p>`;
      await persistResolverNote(tag, desc);
    }

    async function applyResolverAssociate(tag) {
      const btn = document.getElementById(`resolver-${tag}-assoc-apply-btn`);
      if (btn && btn.disabled) return;
      if (btn) {
        btn.disabled = true;
        btn.style.opacity = '0.5';
        btn.style.cursor = 'not-allowed';
      }
      const type = document.getElementById(`resolver-${tag}-type`).value;
      const name = document.getElementById(`resolver-${tag}-name`).value.trim();
      if (!name) return;
      await addAssociate(type, name, 'Gained during a career term.');
      const desc = `Gained ${name} as a ${type}.`;
      await logCreation(`Resolved outcome — ${desc}`);
      if ((window.__resolverRestrict[tag] || {}).__soleTool === 'associate') {
        markResolverDone(tag, desc);
        return;
      }
      document.getElementById('resolver-' + tag).innerHTML = `<p style="color:#00ffaa; font-size:0.85rem;">Applied.</p>`;
      await persistResolverNote(tag, desc);
    }

    // Keeps a human-readable trail of what's been applied via the generic
    // resolver so it survives the full-card re-render that happens when
    // the player later clicks "Mark Resolved" — without this, the status
    // is wiped and the tool buttons reappear looking unused.
    // Life Events nest the generic resolver under a compound tag
    // ('eventLife'/'mishapLife') so its own state doesn't collide with the
    // parent event/mishap's — but completing that inner resolver should
    // still close out the OUTER event/mishap, so strip the suffix here.
    function baseResolverTag(tag) {
      return tag.endsWith('Life') ? tag.slice(0, -4) : tag;
    }

    async function persistResolverNote(tag, text) {
      tag = baseResolverTag(tag);
      if (tag === 'mishap') {
        const prev = step5State().mishapResolvedText;
        await saveStep5State({ mishapResolvedText: prev ? `${prev} ${text}` : text });
      } else if (tag === 'event') {
        const prev = step5State().eventResolvedText;
        await saveStep5State({ eventResolvedText: prev ? `${prev} ${text}` : text });
      }
    }

    function markResolverDone(tag, resultText) {
      tag = baseResolverTag(tag);
      if (tag === 'mishap') {
        const prev = step5State().mishapResolvedText;
        saveStep5State({ mishapResolved: true, mishapResolvedText: resultText || prev || 'Resolved.' }).then(renderStep);
      } else if (tag === 'event') {
        const prev = step5State().eventResolvedText;
        saveStep5State({ eventResolved: true, eventResolvedText: resultText || prev || 'Resolved.' }).then(renderStep);
      } else if (tag === 'preed7') {
        // Pre-career Event 7 ("Life Event") is a separate parallel
        // implementation keyed off step4's eventMechanic, not step5 —
        // same single-tool auto-resolve needs its own completion path.
        saveEventMechanic({ resolved: true }).then(renderStep);
      }
    }

    // ── Injury Table (Core p.49) — reachable from any mishap/event that
    // lists 'injury' as a tool. Reduces physical characteristics (reuses
    // AGEING_PHYS); always closes out via markResolverDone(tag).
    const INJURY_LABEL = { str: 'STR', dex: 'DEX', end_stat: 'END' };

    function openInjuryResolver(tag) {
      document.getElementById('resolver-' + tag).innerHTML =
        `<button class="btn-outline" onclick="rollInjuryTable('${tag}')">Roll 1D on the Injury Table</button>`;
    }

    function rollInjuryTable(tag) {
      const roll = rollDie();
      const entry = INJURY_TABLE.find(x => x.roll === roll);
      renderInjuryPicker(tag, roll, entry);
    }

    function renderInjuryPicker(tag, roll, entry) {
      const el = document.getElementById('resolver-' + tag);
      const picker = (id) => `<select id="${id}">${AGEING_PHYS.map(k => `<option value="${k}">${INJURY_LABEL[k]}</option>`).join('')}</select>`;
      let body = `<div style="margin-bottom:8px;">Rolled ${roll} — ${entry.text}</div>`;
      if (roll === 6) {
        body += `<button class="btn-outline" onclick="finishInjury('${tag}', null)">Continue</button>`;
      } else if (roll === 3) {
        body += `<select id="injury-pick-${tag}"><option value="str">STR</option><option value="dex">DEX</option></select>
          <button class="btn-outline" id="injury-${tag}-apply-btn" onclick="applyInjurySimple('${tag}', 2)">Apply −2</button>`;
      } else if (roll === 4 || roll === 5) {
        body += `${picker('injury-pick-' + tag)}
          <button class="btn-outline" id="injury-${tag}-apply-btn" onclick="applyInjurySimple('${tag}', ${roll === 4 ? 2 : 1})">Apply −${roll === 4 ? 2 : 1}</button>`;
      } else if (roll === 2) {
        body += `${picker('injury-pick-' + tag)}
          <button class="btn-outline" id="injury-${tag}-apply-btn" onclick="applyInjuryDie('${tag}')">Roll 1D and Apply</button>`;
      } else {
        body += `<div style="margin-bottom:6px; font-size:0.82rem; color:#4a9ab8;">Choose which characteristic takes the 1D hit — the other two automatically take −2 each.</div>
          ${picker('injury-pick-' + tag)}
          <button class="btn-outline" id="injury-${tag}-apply-btn" onclick="applyInjuryNearlyKilled('${tag}')">Roll 1D and Apply</button>`;
      }
      el.innerHTML = body;
    }

    async function applyInjurySimple(tag, amount) {
      const btn = document.getElementById(`injury-${tag}-apply-btn`);
      if (btn && btn.disabled) return;
      if (btn) {
        btn.disabled = true;
        btn.style.opacity = '0.5';
        btn.style.cursor = 'not-allowed';
      }
      const key = document.getElementById('injury-pick-' + tag).value;
      await applyStatChange(key, -amount);
      offerMedicalCare(tag, [{ key, amount }]);
    }

    async function applyInjuryDie(tag) {
      const btn = document.getElementById(`injury-${tag}-apply-btn`);
      if (btn && btn.disabled) return;
      if (btn) {
        btn.disabled = true;
        btn.style.opacity = '0.5';
        btn.style.cursor = 'not-allowed';
      }
      const key = document.getElementById('injury-pick-' + tag).value;
      const amt = rollDie();
      await applyStatChange(key, -amt);
      offerMedicalCare(tag, [{ key, amount: amt }]);
    }

    async function applyInjuryNearlyKilled(tag) {
      const btn = document.getElementById(`injury-${tag}-apply-btn`);
      if (btn && btn.disabled) return;
      if (btn) {
        btn.disabled = true;
        btn.style.opacity = '0.5';
        btn.style.cursor = 'not-allowed';
      }
      const key = document.getElementById('injury-pick-' + tag).value;
      const amt = rollDie();
      await applyStatChange(key, -amt);
      const others = AGEING_PHYS.filter(k => k !== key);
      for (const k of others) await applyStatChange(k, -2);
      offerMedicalCare(tag, [{ key, amount: amt }, ...others.map(k => ({ key: k, amount: 2 }))]);
    }

    // ── Medical Care (Core p.49) — restoring a lost characteristic costs
    // Cr5000/point. If injured during a career, roll 2D + rank on the
    // Medical Bills table for that career's coverage tier; the covered
    // portion is free, the rest (and all of it if no career is active)
    // goes straight to debt rather than being deducted from cash on hand,
    // per the user's call. No cap — debt can go as high as it needs to.
    // Prisoner and Psion aren't in the book's table either (newer/special
    // careers) — Prisoner gets tier C (no real institutional backing,
    // same flavour as Scout/Rogue/Drifter), Psion gets tier B (varied,
    // non-military structure, same as Believer's extension). Judgment
    // calls, same as Truther/Believer's tiers below.
    const MEDICAL_BILLS_TIER = {
      army: 'A', navy: 'A', marine: 'A',
      agent: 'B', noble: 'B', scholar: 'B', entertainer: 'B', merchant: 'B', citizen: 'B', believer: 'B', psion: 'B',
      scout: 'C', rogue: 'C', drifter: 'C', truther: 'C', prisoner: 'C'
    };

    function medicalBillsCoverage(careerId, roll) {
      const tier = MEDICAL_BILLS_TIER[careerId];
      if (!tier) return 0;
      if (tier === 'A') return roll >= 8 ? 1 : roll >= 4 ? 0.75 : 0;
      if (tier === 'B') return roll >= 12 ? 1 : roll >= 8 ? 0.75 : roll >= 4 ? 0.5 : 0;
      return roll >= 12 ? 0.75 : roll >= 8 ? 0.5 : 0; // tier C
    }

    // ── Medical Care for non-Injury-Table stat losses ─────────
    // Mishaps/events can also reduce a physical characteristic directly
    // (e.g. Drifter Mishap 4, Marine Mishap 2) without routing through
    // the Injury Table. These get the same Medical Care offer as a
    // genuine Injury Table result — applies immediately, then offers
    // treatment at Cr5000/point with the same coverage-roll/debt rules.
    // Does NOT apply to Ageing rolls (those are a separate, later phase).
    function physicalAutoReductions(entry) {
      const list = entry.autoStats ? entry.autoStats : (entry.autoStat ? [entry.autoStat] : []);
      return list.filter(r => AGEING_PHYS.includes(r.key) && r.amount < 0).map(r => ({ key: r.key, amount: -r.amount }));
    }

    function renderAutoMedCareBlock(phase, reductions, resolved, resultText) {
      if (resolved) {
        return resultText ? `<div class="wizard-card-sub" style="color:#00ffaa;">${resultText}</div>` : '';
      }
      const rows = reductions.map((r, i) => `
        <div style="margin-bottom:6px;">
          ${INJURY_LABEL[r.key]} lost ${r.amount} — restore
          <input id="automedcare-${phase}-${i}" type="number" min="0" max="${r.amount}" value="0" style="width:50px;" /> point(s) at Cr5000 each
        </div>
      `).join('');
      return `
        <div style="margin:8px 0; padding:10px; border:1px solid #0a4a60; border-radius:6px;">
          <div style="margin-bottom:8px; font-size:0.85rem; color:#4a9ab8;">Medical care can restore lost characteristics at Cr5000 per point. Unpaid (and any uncovered) cost goes to debt — no cap.</div>
          ${rows}
          <div class="wizard-actions" style="justify-content:flex-start; gap:10px; margin-top:8px;">
            <button class="btn-outline" onclick="confirmAutoMedCare('${phase}')">Seek Medical Care</button>
            <button class="btn-outline" onclick="declineAutoMedCare('${phase}')">Decline — Leave the Damage</button>
          </div>
        </div>
      `;
    }

    async function confirmAutoMedCare(phase) {
      const s = step5State();
      const reductions = s.medCareReductions || [];
      let totalPoints = 0;
      for (let i = 0; i < reductions.length; i++) {
        const r = reductions[i];
        const points = Math.max(0, Math.min(r.amount, parseInt(document.getElementById(`automedcare-${phase}-${i}`).value, 10) || 0));
        totalPoints += points;
        if (points) await applyStatChange(r.key, points);
      }
      if (totalPoints === 0) {
        await declineAutoMedCare(phase);
        return;
      }
      const cost = totalPoints * 5000;
      let coverage = 0, rollText = 'No career active — no coverage.';
      if (s.careerId && MEDICAL_BILLS_TIER[s.careerId]) {
        const roll = roll2d6() + (s.rank || 0);
        coverage = medicalBillsCoverage(s.careerId, roll);
        rollText = `Medical Bills roll: ${roll} (incl. rank ${s.rank || 0}) — ${Math.round(coverage * 100)}% covered.`;
      }
      const debtAdded = Math.round(cost * (1 - coverage));
      if (debtAdded > 0) await applyStatChange('debt', debtAdded);
      const resultText = `Medical Care — restored ${totalPoints} point(s) for Cr${cost}. ${rollText}${debtAdded > 0 ? ` Cr${debtAdded} added to debt (total debt now Cr${(draft.debt || 0)}).` : ' Fully covered — no debt added.'}`;
      await logCreation(resultText);
      await saveStep5State({ medCareResolved: true, medCareResultText: resultText });
      renderStep();
    }

    async function declineAutoMedCare(phase) {
      await logCreation('Medical Care — declined; damage left as-is.');
      await saveStep5State({ medCareResolved: true, medCareResultText: 'Declined medical care.' });
      renderStep();
    }

    function offerMedicalCare(tag, reductions) {
      const desc = reductions.map(r => `${INJURY_LABEL[r.key]} −${r.amount}`).join(', ');
      saveMechanic(tag, { medCare: { reductions, desc } }).then(() => renderMedicalCareOffer(tag));
    }

    function renderMedicalCareOffer(tag) {
      const m = mechanicState(tag);
      const mc = m.medCare;
      const el = document.getElementById('resolver-' + tag);
      const rows = mc.reductions.map((r, i) => `
        <div style="margin-bottom:6px;">
          ${INJURY_LABEL[r.key]} lost ${r.amount} — restore
          <input id="medcare-${tag}-${i}" type="number" min="0" max="${r.amount}" value="0" style="width:50px;" /> point(s) at Cr5000 each
        </div>
      `).join('');
      el.innerHTML = `
        <div style="margin-bottom:8px;">${mc.desc}.</div>
        <div style="margin-bottom:8px; font-size:0.85rem; color:#4a9ab8;">Medical care can restore lost characteristics at Cr5000 per point. Unpaid (and any uncovered) cost goes to debt — no cap.</div>
        ${rows}
        <div class="wizard-actions" style="justify-content:flex-start; gap:10px; margin-top:8px;">
          <button class="btn-outline" onclick="confirmMedicalCare('${tag}')">Seek Medical Care</button>
          <button class="btn-outline" onclick="declineMedicalCare('${tag}')">Decline — Leave the Damage</button>
        </div>
      `;
    }

    async function declineMedicalCare(tag) {
      const m = mechanicState(tag);
      await finishInjury(tag, m.medCare.desc);
    }

    async function confirmMedicalCare(tag) {
      const m = mechanicState(tag);
      const mc = m.medCare;
      let totalPoints = 0;
      for (let i = 0; i < mc.reductions.length; i++) {
        const r = mc.reductions[i];
        const points = Math.max(0, Math.min(r.amount, parseInt(document.getElementById(`medcare-${tag}-${i}`).value, 10) || 0));
        totalPoints += points;
        if (points) await applyStatChange(r.key, points);
      }

      if (totalPoints === 0) {
        await finishInjury(tag, mc.desc);
        return;
      }

      const cost = totalPoints * 5000;
      const s = step5State();
      let coverage = 0, rollText = 'No career active — no coverage.';
      if (s.careerId && MEDICAL_BILLS_TIER[s.careerId]) {
        const roll = roll2d6() + (s.rank || 0);
        coverage = medicalBillsCoverage(s.careerId, roll);
        rollText = `Medical Bills roll: ${roll} (incl. rank ${s.rank || 0}) — ${Math.round(coverage * 100)}% covered.`;
      }
      const debtAdded = Math.round(cost * (1 - coverage));
      if (debtAdded > 0) await applyStatChange('debt', debtAdded);

      const resultText = `Restored ${totalPoints} point(s) for Cr${cost}. ${rollText}${debtAdded > 0 ? ` Cr${debtAdded} added to debt (total debt now Cr${(draft.debt || 0)}).` : ' Fully covered — no debt added.'}`;
      await logCreation(`Medical Care — ${resultText}`);
      await finishInjury(tag, mc.desc, resultText);
    }

    // ── Mishap roll 1 — universal across all 13 careers' mishap tables
    // ("Severely injured — same as Injury table result 2, or roll twice
    // and take the lower"). Previously had no mechanic at all (tools:[]
    // and no bespoke handler in any career), so it silently fell through
    // to the empty generic resolver. Reuses the existing Injury Table UI
    // (renderInjuryPicker) directly, same pattern as Scholar mishap 2's
    // "roll twice, pick one" shape.
    function renderMishapRoll1Choice(tag) {
      return `
        <div style="display:flex; gap:10px; flex-wrap:wrap; margin-bottom:12px;">
          <button class="btn-outline" onclick="acceptMishapRoll1Injury('${tag}')">Accept Injury Result 2</button>
          <button class="btn-outline" onclick="rerollMishapRoll1Injury('${tag}')">Roll Twice, Take the Lower</button>
        </div>
        <div id="resolver-${tag}"></div>
      `;
    }

    async function acceptMishapRoll1Injury(tag) {
      await logCreation('Mishap roll 1 — accepted Injury Table result 2 (fixed severity).');
      renderInjuryPicker(tag, 2, INJURY_TABLE.find(x => x.roll === 2));
    }

    async function rerollMishapRoll1Injury(tag) {
      const r1 = rollDie(), r2 = rollDie();
      const roll = Math.min(r1, r2);
      await logCreation(`Mishap roll 1 — rolled twice (${r1}, ${r2}), took the lower: Injury Table result ${roll}.`);
      renderInjuryPicker(tag, roll, INJURY_TABLE.find(x => x.roll === roll));
    }

    async function finishInjury(tag, desc, medicalResultText) {
      const summary = `Injury sustained${desc ? ': ' + desc : ' — no permanent effect'}.${medicalResultText ? ' ' + medicalResultText : ''}`;
      document.getElementById('resolver-' + tag).innerHTML = `<p style="color:#00ffaa; font-size:0.85rem;">${summary}</p>`;
      if (!medicalResultText) await logCreation(`Injury Table — ${desc || 'no permanent effect'}.`);
      markResolverDone(tag, summary);
    }

    // ── Life Events Table (Core p.46) — reachable from any mishap/event
    // that lists 'lifeEvent' as a tool. Nests the generic resolver tools
    // for its own associate/skill grants, then closes out the parent tag.
    function openLifeEventResolver(tag) {
      document.getElementById('resolver-' + tag).innerHTML =
        `<button class="btn-outline" onclick="rollLifeEvent('${tag}')">Roll 2D for a Life Event</button>`;
    }

    function rollLifeEvent(tag) {
      const roll = roll2d6();
      const entry = LIFE_EVENTS_TABLE.find(x => x.roll === roll);
      logCreation(`Life Event roll: ${roll} — ${entry.text}`);
      renderLifeEventBody(tag, entry);
    }

    function renderLifeEventBody(tag, entry) {
      const el = document.getElementById('resolver-' + tag);
      let body = `<div style="margin-bottom:8px;">Rolled ${entry.roll} — ${entry.text}</div>`;
      if (entry.injury) {
        body += `<button class="btn-outline" onclick="openInjuryResolver('${tag}')">Roll on the Injury Table</button>`;
      } else if (entry.unusual) {
        body += `<button class="btn-outline" onclick="rollLifeEventUnusual('${tag}')">Roll 1D for the Unusual Event</button>`;
      } else if (entry.crimeChoice) {
        body += `
          <div class="wizard-actions" style="justify-content:flex-start; gap:10px; margin-top:0;">
            <button class="btn-outline" onclick="lifeEventCrimeChoice('${tag}','loseBenefit')">Lose One Benefit Roll</button>
            <button class="btn-outline" onclick="lifeEventCrimeChoice('${tag}','prisoner')">Take Prisoner Career Next Term</button>
          </div>
        `;
      } else if (entry.convertOrGain) {
        body += `<div id="resolver-${tag}Life">Loading your Contacts and Allies…</div>`;
      } else {
        // A single tool now auto-resolves the parent event/mishap the
        // moment it's applied (via baseResolverTag), so the explicit Mark
        // Resolved button below is only needed when there's nothing to
        // apply (no tools) or multiple tools need manual coordination —
        // otherwise it lets the player skip past without actually using
        // the tool (e.g. "Gain an Ally" resolving with no Ally added).
        const tools = entry.tools || [];
        body += renderGenericResolver(tag + 'Life', tools, true, { skillOptions: entry.skillOptions, associateTypes: entry.associateTypes, statOptions: entry.statOptions, statAmount: entry.statAmount });
        if (tools.length !== 1) {
          body += `<button class="btn-outline" onclick="finishLifeEvent('${tag}')">Mark Resolved</button>`;
        }
      }
      el.innerHTML = body;
      if (entry.convertOrGain) loadLifeEventConvert(tag, entry);
      if (entry.autoDM) {
        addPendingMod(entry.autoDM.key, entry.autoDM.amount);
        logCreation(`Life Event — banked DM${entry.autoDM.amount > 0 ? '+' : ''}${entry.autoDM.amount} (${entry.autoDM.key}).`);
      }
    }

    // Life Event roll 8 (Betrayal) — convert an existing Contact/Ally into
    // a Rival/Enemy, or gain a fresh Rival/Enemy if there's nothing to
    // convert. The generic resolver's "Add Associate" tool only ever adds,
    // so this needs its own list-and-convert UI backed by
    // listAssociatesOfTypes/convertAssociateType.
    async function loadLifeEventConvert(tag, entry) {
      const candidates = await listAssociatesOfTypes(entry.convertFrom);
      const el = document.getElementById(`resolver-${tag}Life`);
      if (!el) return;
      const typeLabels = { ally: 'Ally', contact: 'Contact', rival: 'Rival', enemy: 'Enemy' };
      el.innerHTML = `
        ${candidates.length ? `
          <div style="margin-bottom:8px; font-size:0.82rem; color:#4a9ab8;">Convert an existing associate:</div>
          ${candidates.map(c => `
            <div style="display:flex; align-items:center; gap:8px; margin-bottom:6px;">
              <span style="font-size:0.85rem;">${escapeHtml(c.name)} (${typeLabels[c.type]})</span>
              ${entry.convertTo.map(t => `<button class="btn-outline" onclick="convertLifeEventAssociate('${tag}','${c.id}','${t}','${escapeAttrJs(c.name)}')">→ ${typeLabels[t]}</button>`).join('')}
            </div>
          `).join('')}
          <div style="margin:10px 0; font-size:0.8rem; color:#4a9ab8;">— or gain a fresh one instead —</div>
        ` : ''}
        <input id="resolver-${tag}Life-name" type="text" placeholder="Name" style="margin-bottom:8px;" />
        <div class="wizard-actions" style="justify-content:flex-start; gap:10px; margin-top:0;">
          ${entry.convertTo.map(t => `<button class="btn-outline" onclick="gainLifeEventAssociate('${tag}','${t}')">Gain as ${typeLabels[t]}</button>`).join('')}
        </div>
      `;
    }

    function escapeAttrJs(s) { return String(s == null ? '' : s).replace(/\\/g, '\\\\').replace(/'/g, "\\'"); }

    async function convertLifeEventAssociate(tag, id, type, name) {
      await convertAssociateType(id, type);
      const resultText = `Betrayal — converted ${name} into a ${type === 'rival' ? 'Rival' : 'Enemy'}.`;
      await logCreation(`Life Event — ${resultText}`);
      await finishLifeEvent(tag, resultText);
    }

    async function gainLifeEventAssociate(tag, type) {
      const nameEl = document.getElementById(`resolver-${tag}Life-name`);
      const name = nameEl ? nameEl.value.trim() : '';
      if (!name) return;
      await addAssociate(type, name, 'Gained from a betrayal (Life Event roll 8).');
      const resultText = `Betrayal — gained ${name} as a ${type === 'rival' ? 'Rival' : 'Enemy'}.`;
      await logCreation(`Life Event — ${resultText}`);
      await finishLifeEvent(tag, resultText);
    }

    async function lifeEventCrimeChoice(tag, choice) {
      let resultText;
      if (choice === 'loseBenefit') {
        await addPendingMod('extraBenefitRolls', -1);
        resultText = 'Life Event (Crime) — lost one Benefit roll.';
      } else {
        await saveStep5State({ forcedPrisonerNextTerm: true });

      const roll = rollDie();
      if (roll === 2) {
        renderLifeEventUnusualAliens(tag);
        return;
      }
      // Roll 1 (Psionics) genuinely tests PSI now, not just flavor text —
      // a random discovery, so no GM approval gate (that's only required
      // at the proactive Step 2 gate). Skip the test if already tested.
      let text = LIFE_EVENTS_UNUSUAL[roll];
      if (roll === 1) {
        if (draft.psi === null || draft.psi === undefined) await rollPSI(0);
        text += ` (PSI ${draft.psi}.)`;

      document.getElementById('resolver-' + tag).innerHTML =
        `<p style="color:#00ffaa; font-size:0.85rem;">${text}</p>`;

      if (tag === 'startRank') return 'startRankMechanic';

      const s = step5State();
      return s[mechanicTagKey(tag)] || {};

      const key = mechanicTagKey(tag);
      const merged = Object.assign({}, mechanicState(tag), patch);
      await saveStep5State({ [key]: merged });

    function resolverHeader(text) {
      return `<div class="wizard-card-sub" style="margin-bottom:10px;">${text}</div>`;

    // Psion Mishap 3: 1D sub-roll — 1-2 injured (real Injury Table roll),
    // 3-4 lose one SOC (neither branch says you leave, so both override
    // the default ejection), 5-6 nothing else happens but you still must
    // leave (the default ejection applies as normal here).
    function renderPsionMishap3(tag, m) {
      if (!m.subRoll) {
        return resolverHeader('Roll 1D to see what happens.') + `
          <button class="btn-outline" onclick="rollPsionMishap3('${tag}')">Roll</button>
        `;
      }
      if (m.subRoll <= 2) return resolverHeader(m.resultText || 'Injured.') + `<div id="resolver-${tag}"></div>`;
      return resolverHeader(m.resultText);
    }

    async function rollPsionMishap3(tag) {
      const roll = rollDie();
      let resultText;
      if (roll <= 2) {
        resultText = `Rolled ${roll} — injured.`;
        await saveMechanic(tag, { subRoll: roll, resultText, noEjectOverride: true });
        await logCreation(`Psion Mishap 3: ${resultText}`);
        renderStep();
        const injuryRoll = rollDie();
        renderInjuryPicker(tag, injuryRoll, INJURY_TABLE.find(x => x.roll === injuryRoll));
        return;
      } else if (roll <= 4) {
        await applyStatChange('soc', -1);
        resultText = `Rolled ${roll} — lost one SOC.`;
        await saveMechanic(tag, { subRoll: roll, resolved: true, resultText, noEjectOverride: true });
        await resolveMechanic(tag);
        await logCreation(`Psion Mishap 3: ${resultText}`);
        renderStep();
        return;
      } else {
        resultText = `Rolled ${roll} — nothing else happens, but you still must leave this career.`;
      }
      await saveMechanic(tag, { subRoll: roll, resolved: true, resultText });
      await resolveMechanic(tag);
      await logCreation(`Psion Mishap 3: ${resultText}`);
      renderStep();
    }

    // any future career with the same wording instead of building another
    // one-off implementation.
    function renderConvertOrGainAssociate(tag, m, openFnName) {
      if (m.resolved) return resolverHeader(m.resultText);
      if (!m.opened) {
        return resolverHeader('Choose what happens:') + `<button class="btn-outline" onclick="${openFnName}('${tag}')">Choose</button>`;
      }
      return `<div id="resolver-${tag}-convert">Loading your associates…</div>`;

    async function loadConvertOrGainAssociate(tag, convertFrom, convertTo, label) {
      const candidates = await listAssociatesOfTypes(convertFrom);
      const el = document.getElementById(`resolver-${tag}-convert`);
      if (!el) return;
      const typeLabels = { ally: 'Ally', contact: 'Contact', rival: 'Rival', enemy: 'Enemy' };
      el.innerHTML = `
        ${candidates.length ? `
          <div style="margin-bottom:8px; font-size:0.82rem; color:#4a9ab8;">Convert an existing associate:</div>
          ${candidates.map(c => `
            <div style="display:flex; align-items:center; gap:8px; margin-bottom:6px;">
              <span style="font-size:0.85rem;">${escapeHtml(c.name)} (${typeLabels[c.type]})</span>
              ${convertTo.map(t => `<button class="btn-outline" onclick="confirmConvertOrGainAssociate('${tag}','${c.id}','${t}','${escapeAttrJs(c.name)}','${escapeAttrJs(label)}')">→ ${typeLabels[t]}</button>`).join('')}
            </div>
          `).join('')}
          <div style="margin:10px 0; font-size:0.8rem; color:#4a9ab8;">— or gain a fresh one instead —</div>
