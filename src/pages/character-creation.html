      await logCreation('Event 11 outcome: fled — will join the Drifter career next term.');
      renderStep();
    }

    async function event11AcceptDraft() {
      const branchRoll = rollDie();
      const branchId = branchRoll <= 3 ? 'army' : branchRoll <= 5 ? 'marine' : 'navy';
      const branchName = branchRoll <= 3 ? 'Army' : branchRoll <= 5 ? 'Marine' : 'Navy';
      const s = step4State();
      await saveStep4State({ ...s, preed_event11_draftBranch: branchId });
      await saveEventMechanic({ resolved: true, gradForcedFail: true, outcome: `Drafted into the ${branchName} — that career begins next term. You do not graduate this term.` });
      await logCreation(`Event 11 outcome: drafted into the ${branchName}.`);
      renderStep();
    }

    // ── Connections Rule widget (shared by event/graduation screens) ──
    function connectionsUsed() { return (draft.creation_data && draft.creation_data.connectionsUsed) || 0; }

    function renderConnectionWidget(tag) {
      if (connectionsUsed() >= 2) {
        return `<div style="font-size:0.8rem; color:#4a9ab8; margin-bottom:14px;">Connections used: 2 of 2 (maximum reached).</div>`;
      }
      return `
        <div style="margin-bottom:14px;">
          <button class="btn-outline" onclick="openConnectionPicker('${tag}')">Add Connection</button>
          <span style="font-size:0.78rem; color:#4a9ab8; margin-left:10px;">Connections used: ${connectionsUsed()} of 2</span>
        </div>
        <div id="connection-picker-${tag}"></div>
      `;
    }

    async function openConnectionPicker(tag) {
      const { data } = await supabaseClient.from('characters')
        .select('id,name').neq('id', draft.id).order('name');
      const el = document.getElementById('connection-picker-' + tag);
      if (!data || !data.length) {
        el.innerHTML = `<p class="wizard-error">No other characters in the Roster to connect with yet.</p>`;
        return;
      }
      el.innerHTML = `
        <div class="wizard-field">
          <label>Connect with</label>
          <select id="connection-target-${tag}">
            <option value="">— choose a Traveller —</option>
            ${data.map(c => `<option value="${c.id}">${c.name}</option>`).join('')}
          </select>
        </div>
        <button class="btn-outline" onclick="confirmConnection('${tag}')">Confirm Connection</button>
      `;
    }

    async function confirmConnection(tag) {
      const sel = document.getElementById('connection-target-' + tag);
      const targetId = sel.value;
      if (!targetId) return;
      const targetName = sel.options[sel.selectedIndex].text;

      const data = draft.creation_data || {};
      data.connectionsUsed = (data.connectionsUsed || 0) + 1;
      draft.creation_data = data;
      await supabaseClient.from('characters').update({ creation_data: data }).eq('id', draft.id);

      // A real Player Connections entry (Character Record's Career &
      // Associates tab), editable there so the player can flesh out what
      // the connection actually means. The free skill choice this grants
      // is deferred to Finalize (renderConnectionSkillPick), not applied
      // here — same Connections Rule, just resolved at the end instead of
      // mid-creation. Written on BOTH characters' sheets — a connection
      // is two-sided — so the other player sees it too (needs the
      // insert policy from player-connections-insert-fix-schema.sql,
      // since this second insert is onto a character this user doesn't own).
      await supabaseClient.from('character_connections').insert({
        character_id: draft.id, other_character_id: targetId, other_name: targetName,
        description: 'Connection formed during character creation.'
      });
      await supabaseClient.from('character_connections').insert({
        character_id: targetId, other_character_id: draft.id, other_name: draft.name,
        description: 'Connection formed during character creation.'
      });
      await logCreation(`Formed a connection with ${targetName} — gained one free skill choice (resolved at Finalize).`);

      document.getElementById('connection-picker-' + tag).innerHTML =
        `<p style="color:#00ffaa; font-size:0.85rem;">Connection recorded with ${targetName}. You'll choose the free skill it grants at Finalize, and the connection itself is editable on your Character Record's Career &amp; Associates tab once activated.</p>`;
      renderStep();
    }

    function renderPreEdGraduation() {
      const s = step4State();
      const opt = findOption(s.optionId);
      const g = opt.graduation(draft);
      const gradRoll = s.gradRoll;

      if (!gradRoll && s.eventMechanic && s.eventMechanic.gradForcedFail) {
        return `
          <div class="rule-card wizard-card">
            <div class="wizard-card-title">${opt.name} — Graduation</div>
            <div class="wizard-card-sub">This term's event means you do not graduate — no roll needed.</div>
            <div class="wizard-actions">
              <button class="btn-outline" onclick="forceFailGraduation()">Continue</button>
            </div>
          </div>
        `;
      }

      if (!gradRoll) {
        const statLabel = (CHARS.find(c => c.key === g.stat) || { label: (g.stat || '').toUpperCase() }).label;
        return `
          <div class="rule-card wizard-card">
            <div class="wizard-card-title">${opt.name} — Graduation</div>
            <div class="wizard-card-sub">
              Roll 2D + ${statLabel} DM${g.extraDM ? ' + ' + g.extraDM : ''} (need ${g.target}+, honours on ${g.honours}+).${g.dmLabel ? ' ' + g.dmLabel : ''}
            </div>
            <div class="wizard-actions" style="justify-content:flex-start;">
              <button class="btn-outline" onclick="rollPreEdGraduation()">Roll Graduation</button>
            </div>
          </div>
        `;
      }

      return `
        <div class="rule-card wizard-card">
          <div class="wizard-card-title">${opt.name} — Graduation</div>
          <div class="wizard-card-sub">
            Rolled ${gradRoll.total} (need ${g.target}+). ${gradRoll.success ? (gradRoll.honours ? 'Graduated with honours!' : 'Graduated.') : 'Did not graduate.'}
          </div>
          <div class="wizard-actions">
            <button class="btn-outline" onclick="goToPreEdBenefits()">Continue</button>
          </div>
        </div>
      `;
    }

    async function rollPreEdGraduation() {
      const s = step4State();
      const opt = findOption(s.optionId);
      const g = opt.graduation(draft);
      const d1 = rollDie(), d2 = rollDie();
      const statDM = dmNum(draft[g.stat] === undefined ? 0 : draft[g.stat]);
      const total = d1 + d2 + statDM + (g.extraDM || 0);
      const success = total >= g.target;
      const honours = success && total >= g.honours;
      await saveStep4State({ gradRoll: { dice: [d1, d2], total, success, honours, target: g.target } });
      await logCreation(`${opt.name} — Graduation roll: ${total} (need ${g.target}+) — ${success ? (honours ? 'graduated with honours.' : 'graduated.') : 'did not graduate.'}`);
      renderStep();
    }

    async function goToPreEdBenefits() {
      await saveStep4State({ phase: 'benefits' });
      renderStep();
    }

    async function forceFailGraduation() {
      await saveStep4State({ gradRoll: { success: false, forced: true }, phase: 'benefits' });
      await logCreation('Graduation skipped — forced fail from a Pre-Career Event.');
      renderStep();
    }

    function renderPreEdBenefits() {
      const s = step4State();
      const opt = findOption(s.optionId);

      if (!s.gradRoll.success) {
        return `
          <div class="rule-card wizard-card">
            <div class="wizard-card-title">${opt.name} — No Graduation</div>
            <div class="wizard-card-sub">You did not graduate, so no Graduation Benefits apply. Moving on to choosing a career.</div>
            <div class="wizard-actions">
              <button class="btn-outline" onclick="finishPreEd()">Continue to Career</button>
            </div>
          </div>
        `;
      }

      const applicable = opt.benefits.filter(b => !b.honoursOnly || s.gradRoll.honours);
      const applied = s.benefitsApplied || {};
      const actionableTypes = ['stat', 'multiStat', 'fixedSkill', 'bumpEntrySkills', 'pendingMod', 'rollMultiStat', 'academyBonus', 'associate'];

      const appliedDetails = s.benefitsAppliedDetails || {};
      const rows = applicable.map(b => {
        const done = applied[b.id];
        if (b.type === 'chooseN') return renderChooseNBenefit(b, s, done);
        if (b.type === 'commissionPreroll') return renderCommissionPrerollBenefit(b, s, done);
        if (b.type === 'associate') return renderAssociateBenefit(b, s, done);
        if (b.type === 'bumpEntrySkills' && !done) {
          const bumpGate = renderBumpEntrySkillsGate(b, s);
          if (bumpGate) return bumpGate;
        }
        const isAuto = actionableTypes.includes(b.type);
        const detailText = done && appliedDetails[b.id] ? appliedDetails[b.id] : b.text;
        return `
          <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:14px; margin-bottom:10px; padding:10px; border:1px solid #0a4a60; border-radius:6px;">
            <div style="font-size:0.85rem;">${detailText}</div>
            ${isAuto
              ? `<button class="btn-outline" id="preed-benefit-${b.id}-apply-btn" onclick="applyPreEdBenefit('${b.id}')" ${done ? 'disabled' : ''} style="flex-shrink:0;">${done ? 'Applied' : 'Apply'}</button>`
              : `<span style="font-size:0.75rem; color:#4a9ab8; flex-shrink:0;">Recorded as a note</span>`
            }
          </div>
        `;
      }).join('');

      const allDone = applicable.every(b => {
        if (b.type === 'chooseN') return applied[b.id] || !(benefitPool(b, s) || []).length;
        return (actionableTypes.includes(b.type) || b.type === 'commissionPreroll') ? applied[b.id] : true;
      });

      return `
        <div class="rule-card wizard-card">
          <div class="wizard-card-title">${opt.name} — Graduation Benefits${s.gradRoll.honours ? ' (Honours)' : ''}</div>
          ${rows}
          ${renderConnectionWidget('grad4_' + (draft.id || ''))}
          <div class="wizard-actions">
            <button class="btn-outline" onclick="finishPreEd()" ${allDone ? '' : 'disabled'}>Continue to Career</button>
          </div>
        </div>
      `;
    }

    function benefitPool(b, s) {
      return typeof b.pool === 'function' ? b.pool(s) : b.pool;
    }

    // bumpEntrySkills bumps the level-0 skill chosen at entry up to level 1
    // (University's "increase both skills chosen at entry by one level").
    // A level-0 skill is generic (no specialty needed), but the moment it
    // reaches level 1 a specialty skill MUST have one — so gate on that
    // before the Apply button is reachable. Returns null (no gate needed)
    // if the level-0 skill has no specialties.
    function renderBumpEntrySkillsGate(b, s) {
      const ch = s.entrySkillChooser || {};
      if (!ch.level0Skill || s.bumpChosenSpecialty) return null;
      const specs = skillSpecialtiesFor(ch.level0Skill);
      if (!specs.length) return null;
      return `
        <div style="margin-bottom:10px; padding:10px; border:1px solid #0a4a60; border-radius:6px;">
          <div style="font-size:0.85rem; margin-bottom:8px;">${b.text}</div>
          <div class="wizard-card-sub" style="margin-bottom:8px;">${ch.level0Skill} is reaching level 1 — choose a specialty:</div>
          <select id="bump-chosen-specialty">
            <option value="">— specialty —</option>
            ${specs.map(sp => `<option value="${sp.name}">${sp.name}</option>`).join('')}
          </select>
          <button class="btn-outline" onclick="chooseBumpChosenSpecialty()">Confirm</button>
        </div>
      `;
    }

    async function chooseBumpChosenSpecialty() {
      const sel = document.getElementById('bump-chosen-specialty');
      const specialty = sel ? sel.value : '';
      if (!specialty) return;
      await saveStep4State({ bumpChosenSpecialty: specialty });
      renderStep();
    }

    // A graduation benefit that grants a real associate (e.g. Psionic
    // Community's "Gain a Rival unhappy you left" — Enemy instead with
    // honours, via b.honoursType). Needs a name, so it can't use the
    // generic stat/skill Apply button — same shape as renderBumpEntrySkillsGate's
    // input gate, but its own apply function instead.
    function renderAssociateBenefit(b, s, done) {
      const appliedDetails = s.benefitsAppliedDetails || {};
      if (done) {
        return `
          <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:14px; margin-bottom:10px; padding:10px; border:1px solid #0a4a60; border-radius:6px;">
            <div style="font-size:0.85rem;">${appliedDetails[b.id] || b.text}</div>
            <span style="font-size:0.75rem; color:#4a9ab8; flex-shrink:0;">Applied</span>
          </div>
        `;
      }
      return `
        <div style="margin-bottom:10px; padding:10px; border:1px solid #0a4a60; border-radius:6px;">
          <div style="font-size:0.85rem; margin-bottom:8px;">${b.text}</div>
          <input id="preed-assoc-name-${b.id}" type="text" placeholder="Name" style="margin-bottom:8px;" />
          <button class="btn-outline" id="preed-assoc-${b.id}-apply-btn" onclick="applyPreEdAssociateBenefit('${b.id}')">Apply</button>
        </div>
      `;
    }

    async function applyPreEdAssociateBenefit(benefitId) {
      const btn = document.getElementById(`preed-assoc-${benefitId}-apply-btn`);
      if (btn && btn.disabled) return;
      if (btn) {
        btn.disabled = true;
        btn.style.opacity = '0.5';
        btn.style.cursor = 'not-allowed';
      }
      const s = step4State();
      const opt = findOption(s.optionId);
      const b = opt.benefits.find(x => x.id === benefitId);
      const nameEl = document.getElementById(`preed-assoc-name-${benefitId}`);
      const name = nameEl ? nameEl.value.trim() : '';
      if (!name) return;
      const honours = s.gradRoll && s.gradRoll.honours;
      const type = (honours && b.honoursType) ? b.honoursType : b.associateType;
      await addAssociate(type, name, b.associateDesc || 'Gained from pre-career education.');
      const typeLabel = { ally: 'Ally', contact: 'Contact', rival: 'Rival', enemy: 'Enemy' }[type];
      const appliedText = `${b.text} — gained ${name} as ${typeLabel}.`;
      const applied = Object.assign({}, s.benefitsApplied, { [benefitId]: true });
      const appliedDetails = Object.assign({}, s.benefitsAppliedDetails, { [benefitId]: appliedText });
      await saveStep4State({ benefitsApplied: applied, benefitsAppliedDetails: appliedDetails });
      await logCreation(`Applied Graduation Benefit: ${appliedText}`);
      renderStep();
    }

    function renderChooseNBenefit(b, s, done) {
      const pool = benefitPool(b, s) || [];
      const choosers = s.benefitChoosers || {};
      const chosen = choosers[b.id] || [];
      if (!pool.length) {
        return `
          <div style="margin-bottom:10px; padding:10px; border:1px solid #0a4a60; border-radius:6px;">
            <div style="font-size:0.85rem; margin-bottom:8px;">${b.text}</div>
            <span style="font-size:0.75rem; color:#4a9ab8;">No applicable skill table available yet for this branch/option — recorded as a note instead.</span>
          </div>
        `;
      }
      const ready = chosen.length === b.n && chosen.every(c => b.level < 1 || !skillSpecialtiesFor(c.name).length || c.specialty);
      return `
        <div style="margin-bottom:10px; padding:10px; border:1px solid #0a4a60; border-radius:6px;">
          <div style="font-size:0.85rem; margin-bottom:8px;">${b.text} (selected ${chosen.length} of ${b.n})</div>
          <div style="display:flex; gap:10px; flex-wrap:wrap; margin-bottom:8px;">
            ${pool.map(sk => {
              const picked = chosen.find(c => c.name === sk.name && c.fixedSpecialty === (sk.specialty || null));
              const isChosen = !!picked;
              const disable = !isChosen && chosen.length >= b.n;
              const specs = (!sk.specialty && b.level >= 1) ? skillSpecialtiesFor(sk.name) : [];
              return `
                <label style="display:flex; align-items:center; gap:6px; font-size:0.82rem; ${disable ? 'opacity:0.5;' : ''}">
                  <input type="checkbox" ${isChosen ? 'checked' : ''} ${disable || done ? 'disabled' : ''}
                         onchange="toggleChooseNBenefit('${b.id}','${sk.name}',${sk.specialty ? "'" + sk.specialty + "'" : 'null'},${b.n})" style="width:16px; height:16px; accent-color:#00e5ff;" />
                  ${sk.name}${sk.specialty ? ' (' + sk.specialty + ')' : ''}
                </label>
                ${isChosen && specs.length ? `
                  <select ${done ? 'disabled' : ''} onchange="setChooseNBenefitSpecialty('${b.id}','${sk.name}', this.value)">
                    <option value="">— specialty —</option>
                    ${specs.map(sp => `<option value="${sp.name}" ${picked.specialty === sp.name ? 'selected' : ''}>${sp.name}</option>`).join('')}
                  </select>
                ` : ''}
              `;
            }).join('')}
          </div>
          <button class="btn-outline" onclick="applyPreEdBenefit('${b.id}')" ${done || !ready ? 'disabled' : ''}>${done ? 'Applied' : 'Apply'}</button>
        </div>
      `;
    }

    async function toggleChooseNBenefit(benefitId, name, fixedSpecialty, n) {
      const s = step4State();
      const choosers = Object.assign({}, s.benefitChoosers);
      let chosen = (choosers[benefitId] || []).slice();
      const idx = chosen.findIndex(c => c.name === name && c.fixedSpecialty === fixedSpecialty);
      if (idx >= 0) chosen.splice(idx, 1);
      else if (chosen.length < n) chosen.push({ name, specialty: fixedSpecialty, fixedSpecialty });
      choosers[benefitId] = chosen;
      await saveStep4State({ benefitChoosers: choosers });
      renderStep();
    }

    async function setChooseNBenefitSpecialty(benefitId, name, specialty) {
      const s = step4State();
      const choosers = Object.assign({}, s.benefitChoosers);
      const chosen = (choosers[benefitId] || []).map(c => c.name === name ? Object.assign({}, c, { specialty: specialty || null }) : c);
      choosers[benefitId] = chosen;
      await saveStep4State({ benefitChoosers: choosers });
      renderStep();
    }

    // University's pre-emptive commission roll — only Navy/Army are built
    // (Marines isn't yet). Success enters that career directly at officer
    // rank 1 once Step 5 is reached; honours adds DM+2 to this roll.
    function renderCommissionPrerollBenefit(b, s, done) {
      const cp = s.commissionPrerollState || {};
      if (done) {
        return `
          <div style="margin-bottom:10px; padding:10px; border:1px solid #0a4a60; border-radius:6px;">
            <div style="font-size:0.85rem; margin-bottom:6px;">${b.text}</div>
            <div style="font-size:0.8rem; color:#00ffaa;">${cp.resultText}</div>
          </div>
        `;
      }
      if (!cp.branch) {
        return `
          <div style="margin-bottom:10px; padding:10px; border:1px solid #0a4a60; border-radius:6px;">
            <div style="font-size:0.85rem; margin-bottom:8px;">${b.text}</div>
            <div style="display:flex; gap:10px;">
              <button class="btn-outline" onclick="chooseCommissionPrerollBranch('navy')">Navy</button>
              <button class="btn-outline" onclick="chooseCommissionPrerollBranch('army')">Army</button>
              <button class="btn-outline" onclick="chooseCommissionPrerollBranch('marine')">Marine</button>
              <button class="btn-outline" onclick="skipCommissionPreroll('${b.id}')">Skip</button>
            </div>
          </div>
        `;
      }
      const c = careerData(cp.branch);
      const honours = s.gradRoll && s.gradRoll.honours;
      return `
        <div style="margin-bottom:10px; padding:10px; border:1px solid #0a4a60; border-radius:6px;">
          <div style="font-size:0.85rem; margin-bottom:8px;">Roll 2D + SOC DM (need ${c.commission.target}+)${honours ? ' + DM+2 (honours)' : ''} for ${c.name}.</div>
          <button class="btn-outline" onclick="rollCommissionPreroll('${b.id}')">Roll</button>
        </div>
      `;
    }

    async function chooseCommissionPrerollBranch(branch) {
      await saveStep4State({ commissionPrerollState: { branch } });
      renderStep();
    }

    async function markCommissionPrerollDone(benefitId) {
      const s = step4State();
      const applied = Object.assign({}, s.benefitsApplied, { [benefitId]: true });
      await saveStep4State({ benefitsApplied: applied });
    }

    async function skipCommissionPreroll(benefitId) {
      await saveStep4State({ commissionPrerollState: { resolved: true, resultText: 'Skipped.' } });
      await markCommissionPrerollDone(benefitId);
      renderStep();
    }

    async function rollCommissionPreroll(benefitId) {
      const s = step4State();
      const cp = s.commissionPrerollState;
      const c = careerData(cp.branch);
      const honours = s.gradRoll && s.gradRoll.honours;
      const total = roll2d6() + dmNum(draft.soc) + (honours ? 2 : 0);
      const success = total >= c.commission.target;
      let resultText;
      if (success) {
        await saveStep5State({ careerId: cp.branch, isOfficer: true, rank: 1, phase: 'assignment' });
        resultText = `Rolled ${total} (need ${c.commission.target}+) — success! You'll enter ${c.name} at officer rank 1 once you reach the Career step.`;
      } else {
        resultText = `Rolled ${total} (need ${c.commission.target}+) — failed. You can still attempt ${c.name} normally in the Career step.`;
      }
      await saveStep4State({ commissionPrerollState: { resolved: true, resultText } });
      await markCommissionPrerollDone(benefitId);
      await logCreation(`University commission preroll (${c.name}): ${resultText}`);
      renderStep();
    }

    async function applyPreEdBenefit(benefitId) {
      const btn = document.getElementById(`preed-benefit-${benefitId}-apply-btn`);
      if (btn && btn.disabled) return;
      if (btn) {
        btn.disabled = true;
        btn.style.opacity = '0.5';
        btn.style.cursor = 'not-allowed';
      }
      const s = step4State();
      const opt = findOption(s.optionId);
      const b = opt.benefits.find(x => x.id === benefitId);
      const update = {};
      let appliedText = b.text;

      if (b.type === 'stat') {
        update[b.key] = (draft[b.key] || 0) + b.amount;
      } else if (b.type === 'multiStat') {
        Object.keys(b.changes).forEach(k => { update[k] = (draft[k] || 0) + b.changes[k]; });
      } else if (b.type === 'fixedSkill') {
        const skills = Object.assign({}, draft.skills || {});
        grantSkillMin(skills, b.name, b.specialty, b.level);
        update.skills = skills;
      } else if (b.type === 'bumpEntrySkills') {
        const ch = s.entrySkillChooser || {};
        const skills = Object.assign({}, draft.skills || {});
        if (ch.level0Skill) {
          if (skillSpecialtiesFor(ch.level0Skill).length && s.bumpChosenSpecialty) {
            bumpSpecialtySkill(skills, ch.level0Skill, s.bumpChosenSpecialty, b.amount);
          } else {
            bumpSkill(skills, ch.level0Skill, null, b.amount);
          }
          bumpSkill(skills, ch.level1Skill, ch.level1Specialty || null, b.amount);
        } else if (ch.chosen) {
          Object.values(ch.chosen).forEach(c => bumpSkill(skills, c.name, c.specialty, b.amount));
        }
        update.skills = skills;
      } else if (b.type === 'chooseN') {
        const chosen = (s.benefitChoosers && s.benefitChoosers[b.id]) || [];
        const skills = Object.assign({}, draft.skills || {});
        chosen.forEach(c => {
          if (b.bump) {
            bumpSpecialtySkill(skills, c.name, c.specialty || null, 1);
          } else {
            grantSpecialtySkillMin(skills, c.name, c.specialty || null, b.level);
          }
        });
        update.skills = skills;
        appliedText = `${b.text} — chose ${chosen.map(c => `${c.name}${c.specialty ? ' (' + c.specialty + ')' : ''}`).join(', ') || 'none'}.`;
      } else if (b.type === 'pendingMod') {
        await addPendingMod(b.key, b.amount);
        appliedText = `${b.text} (banked).`;
      } else if (b.type === 'academyBonus') {
        await addAcademyBonus(b.id, { amount: b.amount, careers: b.careers || null, firstCareerOnly: !!b.firstCareerOnly, rollTypes: b.rollTypes, label: b.text });
        appliedText = `${b.text} (standing bonus — applies automatically).`;
      } else if (b.type === 'rollMultiStat') {
        const rolled = {};
        Object.keys(b.fixed || {}).forEach(k => { update[k] = (draft[k] || 0) + b.fixed[k]; });
        Object.keys(b.rolled || {}).forEach(k => {
          const die = b.rolled[k];
          const amount = Math.ceil(rollDie() / (6 / die)) * (b.rolledSign && b.rolledSign[k] < 0 ? -1 : 1);
          update[k] = (draft[k] || 0) + amount;
          rolled[k] = amount;
        });
        appliedText = `${b.text} — rolled ${Object.keys(rolled).map(k => `${k} ${rolled[k] > 0 ? '+' : ''}${rolled[k]}`).join(', ')}.`;
      }

      await supabaseClient.from('characters').update(update).eq('id', draft.id);
      Object.assign(draft, update);

      const applied = Object.assign({}, s.benefitsApplied, { [benefitId]: true });
      const appliedDetails = Object.assign({}, s.benefitsAppliedDetails, { [benefitId]: appliedText });
      await saveStep4State({ benefitsApplied: applied, benefitsAppliedDetails: appliedDetails });
      await logCreation(`Applied Graduation Benefit: ${appliedText}`);
      renderStep();
    }

    async function finishPreEd() {
      const s = step4State();
      const opt = findOption(s.optionId);
      const flagNotes = opt.benefits
        .filter(b => b.type === 'flag' && (!b.honoursOnly || (s.gradRoll && s.gradRoll.honours)))
        .map(b => `- ${b.text}`).join('\n');

      let note = `[PRE-CAREER EDUCATION]\n${opt.name}`;
      if (s.branch) note += ` (${s.branch})`;
      if (s.curriculum) note += ` (${s.curriculum})`;
      note += s.gradRoll
        ? (s.gradRoll.success ? (s.gradRoll.honours ? ' — graduated with honours.' : ' — graduated.') : ' — entered but did not graduate.')
        : ' — entered automatically.';
      if (flagNotes) note += `\nOutstanding benefits to apply by hand once Careers is built:\n${flagNotes}`;
      if (opt.ageNote) note += `\n${opt.ageNote}`;
      note += '\n[/PRE-CAREER EDUCATION]';

      await appendNote(note);

      if (opt.startingAgeRoll) {
        const r = opt.startingAgeRoll;
        const rolls = [];
        let startingAge = r.base;
        for (let i = 0; i < r.rolls; i++) {
          const v = Math.ceil(rollDie() / (6 / r.die));
          rolls.push(v);
          startingAge += v;
        }
        await saveStep5State({ startingAge });
        await supabaseClient.from('characters').update({ age: startingAge }).eq('id', draft.id);
        draft.age = startingAge;
        await logCreation(`${opt.name} — starting age roll: ${r.base} + ${rolls.join(' + ')} = ${startingAge}.`);
      }

    const DRAFT_TABLE = { 1: 'navy', 2: 'army', 3: 'marine', 4: 'merchant', 5: 'scout', 6: 'agent' };

    function careerData(id) { return CAREERS_DATA[id]; }

    // Some careers (Navy, Drifter) have a distinct Service Skills table
    // per assignment; others (Agent) share ONE Service Skills table across
    // all assignments and instead vary by a separate per-assignment
    // Specialist table. Career-level serviceSkills wins if present.
    function serviceSkillsFor(c, a) { return c.serviceSkills || a.serviceSkills; }

    // Same shape, for the rare career where Advanced Education differs by
    // assignment (Psion's Psi-Warrior gets a combat-flavoured table instead
    // of the default Language/Art/Electronics/Medic/Science/Mechanic one).
    function advancedEducationFor(c, a) { return a.advancedEducation || c.advancedEducation; }

    // Union of a military career's Service Skills (career-level if shared,
    // else the union of each assignment's own table), de-duplicated.
    function militaryServiceSkillPool(branch) {
      const c = branch === 'Army' ? CAREERS_DATA.army : branch === 'Marines' ? CAREERS_DATA.marine : CAREERS_DATA.navy;
      if (!c) return [];
      if (c.serviceSkills) return c.serviceSkills;
      const seen = new Map();
      c.assignments.forEach(a => (a.serviceSkills || []).forEach(sk => {
        seen.set(skillKey(sk.name, sk.specialty), sk);
      }));
      return Array.from(seen.values());
    }

    function step5State() {
      return (draft.creation_data && draft.creation_data.step5) || { phase: 'choose', terms: 0, careerHistory: [], draftUsed: false };

    // Merchant Academy (Traveller Companion p.32) grants automatic entry
    // into Merchant or Citizen at rank 1 (rank 2 with honours), but only
    // for the first career taken right after the academy.
    function merchantAcademyAutoEntry() {
      const s4 = step4State();
      if (s4.optionId !== 'merchant' || !s4.gradRoll || !s4.gradRoll.success) return null;
      const s5 = step5State();
      if ((s5.careerHistory || []).length > 0) return null;
      return { honours: !!s4.gradRoll.honours };
    }

    // Military Academy (Core Rulebook p.16-17) grants automatic entry,
    // as an officer at rank 1, into whichever branch was studied — but
    // only for the first career taken right after the academy.
    const MILITARY_ACADEMY_BRANCH_CAREER = { Army: 'army', Marines: 'marine', Navy: 'navy' };
    function militaryAcademyAutoEntry(careerId) {
      const s4 = step4State();
      if (s4.optionId !== 'military' || !s4.gradRoll || !s4.gradRoll.success) return null;
      if (MILITARY_ACADEMY_BRANCH_CAREER[s4.branch] !== careerId) return null;
      const s5 = step5State();
      if ((s5.careerHistory || []).length > 0) return null;
      return { honours: !!s4.gradRoll.honours };
    }

    // ── Pending Modifiers — tracks +/- DMs and flags that an event or
    // benefit grants to a FUTURE roll, so they actually apply when that
    // roll happens instead of just being text. Numeric fields are

    function pendingMods() {
      return (draft.creation_data && draft.creation_data.pendingMods) || {};

      const m = Object.assign({}, pendingMods());
      m[key] = (m[key] || 0) + amount;
      const data = draft.creation_data || {};
      data.pendingMods = m;
      draft.creation_data = data;
      await supabaseClient.from('characters').update({ creation_data: data }).eq('id', draft.id);

      const m = Object.assign({}, pendingMods());
      m[key] = value;
      const data = draft.creation_data || {};
      data.pendingMods = m;
      draft.creation_data = data;
      await supabaseClient.from('characters').update({ creation_data: data }).eq('id', draft.id);
    }

    async function consumePendingMod(key) {
      const m = pendingMods();
      const v = m[key] || 0;
      if (v) {
        const m2 = Object.assign({}, m);
        delete m2[key];
        const data = draft.creation_data || {};
        data.pendingMods = m2;
        draft.creation_data = data;
        await supabaseClient.from('characters').update({ creation_data: data }).eq('id', draft.id);
      }
      return v;
    }

    // Applies any non-choice mustering effect and returns a description of
    // what actually happened, for the on-screen "what was applied" line.
    async function applyMusteringEffect(effect) {
      if (effect.type === 'stat') {
        await applyStatChange(effect.key, effect.amount);
        return `${MUSTERING_STAT_LABELS[effect.key]} ${effect.amount > 0 ? '+' : ''}${effect.amount} (now ${draft[effect.key]})`;
      }
      if (effect.type === 'all') {
        const parts = [];
        for (const item of effect.items) parts.push(await applyMusteringEffect(item));
        return parts.join(', ');
      }
      if (effect.type === 'shipShare') {
        let amount = effect.amount || 0;
        if (effect.dice) { for (let i = 0; i < effect.dice; i++) amount += rollDie(); }
        await applyStatChange('ship_shares', amount);
        return `${amount} Ship Share${amount === 1 ? '' : 's'} (total ${draft.ship_shares || 0})`;
      }
      if (effect.type === 'tas') {
        await supabaseClient.from('characters').update({ tas_member: true }).eq('id', draft.id);
        draft.tas_member = true;
        return 'TAS Membership granted';
      }
      if (effect.type === 'flavor') {
        return effect.label;
      }
      if (effect.type === 'pension') {
        await applyStatChange('pension', effect.amount);
        return `Cr${effect.amount}/year added to pension (now Cr${draft.pension || 0}/year)`;
      }
      if (effect.type === 'item') {
        if (effect.kind === 'weapon') {
          await supabaseClient.from('character_weapons').insert({ character_id: draft.id, name: effect.label, traits: 'Granted as a mustering-out benefit — fill in details in Character Record.' });
        } else if (effect.kind === 'armour') {
          await supabaseClient.from('character_armour').insert({ character_id: draft.id, type: effect.label, options: 'Granted as a mustering-out benefit — fill in details in Character Record.' });
        } else if (effect.kind === 'augment') {
          await supabaseClient.from('character_augments').insert({ character_id: draft.id, type: effect.label, improvement: 'Granted as a mustering-out benefit.' });
        } else {
          await supabaseClient.from('character_equipment').insert({ character_id: draft.id, type: effect.label });
        }
        return `${effect.label} added to your ${effect.kind === 'weapon' ? 'Weapons' : effect.kind === 'armour' ? 'Armour' : effect.kind === 'augment' ? 'Augments' : 'Equipment'} tab — fill in details there`;
      }
      if (effect.type === 'skillAll') {
        const skills = Object.assign({}, draft.skills || {});
        const labels = [];
        for (const name of effect.skills) {
          const specialties = skillSpecialtiesFor(name);
          if (specialties.length) {
            grantSpecialtySkillMin(skills, name, null, effect.level);
            labels.push(`${name} (choose specialty later) ${effect.level}`);
          } else {
            grantSkillMin(skills, name, null, effect.level);
            labels.push(`${name} ${effect.level}`);
          }
        }
        await supabaseClient.from('characters').update({ skills }).eq('id', draft.id);
        draft.skills = skills;
        return labels.join(', ');
      }
      return 'Applied';
    }

        data.pendingMods = m2;
        draft.creation_data = data;
        await supabaseClient.from('characters').update({ creation_data: data }).eq('id', draft.id);
      }
      return v;
    }

    // Unlike pendingMods (one-shot, consumed on first use), these are
    // permanent traits from pre-career education — e.g. University's
    // DM+1 to qualify for certain careers, or Merchant Academy's DM+1 on
    // advancement checks in Merchant/Citizen. They never get consumed;
    // every matching roll just adds them in. `careers` (optional) limits
    // to specific career ids; `firstCareerOnly` limits to the player's
    // first career (no prior careerHistory); `rollTypes` is one or more
    // of 'qualification' | 'advancement' | 'commission'.
    function academyBonuses() {
      return (draft.creation_data && draft.creation_data.academyBonuses) || {};
    }

    async function addAcademyBonus(id, bonus) {
      const data = draft.creation_data || {};
      const b = Object.assign({}, data.academyBonuses);
      b[id] = bonus;
      data.academyBonuses = b;
      draft.creation_data = data;
      await supabaseClient.from('characters').update({ creation_data: data }).eq('id', draft.id);
    }

    function academyBonusDM(rollType, careerId, isFirstCareer) {
      const bonuses = academyBonuses();
      let total = 0;
      const labels = [];
      Object.values(bonuses).forEach(entry => {
        if (!entry.rollTypes.includes(rollType)) return;
        if (entry.careers && !entry.careers.includes(careerId)) return;
        if (entry.firstCareerOnly && !isFirstCareer) return;
        total += entry.amount;
        labels.push(entry.label);
      });
      return { total, labels };
    }

    function gainSkillStep(skills, name, specialty) {
      const key = skillKey(name, specialty);
      const existing = skills[key];
      const newLevel = existing ? Math.min(4, existing.level + 1) : 1;
      skills[key] = { name, specialty: specialty || null, level: newLevel };
    }

    async function applyStatChange(key, amount) {
      const update = {};
      update[key] = (draft[key] || 0) + amount;
      await supabaseClient.from('characters').update(update).eq('id', draft.id);
      Object.assign(draft, update);
    }

    // Starting age is normally 18, but some pre-career options (e.g.
    // Colonial Upbringing) roll a higher starting age — banked as
    // step5State().startingAge once rolled in finishPreEd().
    function ageForTerms(terms) {
      return (step5State().startingAge || 18) + 4 * terms;
    }

    function currentAge() {
      return ageForTerms(step5State().terms);
    }

    function ageingRequirements(sum) {
      if (sum <= -6) return [{ type: 'phys', amount: 2 }, { type: 'phys', amount: 2 }, { type: 'phys', amount: 2 }, { type: 'mental', amount: 1 }];
      if (sum === -5) return [{ type: 'phys', amount: 2 }, { type: 'phys', amount: 2 }, { type: 'phys', amount: 2 }];

    async function goToAgeingOrPhase(resumePhase) {
      const s = step5State();
      const stateUpdate = { phase: resumePhase };
      if (resumePhase === 'mustering') {
        stateUpdate.musteringResolved = [];
        stateUpdate.musteringPending = null;
      }
      if (s.terms >= 4) {
        await saveStep5State({ phase: 'ageing', ageingRoll: null, ageingPicks: {}, ageingResumePhase: resumePhase });
      } else {
        await saveStep5State(stateUpdate);
      }
      renderStep();
    }

    function renderCareerAgeing() {
      const s = step5State();
      const c = careerData(s.careerId);

      if (!s.ageingRoll) {
        return `
          <div class="rule-card wizard-card">
            <div class="wizard-card-title">Ageing — Age ${currentAge()}</div>
            <div class="wizard-card-sub">Roll 2D, DM−${s.terms} (your total terms served). (Core Rulebook p.48)</div>
            <div class="wizard-actions" style="justify-content:flex-start;">
              <button class="btn-outline" onclick="rollAgeing()">Roll Ageing</button>
            </div>
          </div>
        `;
      }

      const reqs = s.ageingReqs || [];
      const picks = s.ageingPicks || {};
      const allPicked = reqs.every((r, i) => picks[i]);

      if (!reqs.length) {
        return `
          <div class="rule-card wizard-card">
            <div class="wizard-card-title">Ageing — No Effect</div>
            <div class="wizard-card-sub">Rolled ${s.ageingRoll.total} (${s.ageingRoll.dice.join(' + ')} − ${s.terms}) — no effect this term.</div>
            <div class="wizard-actions"><button class="btn-outline" onclick="resumeAfterAgeing()">Continue</button></div>
          </div>
        `;
      }

      return `
        <div class="rule-card wizard-card">
          <div class="wizard-card-title">Ageing — Effects</div>
          <div class="wizard-card-sub">Rolled ${s.ageingRoll.total} (${s.ageingRoll.dice.join(' + ')} − ${s.terms}). Choose which characteristics absorb each reduction (your choice, Core p.48).</div>
          ${reqs.map((r, i) => {
            const pool = r.type === 'phys' ? AGEING_PHYS : AGEING_MENTAL;
            const labelMap = { str: 'STR', dex: 'DEX', end_stat: 'END', int_stat: 'INT', edu: 'EDU', soc: 'SOC' };
            return `
              <div class="wizard-field">
                <label>Reduce a ${r.type === 'phys' ? 'physical' : 'mental'} characteristic by ${r.amount}</label>
                <select onchange="pickAgeingTarget(${i}, this.value)">
                  <option value="">— choose —</option>
                  ${pool.map(k => `<option value="${k}" ${picks[i] === k ? 'selected' : ''}>${labelMap[k]} (currently ${draft[k]})</option>`).join('')}
                </select>
              </div>
            `;
          }).join('')}
          <div class="wizard-actions">
            <button class="btn-outline" id="ageing-picks-apply-btn" onclick="applyAgeingPicks()" ${allPicked ? '' : 'disabled'}>Apply</button>
          </div>
        </div>
      `;
    }

    async function rollAgeing() {
      const s = step5State();
      const d1 = rollDie(), d2 = rollDie();
      const total = d1 + d2 - s.terms;
      const reqs = ageingRequirements(total);
      await saveStep5State({ ageingRoll: { dice: [d1, d2], total }, ageingReqs: reqs, ageingPicks: {} });
      await logCreation(`Ageing roll at age ${currentAge()}: ${total} (${d1}+${d2}−${s.terms})${reqs.length ? ' — characteristic reduction required.' : ' — no effect.'}`);
      if (!reqs.length) renderStep();
      else renderStep();
    }

    function pickAgeingTarget(idx, key) {
      const s = step5State();
      const picks = Object.assign({}, s.ageingPicks, { [idx]: key });
      saveStep5State({ ageingPicks: picks }).then(renderStep);
    }

    async function applyAgeingPicks() {
      const btn = document.getElementById('ageing-picks-apply-btn');
      if (btn && btn.disabled) return;
      if (btn) {
        btn.disabled = true;
        btn.style.opacity = '0.5';
        btn.style.cursor = 'not-allowed';
      }
      const s = step5State();
      const reqs = s.ageingReqs || [];
      const picks = s.ageingPicks || {};
      for (let i = 0; i < reqs.length; i++) {
        await applyStatChange(picks[i], -reqs[i].amount);
      }
      const crisisKey = AGEING_PHYS.concat(AGEING_MENTAL).find(k => (draft[k] || 0) <= 0);
      await logCreation(`Ageing applied: ${reqs.map((r, i) => `${picks[i]} −${r.amount}`).join(', ')}.`);
      if (crisisKey) {
        await saveStep5State({ phase: 'ageingCrisis', ageingCrisisKey: crisisKey });
      } else {
        await resumeAfterAgeing();
        return;
      }
      renderStep();
    }

    function renderCareerAgeingCrisis() {
      const s = step5State();
      const labelMap = { str: 'STR', dex: 'DEX', end_stat: 'END', int_stat: 'INT', edu: 'EDU', soc: 'SOC' };
      return `
        <div class="rule-card wizard-card">
          <div class="wizard-card-title">Ageing Crisis — ${labelMap[s.ageingCrisisKey]} Reduced to 0</div>
          <div class="wizard-card-sub">The Traveller dies unless they pay 1D×Cr10000 for medical care, which restores any characteristic at 0 back to 1. Doing so means automatically failing all future qualification rolls.</div>
          <div class="wizard-actions" style="justify-content:flex-start; gap:12px;">
            <button class="btn-outline" onclick="payAgeingCrisis()">Pay for Medical Care</button>
            <button class="btn-outline-danger" onclick="dieFromAgeingCrisis()">Cannot Pay — Character Dies</button>
          </div>
        </div>
      `;
    }

    async function payAgeingCrisis() {
      const cost = rollDie() * 10000;
      await applyStatChange('cash_on_hand', -cost);
      const restores = {};
      AGEING_PHYS.concat(AGEING_MENTAL).forEach(k => { if ((draft[k] || 0) <= 0) restores[k] = 1; });
      await supabaseClient.from('characters').update(restores).eq('id', draft.id);
      Object.assign(draft, restores);
      const data = draft.creation_data || {};
      data.ageingCrisisOccurred = true;
      draft.creation_data = data;
      await supabaseClient.from('characters').update({ creation_data: data }).eq('id', draft.id);
      await logCreation(`Ageing Crisis — paid Cr${cost} for medical care. Will automatically fail all future qualification rolls.`);
      await resumeAfterAgeing();
    }

    async function dieFromAgeingCrisis() {
      await supabaseClient.from('characters').update({ status: 'deceased' }).eq('id', draft.id);
      await logCreation('Ageing Crisis — could not afford medical care. The Traveller has died.');
      document.getElementById('wizard-shell').innerHTML = `
        <div class="rule-card wizard-card">
          <div class="wizard-card-title">The Traveller Has Died</div>
          <div class="wizard-card-sub">This character record has been marked deceased.</div>
          <div class="wizard-actions"><button class="btn-outline" onclick="window.location.href='character-list.html'">Return to Roster</button></div>
        </div>
      `;
    }

    async function resumeAfterAgeing() {
      const s = step5State();
      await saveStep5State({ phase: s.ageingResumePhase || 'survival' });
      renderStep();
    }

    async function initializeStep5FromGraduation() {
      const s4 = step4State();
      const s5 = step5State();
      // Check if graduation benefit 11 forced a military career or drifter
      if (s5.phase === 'choose' && !s5.gradInitialized) {
        const updates = { gradInitialized: true };
        if (s4.preed_event11_draftBranch) {
          updates.forcedMilitaryBranch = s4.preed_event11_draftBranch;
        } else if (s4.preed_event11_fleeing) {
          updates.forcedDrifterNextTerm = true;
        }
        if (Object.keys(updates).length > 1) {
          await saveStep5State(updates);
        }
      }
    }

    function renderStepCareer() {
      const s = step5State();
      switch (s.phase) {
        case 'qualify':         return renderCareerQualify();
        case 'qualifyResult':   return renderCareerQualifyResult();
        case 'draftOrDrifter':  return renderDraftOrDrifter();
        case 'draftResult':     return renderDraftResult();
        case 'assignment':      return renderCareerAssignment();
        case 'startRankGate':   return renderStartRankGate();
        case 'commission':      return renderCareerCommission();
        case 'survival':        return renderCareerSurvival();
        case 'mishap':          return renderCareerMishap();
        case 'events':          return renderCareerEvents();
        case 'advancement':     return renderCareerAdvancement();
        case 'skillTraining':   return renderCareerSkillTraining();
        case 'termEnd':         return renderCareerTermEnd();
        case 'mustering':       return renderCareerMustering();
        case 'musteringDone':   return renderCareerMusteringDone();
        case 'ageing':          return renderCareerAgeing();
        case 'ageingCrisis':    return renderCareerAgeingCrisis();
        default:                return renderCareerChoose();
      }
    }

    function renderCareerChoose() {
      const s = step5State();
      // A forced Draft/Prisoner/Military roll overrides free choice entirely — every
      // other career is locked out (greyed, button disabled) until the
      // forced roll/entry is resolved via its own banner button below.
      const locked = !!(s.forcedDraftNextTerm || s.forcedPrisonerNextTerm || s.forcedMilitaryBranch || s.forcedDrifterNextTerm);
      const psiUntested = draft.psi === null || draft.psi === undefined;
      const rows = CAREER_LIST.map(c => {
        const built = !!CAREERS_DATA[c.id];
        const disabled = locked && !(s.forcedPrisonerNextTerm && c.id === 'prisoner') && !(s.forcedMilitaryBranch && c.id === s.forcedMilitaryBranch) && !(s.forcedDrifterNextTerm && c.id === 'drifter');
        const psiGated = c.id === 'psion' && psiUntested;
        return `
          <div style="display:flex; align-items:center; justify-content:space-between; padding:10px 14px; border:1px solid #0a4a60; border-radius:6px; margin-bottom:8px; ${disabled ? 'opacity:0.4;' : ''}">
            <span style="font-weight:600; ${built && !disabled ? 'color:#00e5ff;' : 'color:#4a9ab8;'}">${c.name}</span>
            ${!built
              ? `<span style="font-size:0.75rem; color:#4a9ab8;">Not yet built</span>`
              : psiGated
                ? `<span style="font-size:0.75rem; color:#4a9ab8;">Requires a tested Psionic Strength (PSI) first — not available this way yet</span>`
                : (disabled
                    ? `<span style="font-size:0.75rem; color:#4a9ab8;">Locked — resolve the forced entry above</span>`
                    : `<button class="btn-outline" onclick="${s.forcedPrisonerNextTerm && c.id === 'prisoner' ? 'confirmForcedPrisoner()' : s.forcedMilitaryBranch && c.id === s.forcedMilitaryBranch ? 'confirmForcedMilitaryBranch()' : s.forcedDrifterNextTerm && c.id === 'drifter' ? 'confirmForcedDrifter()' : `chooseCareer('${c.id}')`}">${c.id === 'prisoner' && s.forcedPrisonerNextTerm ? 'Confirm Forced Entry' : (s.forcedMilitaryBranch && c.id === s.forcedMilitaryBranch) || (s.forcedDrifterNextTerm && c.id === 'drifter') ? 'Confirm Forced Entry' : 'Attempt Qualification'}</button>`)
            }
          </div>
        `;
      }).join('');

      return `
        <div class="rule-card wizard-card" style="max-width:none;">
          <div class="wizard-card-title">Choose a Career</div>
          <div class="wizard-card-sub">
            ${s.terms ? `Age ${currentAge()}, ${s.terms} term${s.terms === 1 ? '' : 's'} served so far.` : 'Pick a career to attempt qualification for.'}
            All 15 careers are built: Navy, Drifter, Agent, Army, Citizen, Entertainer, Marine, Merchant, Noble, Rogue, Scholar, Scout, Prisoner, Believer and Psion. Psion needs a tested Psionic Strength (PSI) first — test it via the Psionic Community pre-career option. Note: Prisoner can't be entered voluntarily per the rules — only attempt qualification here if another career's mishap/event forced you into it. (Core Rulebook pp.17-57, 227-237, Traveller Companion pp.35-39)
          </div>
          ${s.forcedDraftNextTerm ? `
            <div style="border:1px solid #ff5a4a; border-radius:6px; padding:10px 14px; margin-bottom:14px; font-size:0.85rem;">
              A prior event forced a Draft roll this term instead of a free choice. All other careers are locked until this resolves.
              <button class="btn-outline" style="margin-top:8px;" onclick="rollForcedDraft()">Roll the Draft</button>
            </div>
          ` : ''}
          ${s.forcedPrisonerNextTerm ? `
            <div style="border:1px solid #ff5a4a; border-radius:6px; padding:10px 14px; margin-bottom:14px; font-size:0.85rem;">
              A prior event forces the Prisoner career this term instead of a free choice. All other careers are locked until this resolves.
              <button class="btn-outline" style="margin-top:8px;" onclick="confirmForcedPrisoner()">Confirm Forced Entry — Prisoner</button>
            </div>
          ` : ''}
          ${s.forcedMilitaryBranch ? `
            <div style="border:1px solid #ff5a4a; border-radius:6px; padding:10px 14px; margin-bottom:14px; font-size:0.85rem;">
              A prior event forced you to be drafted into the ${(CAREER_LIST.find(c => c.id === s.forcedMilitaryBranch) || {}).name} career this term instead of a free choice. All other careers are locked until this resolves.
              <button class="btn-outline" style="margin-top:8px;" onclick="confirmForcedMilitaryBranch()">Confirm Forced Entry — ${(CAREER_LIST.find(c => c.id === s.forcedMilitaryBranch) || {}).name}</button>
            </div>
          ` : ''}
          ${s.forcedDrifterNextTerm ? `
            <div style="border:1px solid #ff5a4a; border-radius:6px; padding:10px 14px; margin-bottom:14px; font-size:0.85rem;">
              A prior event forced you to join the Drifter career this term instead of a free choice. All other careers are locked until this resolves.
              <button class="btn-outline" style="margin-top:8px;" onclick="confirmForcedDrifter()">Confirm Forced Entry — Drifter</button>
            </div>
          ` : ''}
          ${rows}
          <div class="wizard-actions">
            <button class="btn-outline" onclick="goStep(4)">Back</button>
          </div>
        </div>
      `;
    }

    async function rollForcedDraft() {
      await saveStep5State({ forcedDraftNextTerm: false });
      await rollDraft();
    }

    async function confirmForcedPrisoner() {
      await saveStep5State({ forcedPrisonerNextTerm: false });
      await chooseCareer('prisoner');
    }

    async function confirmForcedMilitaryBranch() {
      const s = step5State();
      const branch = s.forcedMilitaryBranch;
      await saveStep5State({ forcedMilitaryBranch: null });
      await chooseCareer(branch);
    }

    async function confirmForcedDrifter() {
      await saveStep5State({ forcedDrifterNextTerm: false });
      await chooseCareer('drifter');
    }

    async function chooseCareer(id) {
      await saveStep5State({ phase: 'qualify', careerId: id, qualResult: null });
      renderStep();
    }

    function renderCareerQualify() {
      const s = step5State();
      const c = careerData(s.careerId);
      const previousCount = (s.careerHistory || []).length;

      if (c.qualification.special) {
        return `
          <div class="rule-card wizard-card">
            <div class="wizard-card-title">${c.name} — Qualification</div>
            <div class="wizard-card-sub">${c.qualification.specialLabel || 'This career cannot be qualified for normally — entry is forced by another career\'s mishap or event.'} Only confirm entry here if something else sent you here.</div>
            <div class="wizard-actions" style="justify-content:flex-start;">
              <button class="btn-outline" onclick="doCareerQualify(true)">Confirm Forced Entry</button>
            </div>
            <div class="wizard-actions">
              <button class="btn-outline" onclick="saveStep5State({phase:'choose'}).then(renderStep)">Back</button>
            </div>
          </div>
        `;
      }

      const conditionalAuto = c.qualification.autoIf && c.qualification.autoIf(draft);
      if (c.qualification.auto || conditionalAuto) {
        return `
          <div class="rule-card wizard-card">
            <div class="wizard-card-title">${c.name} — Qualification</div>
            <div class="wizard-card-sub">${conditionalAuto ? c.qualification.autoIfLabel || 'Automatic qualification (condition met).' : 'Automatic qualification.'}</div>
            <div class="wizard-actions" style="justify-content:flex-start;">
              <button class="btn-outline" onclick="doCareerQualify(true)">Confirm Entry</button>
            </div>
            <div class="wizard-actions">
              <button class="btn-outline" onclick="saveStep5State({phase:'choose'}).then(renderStep)">Back</button>
            </div>
          </div>
        `;
      }

      const statLabel = c.qualification.statOptions
        ? c.qualification.statOptions.map(k => (CHARS.find(x => x.key === k) || {}).label || k.toUpperCase()).join(' or ')
        : (CHARS.find(x => x.key === c.qualification.stat) || {}).label || c.qualification.stat.toUpperCase();
      const agePenalty = c.qualification.agePenalty && currentAge() >= c.qualification.agePenalty.minAge ? c.qualification.agePenalty.dm : 0;
      return `
        <div class="rule-card wizard-card">
          <div class="wizard-card-title">${c.name} — Qualification</div>
          <div class="wizard-card-sub">
            Roll 2D + ${statLabel} DM${c.qualification.statOptions ? ' (whichever is higher)' : ''} (need ${c.qualification.target}+).
            DM-1 for every previous career (${previousCount} so far${previousCount ? ', DM-' + previousCount : ''}).
            ${agePenalty ? `DM${agePenalty} for being age ${c.qualification.agePenalty.minAge}+.` : ''}
          </div>
          <div class="wizard-actions" style="justify-content:flex-start;">
            <button class="btn-outline" onclick="doCareerQualify(false)">Roll Qualification</button>
          </div>
          <div class="wizard-actions">
            <button class="btn-outline" onclick="saveStep5State({phase:'choose'}).then(renderStep)">Back</button>
          </div>
        </div>
      `;
    }

    async function doCareerQualify(auto) {
      const s = step5State();
      const c = careerData(s.careerId);
      let result;

      if (auto) {
        result = { success: true, auto: true };
      } else if (draft.creation_data && draft.creation_data.ageingCrisisOccurred) {
        result = { success: false, forcedByAgeingCrisis: true, dice: [0, 0], statDM: 0, previousCount: 0, agePenalty: 0, total: 0, target: c.qualification.target };
      } else {
        const d1 = rollDie(), d2 = rollDie();
        const previousCount = (s.careerHistory || []).length;
        const agePenalty = c.qualification.agePenalty && currentAge() >= c.qualification.agePenalty.minAge ? c.qualification.agePenalty.dm : 0;
        const statDM = c.qualification.statOptions
          ? Math.max(...c.qualification.statOptions.map(k => dmNum(draft[k])))
          : dmNum(draft[c.qualification.stat]);
        const bonusDM = await consumePendingMod('qualificationDM');
        const academyDM = academyBonusDM('qualification', c.id, previousCount === 0);
        const total = d1 + d2 + statDM - previousCount + agePenalty + bonusDM + academyDM.total;
        result = { dice: [d1, d2], statDM, previousCount, agePenalty, bonusDM, academyDM: academyDM.total, academyLabels: academyDM.labels, total, target: c.qualification.target, success: total >= c.qualification.target };
      }

      const patch = { phase: 'qualifyResult', qualResult: result };
      if (c.id === 'rogue' && s.meritRogueQualNextTerm) patch.meritRogueQualNextTerm = false;
      await saveStep5State(patch);
      await logCreation(`${c.name} — Qualification ${result.success ? 'succeeded' : 'failed'}${result.total !== undefined ? ` (rolled ${result.total} vs ${result.target}+)` : ' (automatic)'}.`);
      renderStep();
    }

    function renderCareerQualifyResult() {
      const s = step5State();
      const c = careerData(s.careerId);
      const r = s.qualResult;

      if (r.success) {
        return `
          <div class="rule-card wizard-card">
            <div class="wizard-card-title">${c.name} — Qualified!</div>
            <div class="wizard-card-sub">${r.dice ? `Rolled ${r.total} (${r.dice.join(' + ')} + ${r.statDM} stat DM − ${r.previousCount} previous careers${r.agePenalty ? ' + ' + r.agePenalty + ' age' : ''}${r.bonusDM ? ' + ' + r.bonusDM + ' from a prior bonus' : ''}${r.academyDM ? ' + ' + r.academyDM + ' from ' + r.academyLabels.join(', ') : ''}), needed ${r.target}+.` : 'Entry was automatic.'}</div>
            <div class="wizard-actions">
              <button class="btn-outline" onclick="goCareerAssignment()">Continue</button>
            </div>
          </div>
        `;
      }
      return `
        <div class="rule-card wizard-card">
          <div class="wizard-card-title">${c.name} — Qualification Failed</div>
          <div class="wizard-card-sub">${r.forcedByAgeingCrisis ? 'An Ageing Crisis means you automatically fail all qualification rolls from now on.' : `Rolled ${r.total} (${r.dice.join(' + ')} + ${r.statDM} − ${r.previousCount}${r.agePenalty ? ' + ' + r.agePenalty : ''}${r.bonusDM ? ' + ' + r.bonusDM + ' from a prior bonus' : ''}${r.academyDM ? ' + ' + r.academyDM + ' from ' + r.academyLabels.join(', ') : ''}), needed ${r.target}+.`}</div>
          <div class="wizard-card-sub">You must either submit to the Draft (if you haven't already in this lifetime) or spend this term as a Drifter.</div>
          <div class="wizard-actions" style="justify-content:flex-start; gap:12px;">
            <button class="btn-outline" onclick="saveStep5State({phase:'draftOrDrifter'}).then(renderStep)">Continue</button>
          </div>
        </div>
      `;
    }

    function renderDraftOrDrifter() {
      const s = step5State();
      return `
        <div class="rule-card wizard-card">
          <div class="wizard-card-title">Draft or Drifter</div>
          <div class="wizard-card-sub">Core Rulebook p.19. A Traveller may only enter the draft once in their lifetime.</div>
          <div class="wizard-actions" style="justify-content:flex-start; gap:12px;">
            <button class="btn-outline" onclick="rollDraft()" ${s.draftUsed ? 'disabled' : ''}>${s.draftUsed ? 'Draft Already Used' : 'Submit to the Draft'}</button>
            <button class="btn-outline" onclick="chooseCareer('drifter')">Become a Drifter This Term</button>
          </div>
        </div>
      `;
    }

    async function rollDraft() {
      const roll = rollDie();
      const branch = DRAFT_TABLE[roll];
      const built = !!CAREERS_DATA[branch];
      await saveStep5State({ draftUsed: true, phase: 'draftResult', draftRoll: roll, draftBranch: branch, draftBuilt: built });
      await logCreation(`Drafted: rolled ${roll} — ${branch}${built ? '' : ' (not yet built — substituting Drifter for this term)'}.`);
      renderStep();
    }

    function renderDraftResult() {
      const s = step5State();
      const branchName = (CAREER_LIST.find(c => c.id === s.draftBranch) || {}).name || s.draftBranch;

        <div class="rule-card wizard-card">
          <div class="wizard-card-title">Drafted: ${branchName}</div>
          <div class="wizard-card-sub">
            ${s.draftBuilt
              ? `You are automatically enlisted into ${branchName} for this term — no qualification roll needed.`
              : `${branchName} isn't built yet in this app — substituting the Drifter career for this term instead. Note this in your background notes if you'd like to track the real outcome.`}
          </div>
          <div class="wizard-actions">
            <button class="btn-outline" onclick="confirmDraftEntry()">Continue</button>
          </div>
        </div>
      `;
