      const s = step5State();
      const c = careerData(s.careerId);
      const firstTermNoBasic = !s.basicTrainingDone;
      if (c.military && s.rank === 0 && !s.isOfficer) {
        await saveStep5State({ phase: 'commission' });
      } else {
        await saveStep5State({ phase: 'advancement' });
      }
      renderStep();
    }

    function renderCareerCommission() {
      const s = step5State();
      const c = careerData(s.careerId);
      const eligible = s.termInCareer === 0 || draft.soc >= 9;
      if (!eligible) {
        return `
          <div class="rule-card wizard-card">
            <div class="wizard-card-title">${c.name} — Commission</div>
            <div class="wizard-card-sub">You may only attempt a commission in your first term unless SOC is 9+. Not eligible this term.</div>
            <div class="wizard-actions"><button class="btn-outline" onclick="saveStep5State({phase:'advancement'}).then(renderStep)">Continue to Advancement</button></div>
          </div>
        `;
      }
      const r = s.commissionResult;
      const pm = pendingMods();
      if (!r) {
        const dmLate = s.termInCareer > 0 ? -1 * s.termInCareer : 0;
        return `
          <div class="rule-card wizard-card">
            <div class="wizard-card-title">${c.name} — Attempt Commission?</div>
            <div class="wizard-card-sub">Roll 2D + SOC DM (need ${c.commission.target}+)${dmLate ? `, DM${dmLate} for attempting after the first term` : ''}${pm.commissionDM ? `, plus DM${pm.commissionDM > 0 ? '+' : ''}${pm.commissionDM} banked from a prior bonus` : ''}. Optional — you may also just roll Advancement instead.</div>
            <div class="wizard-actions" style="justify-content:flex-start; gap:12px; flex-wrap:wrap;">
              <button class="btn-outline" onclick="rollCommission()">Attempt Commission</button>
              ${pm.autoPromote ? '<button class="btn-outline" onclick="applyAutoPromote()">Apply Automatic Promotion/Commission (banked)</button>' : ''}
              <button class="btn-outline" onclick="saveStep5State({phase:'advancement'}).then(renderStep)">Skip — Roll Advancement</button>
            </div>
          </div>
        `;
      }
      return `
        <div class="rule-card wizard-card">
          <div class="wizard-card-title">${c.name} — Commission ${r.success ? 'Granted' : 'Failed'}</div>
          <div class="wizard-card-sub">Rolled ${r.total} (need ${c.commission.target}+)${r.bonusDM ? `, incl. ${r.bonusDM > 0 ? '+' : ''}${r.bonusDM} banked bonus` : ''}.${r.success ? ' You are now a rank 1 officer.' : ' You may still attempt Advancement this term.'}</div>
          <div class="wizard-actions">
            <button class="btn-outline" onclick="afterCommission()">Continue</button>
          </div>
        </div>
      `;
    }

    async function rollCommission() {
      const s = step5State();
      const c = careerData(s.careerId);
      const d1 = rollDie(), d2 = rollDie();
      const dmLate = s.termInCareer > 0 ? -1 * s.termInCareer : 0;
      const bonusDM = await consumePendingMod('commissionDM');
      const total = d1 + d2 + dmNum(draft.soc) + dmLate + bonusDM;
      const success = total >= c.commission.target;
      await saveStep5State({ commissionResult: { dice: [d1, d2], total, bonusDM, success } });
      await logCreation(`${c.name} — Commission roll: ${total} (need ${c.commission.target}+)${bonusDM ? ` incl. ${bonusDM > 0 ? '+' : ''}${bonusDM} from a prior bonus` : ''} — ${success ? 'granted.' : 'failed.'}`);
      renderStep();
    }

    async function applyAutoPromote() {
      const s = step5State();
      const c = careerData(s.careerId);
      await consumePendingFlag('autoPromote');
      if (s.phase === 'commission') {
        await saveStep5State({ isOfficer: true, rank: 1, phase: 'skillTraining', skillRollsRemaining: 1 });
        await logCreation(`${c.name} — applied an automatic commission from a prior bonus.`);
      } else {
        const newRank = s.rank + 1;
        await saveStep5State({ rank: newRank, advancementResult: { success: true, total: 99, dice: [0, 0], statDM: 0, mustLeave: false, rankBonus: 'automatic' }, skillRollsRemaining: 2 });
        await logCreation(`${c.name} — applied an automatic promotion (to rank ${newRank}) from a prior bonus.`);
      }
      renderStep();
    }

    async function afterCommission() {
      const s = step5State();
      if (s.commissionResult && s.commissionResult.success) {
        await saveStep5State({ isOfficer: true, rank: 1, phase: 'skillTraining', skillRollsRemaining: 1 });
      } else {
        await saveStep5State({ phase: 'advancement' });
      }
      renderStep();
    }

    function renderCareerAdvancement() {
      const s = step5State();
      const c = careerData(s.careerId);
      const a = currentAssignment(s, c);
      const r = s.advancementResult;
      const pm = pendingMods();
      if (!r) {
        const statLabel = (CHARS.find(x => x.key === a.advancement.stat) || {}).label || a.advancement.stat.toUpperCase();
        return `
          <div class="rule-card wizard-card">
            <div class="wizard-card-title">${c.name} — Advancement</div>
            <div class="wizard-card-sub">Roll 2D + ${statLabel} DM (need ${a.advancement.target}+)${pm.advancementDM ? `, plus DM${pm.advancementDM > 0 ? '+' : ''}${pm.advancementDM} banked from a prior bonus` : ''}. You may only attempt this once per term.</div>
            <div class="wizard-actions" style="justify-content:flex-start; gap:12px; flex-wrap:wrap;">
              <button class="btn-outline" onclick="rollAdvancement()">Roll Advancement</button>
              ${pm.autoPromote ? '<button class="btn-outline" onclick="applyAutoPromote()">Apply Automatic Promotion (banked)</button>' : ''}
            </div>
          </div>
        `;
      }
      return `
        <div class="rule-card wizard-card">
          <div class="wizard-card-title">${c.name} — Advancement</div>
          <div class="wizard-card-sub">
            ${r.rankBonus === 'automatic' ? 'Automatic promotion applied.' : `Rolled ${r.total} (${r.dice.join(' + ')} + ${r.statDM}${r.bonusDM ? ' + ' + r.bonusDM + ' banked bonus' : ''}), needed ${a.advancement.target}+.`}
            ${r.success ? `Promoted to rank ${s.rank}${r.rankBonus && r.rankBonus !== 'automatic' ? ' — ' + r.rankBonus : ''}.` : 'No promotion this term.'}
            ${r.mustLeave ? ' This roll was at or below your terms in this career — you must leave after this term (unless overridden by a natural 12).' : ''}
          </div>
          <div class="wizard-actions">
            <button class="btn-outline" onclick="goCareerSkillTraining()">Continue to Skill Training</button>
          </div>
        </div>
      `;
    }

    function rankTableFor(s, c, a) {
      if (s.isOfficer) return c.ranksOfficer || [];
      return c.ranksEnlisted || a.ranks || [];
    }

    async function rollAdvancement() {
      const s = step5State();
      const c = careerData(s.careerId);
      const a = currentAssignment(s, c);
      const d1 = rollDie(), d2 = rollDie();
      const natural = d1 + d2;
      const statDM = dmNum(draft[a.advancement.stat]);
      const bonusDM = await consumePendingMod('advancementDM');
      const total = natural + statDM + bonusDM;
      const success = total >= a.advancement.target;
      const mustLeave = success && total <= s.termInCareer && natural !== 12;

      let newRank = s.rank;
      let rankBonus = '';
      if (success) {
        newRank = s.rank + 1;
        const table = rankTableFor(s, c, a);
        const entry = table.find(x => x.rank === newRank);
        if (entry) {
          const parts = [];
          if (entry.title && entry.title !== '—') parts.push(entry.title);
          if (entry.skill) {
            const skills = Object.assign({}, draft.skills || {});
            grantSkillMin(skills, entry.skill.name, entry.skill.specialty, entry.skill.level);
            await supabaseClient.from('characters').update({ skills }).eq('id', draft.id);
            draft.skills = skills;
            parts.push(`${entry.skill.name}${entry.skill.specialty ? ' (' + entry.skill.specialty + ')' : ''} ${entry.skill.level}`);
          }
          if (entry.stat) {
            if (entry.stat.min !== undefined) {
              if ((draft[entry.stat.key] || 0) < entry.stat.min) await applyStatChange(entry.stat.key, entry.stat.min - (draft[entry.stat.key] || 0));
              else await applyStatChange(entry.stat.key, 1);
            } else {
              await applyStatChange(entry.stat.key, entry.stat.amount);
            }
            parts.push(`${entry.stat.key} adjusted`);
          }
          rankBonus = parts.join(', ');
        }
      }

      await saveStep5State({
        rank: newRank,
        advancementResult: { dice: [d1, d2], statDM, bonusDM, total, success, mustLeave, rankBonus },
        skillRollsRemaining: 1 + (success ? 1 : 0)
      });
      await logCreation(`${c.name} — Advancement: rolled ${total} (need ${a.advancement.target}+) — ${success ? `promoted to rank ${newRank}${rankBonus ? ' (' + rankBonus + ')' : ''}.` : 'no promotion.'}`);
      renderStep();
    }

    async function goCareerSkillTraining() {
      const s = step5State();
      await saveStep5State({ phase: 'skillTraining', skillRollsRemaining: s.skillRollsRemaining || 1, lastSkillResult: null });
      renderStep();
    }

    function renderCareerSkillTraining() {
      const s = step5State();
      const c = careerData(s.careerId);
      const a = currentAssignment(s, c);

      if (!s.basicTrainingDone) {
        return `
          <div class="rule-card wizard-card">
            <div class="wizard-card-title">${c.name} — Basic Training</div>
            <div class="wizard-card-sub">Not your first career — choose one Service Skill table entry to gain at level 0.</div>
            <div class="wizard-actions" style="justify-content:flex-start; gap:10px; flex-wrap:wrap;">
              ${serviceSkillsFor(c, a).map((sk, i) => `<button class="btn-outline" onclick="applyBasicTraining(${i})">${sk.name}${sk.specialty ? ' (' + sk.specialty + ')' : ''}</button>`).join('')}
            </div>
          </div>
        `;
      }

      const lastResult = s.lastSkillResult ? `<div class="wizard-card-sub" style="color:#00ffaa;">Gained: ${s.lastSkillResult}</div>` : '';

      if ((s.skillRollsRemaining || 0) <= 0) {
        return `
          <div class="rule-card wizard-card">
            <div class="wizard-card-title">${c.name} — Skill Training Done</div>
            ${lastResult}
            <div class="wizard-actions"><button class="btn-outline" onclick="goCareerTermEnd()">Continue</button></div>
          </div>
        `;
      }

      const tables = [{ key: 'personal', label: 'Personal Development', list: c.personalDevelopment }];
      tables.push({ key: 'service', label: 'Service Skills', list: serviceSkillsFor(c, a) });
      if (a.specialistSkills) tables.push({ key: 'specialist', label: `Specialist (${a.label})`, list: a.specialistSkills });
      if (c.advancedEducation && draft.edu >= 8) tables.push({ key: 'advEd', label: 'Advanced Education (EDU 8+)', list: c.advancedEducation });
      if (c.officerTable && s.isOfficer) tables.push({ key: 'officer', label: 'Officer (commissioned only)', list: c.officerTable });

      return `
        <div class="rule-card wizard-card">
          <div class="wizard-card-title">${c.name} — Skill Training (${s.skillRollsRemaining} roll${s.skillRollsRemaining > 1 ? 's' : ''} remaining)</div>
          <div class="wizard-card-sub">Choose a table, then roll 1D against it.</div>
          ${lastResult}
          <div class="wizard-actions" style="justify-content:flex-start; gap:12px; flex-wrap:wrap;">
            ${tables.map(t => `<button class="btn-outline" onclick="rollSkillTable('${t.key}')">${t.label}</button>`).join('')}
          </div>
        </div>
      `;
    }

    async function applyBasicTraining(idx) {
      const s = step5State();
      const c = careerData(s.careerId);
      const a = currentAssignment(s, c);
      const sk = serviceSkillsFor(c, a)[idx];
      const skills = Object.assign({}, draft.skills || {});
      grantSkillMin(skills, sk.name, sk.specialty, 0);
      await supabaseClient.from('characters').update({ skills }).eq('id', draft.id);
      draft.skills = skills;
      const desc = `${sk.name}${sk.specialty ? ' (' + sk.specialty + ')' : ''} 0`;
      await saveStep5State({ basicTrainingDone: true, lastSkillResult: desc });
      await logCreation(`${c.name} — Basic Training (subsequent career): gained ${desc}.`);
      renderStep();
    }

    async function rollSkillTable(tableKey) {
      const s = step5State();
      const c = careerData(s.careerId);
      const a = currentAssignment(s, c);
      const tableMap = { personal: c.personalDevelopment, service: serviceSkillsFor(c, a), specialist: a.specialistSkills, advEd: c.advancedEducation, officer: c.officerTable };
      const list = tableMap[tableKey];
      const idx = rollDie() - 1;
      const entry = list[idx];
      const skills = Object.assign({}, draft.skills || {});
      let desc;
      if (entry.stat) {
        await applyStatChange(entry.stat, 1);
        desc = `${entry.stat} +1`;
      } else {
        gainSkillStep(skills, entry.name, entry.specialty);
        await supabaseClient.from('characters').update({ skills }).eq('id', draft.id);
        draft.skills = skills;
        desc = `${entry.name}${entry.specialty ? ' (' + entry.specialty + ')' : ''}`;
      }
      await saveStep5State({ skillRollsRemaining: (s.skillRollsRemaining || 1) - 1, lastSkillResult: desc });
      await logCreation(`${c.name} — Skill Training roll ${idx + 1} on ${tableKey}: ${desc}.`);
      renderStep();
    }

    async function goCareerTermEnd() {
      const s = step5State();
      const c = careerData(s.careerId);
      const extra = await consumePendingMod('extraBenefitRolls');
      const benefitRolls = Math.max(0, (s.benefitRolls || 0) + 1 + extra);
      await saveStep5State({ benefitRolls, phase: 'termEnd' });
      if (extra) await logCreation(`${c.name} — banked Benefit roll count adjusted by ${extra > 0 ? '+' : ''}${extra} from a prior bonus (now ${benefitRolls}).`);
      renderStep();
    }

    function renderCareerTermEnd() {
      const s = step5State();
      const c = careerData(s.careerId);
      const a = currentAssignment(s, c);
      const forcedLeave = s.advancementResult && s.advancementResult.mustLeave;

      return `
        <div class="rule-card wizard-card">
          <div class="wizard-card-title">${c.name} (${a.label}) — Term ${s.termInCareer + 1} Complete</div>
          <div class="wizard-card-sub">Rank ${s.rank}${s.isOfficer ? ' (officer)' : ''}. Benefit rolls banked: ${s.benefitRolls}. You'll be age ${currentAge() + 4} next term.</div>
          ${forcedLeave ? '<p style="color:#ff5a4a; font-size:0.85rem; margin-bottom:10px;">Your services are no longer required — you must leave this career.</p>' : ''}
          <div class="wizard-actions" style="justify-content:flex-start; gap:12px;">
            ${forcedLeave ? '' : '<button class="btn-outline" onclick="continueCareerTerm()">Serve Another Term</button>'}
            <button class="btn-outline" onclick="leaveCareerVoluntary()">Leave Career — Muster Out</button>
          </div>
        </div>
      `;
    }

    async function continueCareerTerm() {
      const s = step5State();
      const newTerms = s.terms + 1;
      await supabaseClient.from('characters').update({ age: 18 + 4 * newTerms }).eq('id', draft.id);
      draft.age = 18 + 4 * newTerms;
      await saveStep5State({
        termInCareer: s.termInCareer + 1, terms: newTerms,
        survivalResult: null, eventRoll: null, eventResolved: false,
        commissionResult: null, advancementResult: null, skillRollsRemaining: 0
      });
      await goToAgeingOrPhase('survival');
    }

    async function leaveCareerVoluntary() {
      await recordCareerHistory(true);
      const s = step5State();
      const newTerms = s.terms + 1;
      await supabaseClient.from('characters').update({ age: 18 + 4 * newTerms }).eq('id', draft.id);
      draft.age = 18 + 4 * newTerms;
      await saveStep5State({ terms: newTerms });
      await goToAgeingOrPhase('mustering');
    }

    // ── Pension (Core p.48) — leaving a career (other than Scout, Rogue,
    // Prisoner, or Drifter) after at least 5 terms in that career grants
    // a yearly pension. Pay scales with terms served in THAT career.
    const PENSION_EXCLUDED = ['scout', 'rogue', 'prisoner', 'drifter'];

    function pensionAmount(terms) {
      if (terms < 5) return 0;
      if (terms === 5) return 10000;
      if (terms === 6) return 12000;
      if (terms === 7) return 14000;
      if (terms === 8) return 16000;
      return 16000 + 2000 * (terms - 8);
    }

    async function recordCareerHistory(servedFullTerm) {
      const s = step5State();
      const c = careerData(s.careerId);
      const a = currentAssignment(s, c);
      const table = rankTableFor(s, c, a);
      const rankEntry = table.find(x => x.rank === s.rank);
      const rankTitle = (rankEntry && rankEntry.title && rankEntry.title !== '—') ? rankEntry.title : (s.isOfficer ? 'Officer' : '');
      const termsServed = s.termInCareer + 1;

      await supabaseClient.from('character_careers').insert({
        character_id: draft.id, term_order: (s.careerHistory || []).length + 1,
        career: c.name, assignment: a.label, rank: s.rank, rank_title: rankTitle,
        terms_served: termsServed
      });

      const history = (s.careerHistory || []).concat([{ careerId: s.careerId, assignment: a.label, rank: s.rank, termInCareer: s.termInCareer }]);
      await saveStep5State({ careerHistory: history });

      let pensionNote = '';
      if (!PENSION_EXCLUDED.includes(s.careerId) && termsServed >= 5) {
        const amount = pensionAmount(termsServed);
        await applyStatChange('pension', amount);
        pensionNote = ` Qualified for a pension of Cr${amount}/year (total pension now Cr${draft.pension || 0}/year).`;
      }

      await logCreation(`Left ${c.name} (${a.label}) at rank ${s.rank} after ${termsServed} term(s) in this career.${servedFullTerm ? '' : ' (mishap-forced departure)'}${pensionNote}`);
    }

    function renderCareerMustering() {
      const s = step5State();
      const c = careerData(s.careerId);
      const done = s.musteringResolved || [];
      const remaining = (s.benefitRolls || 0) - done.length;

      if (remaining <= 0) {
        return `
          <div class="rule-card wizard-card">
            <div class="wizard-card-title">${c.name} — Mustering Out Complete</div>
            <div class="wizard-card-sub">All Benefit rolls from this career have been applied.</div>
            <div class="wizard-actions" style="justify-content:flex-start; gap:12px;">
              <button class="btn-outline" onclick="saveStep5State({phase:'choose'}).then(renderStep)">Attempt Another Career</button>
              <button class="btn-outline" onclick="finishCareerStep()">Finish Career Step</button>
            </div>
          </div>
        `;
      }

      return `
        <div class="rule-card wizard-card">
          <div class="wizard-card-title">${c.name} — Mustering Out (${remaining} Benefit roll${remaining > 1 ? 's' : ''} remaining)</div>
          <div class="wizard-card-sub">For each roll, choose the Cash table or the Benefits table, then roll 1D (capped at 7).</div>
          <div class="wizard-actions" style="justify-content:flex-start; gap:12px;">
            <button class="btn-outline" onclick="rollMustering('cash')">Roll Cash</button>
            <button class="btn-outline" onclick="rollMustering('benefits')">Roll Benefits</button>
          </div>
          ${done.length ? `<div style="margin-top:14px; font-size:0.85rem; color:#4a9ab8;">${done.map(d => `<div>${d}</div>`).join('')}</div>` : ''}
        </div>
      `;
    }

    async function rollMustering(table) {
      const s = step5State();
      const c = careerData(s.careerId);
      const bonusDM = await consumePendingMod('benefitRollDM');
      const idx = Math.max(0, Math.min(6, rollDie() - 1 + bonusDM));
      let line;
      if (table === 'cash') {
        const amount = c.musteringCash[idx];
        await applyStatChange('cash_on_hand', amount);
        line = `Cash roll ${idx + 1}: Cr${amount}${bonusDM ? ` (incl. ${bonusDM > 0 ? '+' : ''}${bonusDM} banked bonus)` : ''}`;
      } else {
        const text = c.musteringBenefits[idx];
        line = `Benefit roll ${idx + 1}: ${text}${bonusDM ? ` (incl. ${bonusDM > 0 ? '+' : ''}${bonusDM} banked bonus)` : ''}`;
      }
      const done = (s.musteringResolved || []).concat([line]);
      await saveStep5State({ musteringResolved: done });
      await logCreation(`Mustering Out — ${line}.`);
      renderStep();
    }

    function renderCareerMusteringDone() {
      return renderCareerChoose();
    }

    async function finishCareerStep() {
      await supabaseClient.from('characters').update({ creation_step: 8 }).eq('id', draft.id);
      draft.creation_step = 8;
      await logCreation('Finished the Career step — moving to Finalize.');
      renderStep();
    }

    // ── Step 8: Finalize ──────────────────────────────────────
    // Review screen — no further spending here. Cash sits in
    // cash_on_hand for the Character Record's Finance tab to handle.
    function musteringLogLines() {
      const log = draft.creation_log || '';
      return log.split('\n').filter(line => line.includes('Mustering Out —'));
    }

    let finalizeCareerHistory = null;

    async function loadFinalizeCareerHistory() {
      const { data } = await supabaseClient.from('character_careers')
        .select('*').eq('character_id', draft.id).order('term_order');
      finalizeCareerHistory = data || [];
      renderStep();
    }

    function renderStepFinalize() {
      if (finalizeCareerHistory === null) {
        loadFinalizeCareerHistory();
        return `<div class="rule-card wizard-card"><p class="placeholder-msg">Loading summary…</p></div>`;
      }

      const skills = Object.values(draft.skills || {}).sort((a, b) => a.name.localeCompare(b.name));
      const skillsText = skills.length
        ? skills.map(sk => `${sk.name}${sk.specialty ? ' (' + sk.specialty + ')' : ''} ${sk.level}`).join(', ')
        : 'None';

      const careerRows = finalizeCareerHistory.map(c => `
        <div style="display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid #0a4a60;">
          <span>${c.career}${c.assignment ? ' (' + c.assignment + ')' : ''}</span>
          <span style="color:#4a9ab8;">Rank ${c.rank}${c.rank_title ? ' — ' + c.rank_title : ''}, ${c.terms_served} term${c.terms_served === 1 ? '' : 's'}</span>
        </div>
      `).join('') || '<p style="color:#4a9ab8; font-size:0.85rem;">No careers completed.</p>';

      const benefitLines = musteringLogLines();
      const benefitsHtml = benefitLines.length
        ? `<div style="font-size:0.85rem;">${benefitLines.map(l => `<div style="margin-bottom:4px;">${l.replace(/^\[[^\]]*\]\s*/, '')}</div>`).join('')}</div>`
        : '<p style="color:#4a9ab8; font-size:0.85rem;">No mustering-out benefits recorded.</p>';

      return `
        <div class="rule-card wizard-card" style="max-width:none;">
          <div class="wizard-card-title">Finalize</div>
          <div class="wizard-card-sub">Review your Traveller before activating the character. Cash on hand carries straight over to the Character Record's Finance tab — nothing to spend here.</div>

          <div style="margin-bottom:18px;">
            <div style="color:#00e5ff; font-weight:600; margin-bottom:6px;">${draft.name} — ${draft.species}, age ${draft.age || 18}</div>
            <div style="font-size:0.85rem; color:#b0d8e8;">
              ${CHARS.map(c => `${c.label} ${draft[c.key]} (${charDM(draft[c.key])})`).join(' · ')}
            </div>
          </div>

          <div style="margin-bottom:18px;">
            <div style="color:#00e5ff; font-weight:600; margin-bottom:6px;">Career History</div>
            ${careerRows}
          </div>

          <div style="margin-bottom:18px;">
            <div style="color:#00e5ff; font-weight:600; margin-bottom:6px;">Skills</div>
            <div style="font-size:0.85rem;">${skillsText}</div>
          </div>

          <div style="margin-bottom:18px;">
            <div style="color:#00e5ff; font-weight:600; margin-bottom:6px;">Mustering-Out Benefits Gained</div>
            ${benefitsHtml}
          </div>

          <div style="margin-bottom:18px;">
            <div style="color:#00e5ff; font-weight:600; margin-bottom:6px;">Finances</div>
            <div style="font-size:0.85rem;">
              Cash on Hand: Cr${draft.cash_on_hand || 0}<br/>
              ${draft.debt ? `<span style="color:#ff5a4a;">Debt: Cr${draft.debt}</span><br/>` : ''}
              ${draft.pension ? `Pension: Cr${draft.pension}/year<br/>` : ''}
            </div>
          </div>

          <div class="wizard-actions">
            <button class="btn-outline" onclick="goStep(5)">Back</button>
            <button class="btn-outline" onclick="finishFinalize()">Finish & Activate Character</button>
          </div>
        </div>
      `;
    }

    async function finishFinalize() {
      const benefitLines = musteringLogLines().map(l => l.replace(/^\[[^\]]*\]\s*/, ''));
      const summary = benefitLines.length
        ? `=== Mustering-Out Benefits Summary ===\n${benefitLines.map(l => `- ${l}`).join('\n')}`
        : '=== Mustering-Out Benefits Summary ===\nNo benefits gained.';
      await logCreation(summary);
      await supabaseClient.from('characters').update({ status: 'active' }).eq('id', draft.id);
      await logCreation('Character creation complete — activated.');
      window.location.href = 'character-record.html?id=' + draft.id;
    }

    async function init() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) { window.location.href = '../../index.html'; return; }
      currentUser = session.user;
      document.getElementById('sidebar-user').textContent =
        currentUser.user_metadata?.display_name || currentUser.email;

      const params = new URLSearchParams(window.location.search);
      let id = params.get('id');

      if (!id) {
        // Starting fresh — create a draft character and move into the wizard.
        const { data, error } = await supabaseClient.from('characters')
          .insert({
            user_id: currentUser.id,
            name: 'New Traveller',
            species: 'Human',
            status: 'draft',
            creation_step: 1
          })
          .select().single();
        if (error) {
          document.getElementById('wizard-shell').innerHTML =
            `<p class="wizard-error">Could not start creation: ${error.message}</p>`;
          return;
        }
        window.location.href = 'character-creation.html?id=' + data.id;
        return;
      }

      await loadDraft(id);
    }

    async function loadDraft(id) {
      const { data, error } = await supabaseClient
        .from('characters').select('*').eq('id', id).single();
      if (error || !data) {
        document.getElementById('wizard-shell').innerHTML =
          `<p class="wizard-error">Character not found.</p>`;
        return;
      }
      draft = data;
      renderStep();
    }

    function renderSteps() {
      const current = draft.creation_step || 1;
      return `
        <div class="wizard-steps">
          ${STEP_LABELS.map((label, i) => {
            const n = i + 1;
            const cls = n < current ? 'done' : (n === current ? 'active' : '');
            return `<span class="wizard-step-pill ${cls}">${n}. ${label}</span>`;
          }).join('')}
        </div>
      `;
    }

    function renderStep() {
      const shell = document.getElementById('wizard-shell');
      const step = draft.creation_step || 1;
      let body = '';

      if (step === 1) {
        body = renderStepName();
      } else if (step === 2) {
        body = renderStepCharacteristics();
      } else if (step === 3) {
        body = renderStepBackgroundSkills();
      } else if (step === 4) {
        body = renderStepPreEd();
      } else if (step === 5) {
        body = renderStepCareer();
      } else if (step === 8) {
        body = renderStepFinalize();
      } else {
        body = `
          <div class="rule-card wizard-card">
            <div class="wizard-card-title">Step ${step}: ${STEP_LABELS[step - 1]}</div>
            <div class="wizard-card-sub">Not built yet — coming in a future session.</div>
            <div class="wizard-actions">
              <button class="btn-outline" onclick="goStep(${step - 1})">Back</button>
            </div>
          </div>
        `;
      }

      shell.innerHTML = renderSteps() + body;
      if (step === 1) renderSpeciesPreview();
      if (step === 4 && !(draft.creation_data && draft.creation_data.seenConnectionsModal)) {
        showConnectionsModal();
      }
    }

    // ── Connections Rule modal ────────────────────────────────
    async function showConnectionsModal() {
      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.id = 'connections-modal';
      overlay.innerHTML = `
        <div class="modal-box">
          <div class="wizard-card-title">The Connections Rule</div>
          <p style="margin-bottom:10px;">From here on, keep an eye out for <strong>Events</strong> rolled during pre-career education and career terms (not Mishaps). (Core Rulebook p.19)</p>
          <p style="margin-bottom:10px;">If an Event you roll could plausibly involve another player's Traveller, you can both agree to link it — discuss what happened and form shared history.</p>
          <ul style="margin:0 0 14px 18px; padding:0; font-size:0.88rem; color:#b0d8e8;">
            <li>Each connection must be with a <strong>different</strong> Traveller.</li>
            <li>Making a connection grants <strong>both</strong> Travellers one free skill choice.</li>
            <li>You may gain a maximum of <strong>two</strong> free skills this way during creation.</li>
            <li>A skill gained this way can't exceed level 3, and can't be Jack-of-all-Trades.</li>
          </ul>
          <div class="wizard-actions" style="justify-content:flex-end;">
            <button class="btn-outline" onclick="closeConnectionsModal()">Got It</button>
          </div>
        </div>
      `;
      document.body.appendChild(overlay);
    }

    async function closeConnectionsModal() {
      document.getElementById('connections-modal').remove();
      const data = draft.creation_data || {};
      data.seenConnectionsModal = true;
      draft.creation_data = data;
      await supabaseClient.from('characters').update({ creation_data: data }).eq('id', draft.id);
    }

    function renderSpeciesPreview() {
      const species = document.getElementById('f-species').value;
      const sp = SPECIES_DATA[species];
      const el = document.getElementById('species-preview');
      if (!sp.traits.length) { el.innerHTML = ''; return; }
      el.innerHTML = `
        <div class="rule-card" style="margin-bottom:16px;">
          <div style="color:#00e5ff; font-size:0.85rem; font-weight:600; margin-bottom:6px;">
            Characteristics: ${modsLine(sp.mods)}
          </div>
          ${sp.traits.map(t => `<div style="font-size:0.85rem; margin-bottom:4px;">${t}</div>`).join('')}
        </div>
      `;
    }

    function renderStepName() {
      return `
        <div class="rule-card wizard-card">
          <div class="wizard-card-title">Name &amp; Species</div>
          <div class="wizard-card-sub">Name your Traveller before anything else — trust us on this. (Core Rulebook p.13)</div>

          <div class="wizard-field">
            <label for="f-name">Name</label>
            <input id="f-name" type="text" value="${draft.name === 'New Traveller' ? '' : (draft.name || '')}" placeholder="Traveller name" />
          </div>

          <div class="wizard-field">
            <label for="f-species">Species</label>
            <select id="f-species" onchange="renderSpeciesPreview()">
              ${Object.keys(SPECIES_DATA).map(sp =>
                `<option value="${sp}" ${(draft.species || 'Human') === sp ? 'selected' : ''}>${sp}</option>`
              ).join('')}
            </select>
          </div>

          <div id="species-preview"></div>

          <div id="step1-error"></div>

          <div class="wizard-actions">
            <button class="btn-outline-danger" onclick="abandonDraft()">Abandon</button>
            <button class="btn-outline" onclick="submitStepName()">Continue</button>
          </div>
        </div>
      `;
    }

    async function submitStepName() {
      const name = document.getElementById('f-name').value.trim();
      const species = document.getElementById('f-species').value.trim() || 'Human';
      const errEl = document.getElementById('step1-error');

      if (!name) {
        errEl.innerHTML = '<p class="wizard-error">Your Traveller needs a name.</p>';
        return;
      }

      const background_notes = applySpeciesNote(draft.background_notes, species);

      const { error } = await supabaseClient.from('characters')
        .update({ name, species, background_notes, creation_step: 2 })
        .eq('id', draft.id);
      if (error) {
        errEl.innerHTML = `<p class="wizard-error">${error.message}</p>`;
        return;
      }
      draft.name = name;
      draft.species = species;
      draft.background_notes = background_notes;
      draft.creation_step = 2;
      await logCreation(`Named the Traveller "${name}" — species ${species}.`);
      renderStep();
    }

    async function goStep(n) {
      if (n < 1) { window.location.href = 'character-list.html'; return; }
      const { error } = await supabaseClient.from('characters')
        .update({ creation_step: n }).eq('id', draft.id);
      if (error) { alert('Error: ' + error.message); return; }
      draft.creation_step = n;
      renderStep();
    }

    async function abandonDraft() {
      if (!confirm('Discard this Traveller? This cannot be undone.')) return;
      await supabaseClient.from('characters').delete().eq('id', draft.id);
      window.location.href = 'character-list.html';
    }

    async function doSignOut() {
      await supabaseClient.auth.signOut();
      window.location.href = '../../index.html';
    }

    init();
  </script>
</body>
</html>
