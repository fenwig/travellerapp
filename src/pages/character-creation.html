        return resolverHeader('Accepted.') + `<button class="btn-outline" onclick="rollPsionEvent5('${tag}')">Roll PSI 8+</button>`;
      }
      if (m.success && !m.choiceMade) {
        return resolverHeader(m.resultText) + `
          <div class="wizard-actions" style="justify-content:flex-start; gap:10px; margin-top:0;">
            <button class="btn-outline" onclick="choosePsionEvent5Reward('${tag}', 'benefit')">Extra Benefit Roll</button>
            <button class="btn-outline" onclick="choosePsionEvent5Reward('${tag}', 'soc')">+1 SOC</button>
          </div>
        `;
      }
      return resolverHeader(m.resultText);
    }

    async function decidePsionEvent5(tag, accept) {
      if (!accept) {
        await saveMechanic(tag, { decided: true, resolved: true, resultText: 'Declined.' });
        await resolveMechanic(tag);
        await logCreation('Psion Event 5: declined.');
        renderStep();
        return;
      }
      await saveMechanic(tag, { decided: true });
      renderStep();
    }

    async function rollPsionEvent5(tag) {
      const d1 = rollDie(), d2 = rollDie();
      const total = d1 + d2 + dmNum(draft.psi);
      const success = total >= 8;
      let resultText = `Rolled ${total} (${d1}+${d2} + PSI DM ${dmNum(draft.psi)}), needed 8+ — ${success ? 'success!' : 'failed.'}`;
      if (!success) {
        await applyStatChange('soc', -1);
        resultText += ' Lost one SOC.';
        await saveMechanic(tag, { rolled: true, success, resolved: true, resultText });
        await resolveMechanic(tag);
      } else {
        await saveMechanic(tag, { rolled: true, success, resultText });
      }
      await logCreation(`Psion Event 5: ${resultText}`);
      renderStep();
    }

    async function choosePsionEvent5Reward(tag, choice) {
      let resultText = mechanicState(tag).resultText;
      if (choice === 'benefit') {
        await addPendingMod('extraBenefitRolls', 1);
        resultText += ' Gained an extra Benefit roll.';
      } else {
        await applyStatChange('soc', 1);
        resultText += ' Gained +1 SOC.';
      }
      await saveMechanic(tag, { choiceMade: true, resolved: true, resultText });
      await resolveMechanic(tag);
      await logCreation(`Psion Event 5: ${resultText}`);
      renderStep();
    }

    // "Gain SkillA 1 or SkillB 1. You may throw SkillX 8+: success gains an
    // extra Benefit roll, failure loses one." (Navy event 3)
    function renderOptionalSkillRollForBenefit(tag, m, skillChoices, rollSkill, target) {
      if (!m.skillChosen) {
        return resolverHeader('Choose which skill to gain:') + `
          <div class="wizard-actions" style="justify-content:flex-start; gap:10px; margin-top:0;">
            ${skillChoices.map(name => `<button class="btn-outline" onclick="pickOptionalSkill('${tag}','${name}')">${name} 1</button>`).join('')}
          </div>
        `;
      }
      if (!m.rollOffered) {
        return resolverHeader(`Gained ${m.skillChosen} 1. You may throw ${rollSkill} ${target}+ for an extra Benefit roll (lose one if you fail).`) + `
          <div class="wizard-actions" style="justify-content:flex-start; gap:10px; margin-top:0;">
            <button class="btn-outline" onclick="rollOptionalBenefit('${tag}','${rollSkill}',${target})">Throw ${rollSkill} ${target}+</button>
            <button class="btn-outline" onclick="declineOptionalBenefit('${tag}')">Don't Risk It</button>
          </div>
        `;
      }
      return resolverHeader(m.resultText) ;
    }

    async function pickOptionalSkill(tag, name) {
      const skills = Object.assign({}, draft.skills || {});
      grantSkillMin(skills, name, null, 1);
      await supabaseClient.from('characters').update({ skills }).eq('id', draft.id);
      draft.skills = skills;
      await saveMechanic(tag, { skillChosen: name });
      await logCreation(`Gained ${name} 1.`);
      renderStep();
    }

    async function rollOptionalBenefit(tag, rollSkill, target) {
      const key = skillKey(rollSkill, null);
      const level = draft.skills && draft.skills[key] ? draft.skills[key].level : -3;
      const total = roll2d6() + level;
      const success = total >= target;
      await addPendingMod('extraBenefitRolls', success ? 1 : -1);
      await saveMechanic(tag, { rollOffered: true, resultText: `Rolled ${total} (need ${target}+) — ${success ? 'gained an extra Benefit roll.' : 'lost one Benefit roll.'}` });
      await resolveMechanic(tag);
      await logCreation(`Rolled ${total} on ${rollSkill} (need ${target}+) — ${success ? 'extra Benefit roll.' : 'lost a Benefit roll.'}`);
      renderStep();
    }

    async function declineOptionalBenefit(tag) {
      await saveMechanic(tag, { rollOffered: true, resultText: 'Declined the risk — no change to Benefit rolls.' });
      await resolveMechanic(tag);
      renderStep();
    }

    // "Roll STAT 8+ to gain one level in any skill you already have." (Navy event 5)
    function renderRollSkillToGainLevel(tag, m, statKey, target) {
      if (m.specialtyGateFor) return renderSpecialtyGate(tag, m.specialtyGateFor);
      const owned = Object.keys(draft.skills || {}).map(k => draft.skills[k]);
      if (!owned.length) {
        return resolverHeader('You have no skills yet to improve — nothing to roll for.') +
          `<button class="btn-outline" onclick="markMechanicResolved('${tag}')">Continue</button>`;
      }
      if (!m.chosenKey) {
        return resolverHeader('Choose a skill you already have:') + `
          <select id="skillgain-${tag}">
            ${owned.map(o => `<option value="${skillKey(o.name, o.specialty)}">${o.name}${o.specialty ? ' (' + o.specialty + ')' : ''} ${o.level}</option>`).join('')}
          </select>
          <button class="btn-outline" onclick="chooseSkillGainTarget('${tag}')">Choose</button>
        `;
      }
      if (!m.rolled) {
        const statLabel = (CHARS.find(x => x.key === statKey) || {}).label || statKey.toUpperCase();
        return resolverHeader(`Roll 2D + ${statLabel} DM (need ${target}+) to increase ${m.chosenKey}.`) + `
          <button class="btn-outline" onclick="rollSkillGain('${tag}','${statKey}',${target})">Roll</button>
        `;
      }
      return resolverHeader(m.resultText);
    }

    async function chooseSkillGainTarget(tag) {
      const key = document.getElementById('skillgain-' + tag).value;
      await saveMechanic(tag, { chosenKey: key });
      renderStep();
    }

    async function rollSkillGain(tag, statKey, target) {
      const m = mechanicState(tag);
      const total = roll2d6() + dmNum(draft[statKey]);
      const success = total >= target;
      if (success) {
        const skills = Object.assign({}, draft.skills || {});
        const owned = skills[m.chosenKey];
        const newLevel = Math.min(4, (owned ? owned.level : 0) + 1);
        bumpSkill(skills, owned.name, owned.specialty, 1);
        await supabaseClient.from('characters').update({ skills }).eq('id', draft.id);
        draft.skills = skills;
        // If bumping to level 1+ and the skill has specialties, gate the specialty choice
        if (newLevel >= 1 && !owned.specialty && skillSpecialtiesFor(owned.name).length) {
          await saveMechanic(tag, { rolled: true, resultText: `Rolled ${total} (need ${target}+) — gained a level.` });
          await gateSpecialty(tag, owned.name, async (specialty) => {
            const finalSkills = Object.assign({}, draft.skills || {});
            if (!specialty) {
              // Keep generic level 0-1 if no specialty chosen
              finalSkills[skillKey(owned.name, null)] = { name: owned.name, specialty: null, level: newLevel };
            } else {
              // Replace the generic entry with the specialty entry
              delete finalSkills[skillKey(owned.name, null)];
              const existing = finalSkills[skillKey(owned.name, specialty)];
              finalSkills[skillKey(owned.name, specialty)] = { name: owned.name, specialty, level: newLevel };
            }
            await supabaseClient.from('characters').update({ skills: finalSkills }).eq('id', draft.id);
            draft.skills = finalSkills;
            await resolveMechanic(tag);
            await logCreation(`Skill-gain roll: ${total} (need ${target}+) on ${owned.name}${specialty ? ' (' + specialty + ')' : ''} — success.`);
            renderStep();
          });
          return;
        }
      }
      await saveMechanic(tag, { rolled: true, resultText: `Rolled ${total} (need ${target}+) — ${success ? 'gained a level.' : 'no improvement this time.'}` });
      await resolveMechanic(tag);
      await logCreation(`Skill-gain roll: ${total} (need ${target}+) on ${m.chosenKey} — ${success ? 'success.' : 'failed.'}`);
      renderStep();
    }

    function markMechanicResolved(tag) { resolveMechanic(tag).then(renderStep); }

    // Gain an Enemy/Rival automatically, plus an automatic DM to a future roll.
    function renderAutoAssociatePlusDM(tag, m, type, dmKey, amount) {
      if (m.resolved) return resolverHeader(m.resultText);
      return resolverHeader(`Name the ${type === 'enemy' ? 'Enemy' : 'Rival'} you gained:`) + `
        <input id="assoc-${tag}" type="text" placeholder="Name" />
        <button class="btn-outline" onclick="confirmAutoAssociate('${tag}','${type}','${dmKey}',${amount})">Confirm</button>
      `;
    }

    async function confirmAutoAssociate(tag, type, dmKey, amount) {
      const name = document.getElementById('assoc-' + tag).value.trim() || 'Unnamed';
      await addAssociate(type, name, 'Gained during a career term.');
      await addPendingMod(dmKey, amount);
      await saveMechanic(tag, { resolved: true, resultText: `Gained ${name} as a ${type}. Banked DM${amount > 0 ? '+' : ''}${amount} to your next roll.` });
      await resolveMechanic(tag);
      await logCreation(`Gained ${name} as a ${type}; banked DM${amount > 0 ? '+' : ''}${amount} to a future roll.`);
      renderStep();
    }

    // Accept/Refuse style choice with two different consequences.
    function renderAcceptRefuse(tag, m, acceptLabel, refuseLabel, onAccept, onRefuse) {
      if (m.resolved) return resolverHeader(m.resultText);
      window.__acceptRefuse = window.__acceptRefuse || {};
      window.__acceptRefuse[tag] = { onAccept, onRefuse };
      return `
        <div class="wizard-actions" style="justify-content:flex-start; gap:10px; margin-top:0;">
          <button class="btn-outline" onclick="chooseAcceptRefuse('${tag}', true)">${acceptLabel}</button>
          <button class="btn-outline" onclick="chooseAcceptRefuse('${tag}', false)">${refuseLabel}</button>
        </div>
      `;
    }

    async function chooseAcceptRefuse(tag, accepted) {
      const handlers = (window.__acceptRefuse || {})[tag];
      if (handlers) await (accepted ? handlers.onAccept : handlers.onRefuse)();
      await saveMechanic(tag, { resolved: true, resultText: accepted ? 'Accepted.' : 'Declined.' });
      await resolveMechanic(tag);
      await logCreation(accepted ? 'Accepted the opportunity.' : 'Declined the opportunity.');
      renderStep();
    }

    // "Gain SKILL, or DM+N to your next ADVANCEMENT/QUALIFICATION roll." choice.
    function renderChooseSkillOrDM(tag, m, skillGrant, dmKey, amount) {
      if (m.resolved) return resolverHeader(m.resultText);
      const label = `${skillGrant.name}${skillGrant.specialty ? ' (' + skillGrant.specialty + ')' : ''} ${skillGrant.level}`;
      return `
        <div class="wizard-actions" style="justify-content:flex-start; gap:10px; margin-top:0;">
          <button class="btn-outline" onclick="chooseSkillOrDM('${tag}', true, '${skillGrant.name}', '${skillGrant.specialty || ''}', ${skillGrant.level}, '${dmKey}', ${amount})">Gain ${label}</button>
          <button class="btn-outline" onclick="chooseSkillOrDM('${tag}', false, '${skillGrant.name}', '${skillGrant.specialty || ''}', ${skillGrant.level}, '${dmKey}', ${amount})">DM${amount > 0 ? '+' : ''}${amount} to next roll instead</button>
        </div>
      `;
    }

    async function chooseSkillOrDM(tag, takeSkill, name, specialty, level, dmKey, amount) {
      let resultText;
      if (takeSkill) {
        const skills = Object.assign({}, draft.skills || {});
        if (skillSpecialtiesFor(name).length && specialty) bumpSpecialtySkill(skills, name, specialty, level);
        else if (skillSpecialtiesFor(name).length) bumpSkill(skills, name, null, level);
        else bumpSkill(skills, name, null, level);
        await supabaseClient.from('characters').update({ skills }).eq('id', draft.id);
        draft.skills = skills;
        const sk2 = skillKey(name, specialty || null);
        const resultLevel = skills[sk2] ? skills[sk2].level : level;
        resultText = `${name}${specialty ? ' (' + specialty + ')' : ''} increased to ${resultLevel}.`;
      } else {
        await addPendingMod(dmKey, amount);
        resultText = `Banked DM${amount > 0 ? '+' : ''}${amount} to your next roll.`;
      }
      await saveMechanic(tag, { resolved: true, resultText });
      await resolveMechanic(tag);
      await logCreation(resultText);
      renderStep();
    }

    // "Automatically pass your next promotion or commission roll."
    function renderBankAutoPromote(tag, m) {
      if (m.resolved) return resolverHeader(m.resultText);
      return `<button class="btn-outline" onclick="bankAutoPromote('${tag}')">Bank an Automatic Promotion/Commission</button>`;
    }

    async function bankAutoPromote(tag) {
      await setPendingFlag('autoPromote', true);
      await saveMechanic(tag, { resolved: true, resultText: 'Banked — your next promotion or commission roll auto-succeeds.' });
      await resolveMechanic(tag);
      await logCreation('Banked an automatic promotion/commission for a future roll.');
      renderStep();
    }

    // Generic "bank a DM to a future roll" button for events whose grant
    // isn't unconditional enough for autoDM (e.g. needs explaining first).
    function renderBankPendingMod(tag, m, label, key, amount) {
      if (m.resolved) return resolverHeader(m.resultText);
      return `<button class="btn-outline" onclick="bankPendingModMechanic('${tag}','${label}','${key}',${amount})">Bank ${label}</button>`;
    }

    async function bankPendingModMechanic(tag, label, key, amount) {
      await addPendingMod(key, amount);
      await saveMechanic(tag, { resolved: true, resultText: `Banked ${label}.` });
      await resolveMechanic(tag);
      await logCreation(`Banked ${label} for a future roll.`);
      renderStep();
    }

    // "Gain D3/D6 Allies/Contacts" — roll the die, name each one gained.
    const ASSOC_PLURAL = { ally: 'Allies', contact: 'Contacts', rival: 'Rivals', enemy: 'Enemies' };

    function renderGainDiceAssociates(tag, m, type, dieMax) {
      if (!m.count) {
        return `<button class="btn-outline" onclick="rollDiceAssociates('${tag}','${type}',${dieMax})">Roll D${dieMax}</button>`;
      }
      if (!m.resolved) {
        return resolverHeader(`Rolled ${m.count}. Name your new ${ASSOC_PLURAL[type] || 'Associates'}:`) +
          Array.from({ length: m.count }).map((_, i) => `<input id="dice-assoc-${tag}-${i}" type="text" placeholder="Name" style="margin:4px;" />`).join('') +
          `<div><button class="btn-outline" onclick="confirmDiceAssociates('${tag}',${m.count},'${type}')">Confirm</button></div>`;
      }
      return resolverHeader(m.resultText);
    }

    async function rollDiceAssociates(tag, type, dieMax) {
      const count = Math.ceil(rollDie() / (6 / dieMax));
      await saveMechanic(tag, { count });
      renderStep();
    }

    async function confirmDiceAssociates(tag, count, type) {
      const names = [];
      for (let i = 0; i < count; i++) {
        const el = document.getElementById(`dice-assoc-${tag}-${i}`);
        const name = el && el.value.trim();
        if (name) { await addAssociate(type, name, 'Gained during a career term.'); names.push(name); }
      }
      await saveMechanic(tag, { resolved: true, resultText: `Gained ${names.length} ${ASSOC_PLURAL[type] || 'Associates'}: ${names.join(', ') || 'none named'}.` });
      await resolveMechanic(tag);
      await logCreation(`Gained ${names.length} ${type}(s): ${names.join(', ') || 'none named'}.`);
      renderStep();
    }

    // Drifter event 9 — 1D sub-table. Rolling 1-2 ("injured or arrested")
    // presents a real choice: roll on the Injury Table, or take the
    // Prisoner career next term instead (forcedPrisonerNextTerm, same
    // mechanism as Agent Mishap 3's natural-2 case).
    function renderDrifterAdventureRoll(tag, m) {
      if (!m.rolled) {
        return resolverHeader('Accept the risky adventure?') + `
          <div class="wizard-actions" style="justify-content:flex-start; gap:10px; margin-top:0;">
            <button class="btn-outline" onclick="rollDrifterAdventure('${tag}')">Accept and Roll 1D</button>
            <button class="btn-outline" onclick="markMechanicResolved('${tag}')">Decline</button>
          </div>
        `;
      }
      if (m.lowRoll && !m.resolved) {
        return resolverHeader(m.resultText) + `
          <div class="wizard-actions" style="justify-content:flex-start; gap:10px; margin-top:0;">
            <button class="btn-outline" onclick="drifterAdventureTakeInjury('${tag}')">Roll on the Injury Table</button>
            <button class="btn-outline" onclick="drifterAdventureTakePrisoner('${tag}')">Take Prisoner Career Next Term</button>
          </div>
          <div id="resolver-${tag}"></div>
        `;
      }
      return resolverHeader(m.resultText);
    }

    async function rollDrifterAdventure(tag) {
      const roll = rollDie();
      if (roll <= 2) {
        const resultText = `Rolled ${roll} — injured or arrested.`;
        await saveMechanic(tag, { rolled: true, lowRoll: true, resultText });
        await logCreation(`Drifter adventure roll: ${roll} — ${resultText}`);
        renderStep();
        return;
      }
      let resultText;
      if (roll <= 4) {
        resultText = `Rolled ${roll} — you survive, but gain nothing.`;
      } else {
        await addPendingMod('benefitRollDM', 4);
        resultText = `Rolled ${roll} — success! Banked DM+4 to one Benefit roll.`;
      }
      await saveMechanic(tag, { rolled: true, resultText });
      await resolveMechanic(tag);
      await logCreation(`Drifter adventure roll: ${roll} — ${resultText}`);
      renderStep();
    }

    async function drifterAdventureTakeInjury(tag) {
      await logCreation('Drifter Event 9 — chose to roll on the Injury Table.');
      rollInjuryTable(tag);
    }

    async function drifterAdventureTakePrisoner(tag) {
      await saveStep5State({ forcedPrisonerNextTerm: true });
      const resultText = `${mechanicState(tag).resultText} Chose the Prisoner career next term instead of the Injury Table.`;
      await saveMechanic(tag, { resolved: true, resultText });
      await resolveMechanic(tag);
      await logCreation('Drifter Event 9 — chose the Prisoner career next term instead of an injury.');
      renderStep();
    }

    // Drifter event 8 — choose a skill, roll 8+ to avoid the Injury
    // Table; the Enemy is only granted if the player doesn't already
    // have one (per the entry's own text).
    function renderDrifterEvent8(tag, m) {
      if (!m.rolled) {
        return resolverHeader('Choose which skill to roll (need 8+) to avoid a roll on the Injury Table:') + `
          <div class="wizard-actions" style="justify-content:flex-start; gap:10px; margin-top:0;">
            <button class="btn-outline" onclick="rollDrifterEvent8('Melee')">Melee</button>
            <button class="btn-outline" onclick="rollDrifterEvent8('Gun Combat')">Gun Combat</button>
            <button class="btn-outline" onclick="rollDrifterEvent8('Stealth')">Stealth</button>
          </div>
        `;
      }
      if (m.success) return resolverHeader(m.resultText);
      return resolverHeader(m.resultText) + renderGenericResolver('event', ['injury'], true);
    }

    async function rollDrifterEvent8(skillName) {
      const key = skillKey(skillName, null);
      const level = draft.skills && draft.skills[key] ? draft.skills[key].level : -3;
      const total = roll2d6() + level;
      const success = total >= 8;
      const hasEnemy = await hasAssociateOfType('enemy');
      let enemyNote;
      if (!hasEnemy) {
        await addAssociate('enemy', 'Unnamed Attacker', 'Attacked you during a dangerous encounter.');
        enemyNote = 'Gained an Enemy (you had none).';
      } else {
        enemyNote = 'You already have an Enemy — no new one gained.';
      }
      const resultText = `Rolled ${total} on ${skillName} (need 8+) — ${success ? 'avoided injury.' : 'failed — roll on the Injury table.'} ${enemyNote}`;
      await saveMechanic('event', { rolled: true, success, resultText });
      if (success) await resolveMechanic('event');
      await logCreation(`Drifter Event 8: ${resultText}`);
      renderStep();
    }

    // Drifter event 10 — "increase any skill you already have", with no
    // attached roll, so it can't reuse renderRollSkillToGainLevel as-is.
    function renderDrifterEvent10(tag, m) {
      if (m.resolved) return resolverHeader(m.resultText);
      const owned = Object.keys(draft.skills || {}).map(k => draft.skills[k]);
      if (!owned.length) {
        return resolverHeader('You have no skills yet to improve — nothing to choose.') +
          `<button class="btn-outline" onclick="finishDrifterEvent10(null)">Continue</button>`;
      }
      return resolverHeader('Choose a skill you already have to increase by one level:') + `
        <select id="drifter-e10-skill">${owned.map(o => `<option value="${skillKey(o.name, o.specialty)}">${o.name}${o.specialty ? ' (' + o.specialty + ')' : ''} ${o.level}</option>`).join('')}</select>
        <button class="btn-outline" onclick="finishDrifterEvent10(document.getElementById('drifter-e10-skill').value)">Confirm</button>
      `;
    }

    async function finishDrifterEvent10(chosenKey) {
      let resultText;
      if (chosenKey) {
        const skills = Object.assign({}, draft.skills || {});
        const owned = skills[chosenKey];
        bumpSkill(skills, owned.name, owned.specialty, 1);
        await supabaseClient.from('characters').update({ skills }).eq('id', draft.id);
        draft.skills = skills;
        resultText = `Increased ${owned.name}${owned.specialty ? ' (' + owned.specialty + ')' : ''} by one level.`;
      } else {
        resultText = 'No skills to improve.';
      }
      await saveMechanic('event', { resolved: true, resultText });
      await resolveMechanic('event');
      await logCreation(`Drifter Event 10: ${resultText}`);
      renderStep();
    }

    // Drifter mishap 5 — betrayal with 2D roll for Prisoner career forcing
    function renderDrifterMishap5(tag, m) {
      if (m.rolled) {
        const prisonerForced = m.roll === 2;
        const text = `Betrayed by someone. Lost a Contact or Ally, who became a Rival or Enemy. Rolled ${m.roll} — ${prisonerForced ? 'forced into Prisoner career next term.' : 'no forced career.'}`;
        return resolverHeader(text);
      }
      return resolverHeader('A Contact or Ally (or a stranger) betrays you, becoming a Rival or Enemy. Now roll 2D to see if you\'re forced into the Prisoner career next term.') + `
        <button class="btn-outline" onclick="rollDrifterMishap5('${tag}')">Roll 2D</button>
      `;
    }

    async function rollDrifterMishap5(tag) {
      const roll = roll2d6();
      const prisonerForced = roll === 2;
      const m = mechanicState(tag);

      // Save the roll result
      await saveMechanic(tag, { rolled: true, roll });

      // If natural 2, force Prisoner career next term
      if (prisonerForced) {
        const s = step5State();
        await saveStep5State({ forcedPrisonerNextTerm: true });
      }

      await logCreation(`Drifter Mishap 5: Rolled ${roll}${prisonerForced ? ' — forced into Prisoner career next term.' : '.'}`);
      await resolveMechanic(tag);
      renderStep();
    }

    // Navy mishap 3 — branch determines whether the Benefit roll is kept.
    // The 8+ roll only ever uses the 2 skills matching the player's
    // actual assignment, not a free pick across all 6.
    const NAVY_MISHAP3_SKILLS = { line: ['Electronics', 'Gunner'], engineer: ['Mechanic', 'Vacc Suit'], flight: ['Pilot', 'Tactics'] };
    function renderNavyMishap3(tag, m) {
      if (!m.rolled) {
        const s = step5State();
        const options = NAVY_MISHAP3_SKILLS[s.assignmentKey] || ['Electronics', 'Gunner', 'Mechanic', 'Vacc Suit', 'Pilot', 'Tactics'];
        return resolverHeader('Make an 8+ skill roll matching your assignment (Electronics/Gunner if Line, Mechanic/Vacc Suit if Engineer/Gunner, Pilot/Tactics if Flight).') + `
          <select id="navy-m3-skill">
            ${options.map(name => `<option>${name}</option>`).join('')}
          </select>
          <button class="btn-outline" onclick="rollNavyMishap3()">Roll 8+</button>

    async function rollMerchantEvent5(skillName) {
      const m = mechanicState('event');
      const key = skillKey(skillName, null);
      const level = draft.skills && draft.skills[key] ? draft.skills[key].level : -3;
      const total = roll2d6() + level;
      const success = total >= 8;
      const s = step5State();
      let resultText;
      if (success) {
        const kept = Math.ceil(m.risked / 2);
        const newBenefitRolls = (s.benefitRolls || 0) - m.risked + kept;
        await saveStep5State({ benefitRolls: Math.max(0, newBenefitRolls) });
        resultText = `Rolled ${total} on ${skillName} (need 8+) — success! Kept ${kept} of the ${m.risked} risked (now ${Math.max(0, newBenefitRolls)} Benefit roll(s) banked).`;
      } else {
        const newBenefitRolls = (s.benefitRolls || 0) - m.risked;
        await saveStep5State({ benefitRolls: Math.max(0, newBenefitRolls) });
        resultText = `Rolled ${total} on ${skillName} (need 8+) — failed. Lost all ${m.risked} risked (now ${Math.max(0, newBenefitRolls)} Benefit roll(s) banked).`;
      }
      const skills = Object.assign({}, draft.skills || {});
      bumpSkill(skills, skillName, null, 1);
      await supabaseClient.from('characters').update({ skills }).eq('id', draft.id);

    async function rollRogueEvent10() {
      const m = mechanicState('event');
      const key = skillKey('Gambler', null);
      const level = draft.skills && draft.skills[key] ? draft.skills[key].level : -3;

        resultText = `Rolled ${total} on Gambler (need 8+) — failed. Lost all ${m.wagered} wagered (now ${newBenefitRolls} Benefit roll(s) banked).`;

    // Does not apply the rolled mishap's autoSkill/autoDM/autoStat grants —

    function renderNestedMishapRoll(tag, m) {

      const resolvedTextKey = tag === 'mishap' ? 'mishapResolvedText' : 'eventResolvedText';
      if (s[resolvedKey]) return resolverHeader(s[resolvedTextKey] || 'Resolved.');
      const c = careerData(s.careerId);
      const entry = c.mishaps.find(x => x.roll === m.nestedMishapRoll);

    // the dynamic tag (not hardcoded 'mishap') since Scout reaches this

    function renderInjuryGuaranteed2OrLower(tag, m) {

          </div>
        `;
      }
      // Once the nested Injury Table/Medical Care flow finishes, it marks
      // the OUTER mishap/event resolved and writes the final summary
      // (including any Medical Care result) into mishapResolvedText/
      // eventResolvedText — not into m.injuryResultText. Without this
      // check, the next full re-render would fall through to the stale

      const s = step5State();
      const resolvedKey = tag === 'mishap' ? 'mishapResolved' : 'eventResolved';
      const resolvedTextKey = tag === 'mishap' ? 'mishapResolvedText' : 'eventResolvedText';

        return;

      const roll1 = rollDie(), roll2 = rollDie();

      const entry = INJURY_TABLE.find(x => x.roll === chosen);
      const resultText = `Rolled ${roll1} and ${roll2} — kept the lower (riskier) result, ${chosen}.`;
      await saveMechanic(tag, { injuryChoice: choice, injuryResultText: resultText });
      await logCreation(`Mishap 1: ${resultText}`);

    // Prisoner event 7 — Prison Event sub-table (Core p.57), its own 1D table.
    const PRISON_EVENT_TABLE = {
      1: 'Riot. A riot engulfs the prison.',
      2: 'New Contact. You make friends with another inmate.',
      3: 'New Rival. You gain a new Rival among the inmates or guards.',
      4: 'Transferred. You are moved to a different prison — re-roll your Parole Threshold.',
      5: 'Good Behaviour. Reduce your Parole Threshold by 2.',
      6: 'Attacked. You are attacked by another prisoner.'
    };

    function renderPrisonerEvent7(tag, m) {
      if (m.resolved) return resolverHeader(m.resultText);
      if (!m.subRoll) {
        return resolverHeader('Roll 1D on the Prison Event sub-table.') + `<button class="btn-outline" onclick="rollPrisonerEvent7()">Roll 1D</button>`;
      }
      const header = resolverHeader(`Rolled ${m.subRoll} — ${PRISON_EVENT_TABLE[m.subRoll]}`);
      if (m.subRoll === 1) {
        if (!m.riotRolled) return header + `<button class="btn-outline" onclick="rollPrisonerEvent7Riot()">Roll 1D</button>`;
        if (m.riotInjury) return header + resolverHeader(m.resultText) + renderGenericResolver('event', ['injury'], true);
        return header + resolverHeader(m.resultText);
      }
      if (m.subRoll === 2 && !m.contactNamed) {
        return header + `
          <input id="prisoner-e7-name" type="text" placeholder="Contact name" style="margin-bottom:8px;" />
          <button class="btn-outline" onclick="confirmPrisonerEvent7Associate('contact')">Confirm</button>
        `;
      }
      if (m.subRoll === 3 && !m.rivalNamed) {
        return header + `
          <input id="prisoner-e7-name" type="text" placeholder="Rival name" style="margin-bottom:8px;" />
          <button class="btn-outline" onclick="confirmPrisonerEvent7Associate('rival')">Confirm</button>
        `;
      }
      if (m.subRoll === 6) {
        if (!m.rolled) return header + `<button class="btn-outline" onclick="rollPrisonerEvent7Attack()">Roll Melee (Unarmed) 8+</button>`;
        if (!m.success) return header + resolverHeader(m.resultText) + renderGenericResolver('event', ['injury'], true);
        return header + resolverHeader(m.resultText);
      }
      return header + resolverHeader(m.resultText || 'Resolved.');
    }

    async function rollPrisonerEvent7() {
      const roll = rollDie();
      await saveMechanic('event', { subRoll: roll });
      await logCreation(`Prisoner Event 7 — Prison Event: rolled ${roll} — ${PRISON_EVENT_TABLE[roll]}`);
      if (roll === 4) {
        const newThreshold = await rerollParoleThreshold();
        await saveMechanic('event', { resolved: true, resultText: `Transferred — Parole Threshold re-rolled (now ${newThreshold}).` });
        await resolveMechanic('event');
        await logCreation(`Prisoner Event 7: Parole Threshold re-rolled to ${newThreshold}.`);
      } else if (roll === 5) {
        const newThreshold = await adjustParoleThreshold(-2);
        await saveMechanic('event', { resolved: true, resultText: `Good Behaviour — Parole Threshold reduced by 2 (now ${newThreshold}).` });
        await resolveMechanic('event');
        await logCreation(`Prisoner Event 7: Parole Threshold reduced to ${newThreshold}.`);
      }
      renderStep();
    }

        const s = step5State();
        await saveStep5State({ benefitRolls: (s.benefitRolls || 0) + 1 });
        resultText = `Rolled ${roll} — looted something useful, gained an extra Benefit roll.`;
      } else {
        resultText = `Rolled ${roll} — you keep your head down. Nothing else happens.`;

      await saveMechanic('event', { riotRolled: true, riotInjury, resultText, resolved: !riotInjury });

    async function finishTrutherEvent5(skillName, specialty) {
      const key = skillKey(skillName, specialty);
      const alreadyOwned = !!(draft.skills || {})[key];
