<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Character Creation — Traveller</title>
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/reference.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .wizard-shell { max-width: 1100px; margin: 0; }
    .wizard-steps {
      display: flex; gap: 6px; margin-bottom: 28px; flex-wrap: nowrap;
    }
    .wizard-step-pill {
      padding: 5px 10px; border-radius: 999px; font-size: 0.7rem;
      letter-spacing: 0.03em; border: 1px solid #0a4a60; color: #4a9ab8;
      white-space: nowrap; flex-shrink: 0;
    }
    .wizard-step-pill.done   { border-color: #00ffaa; color: #00ffaa; }
    .wizard-step-pill.active { border-color: #00e5ff; color: #00e5ff; background: rgba(0,229,255,0.08); }
    .wizard-card { max-width: 720px; }
    .wizard-card-title { font-size: 1.1rem; color: #00e5ff; font-weight: 600; margin-bottom: 4px; }
    .wizard-card-sub { color: #4a9ab8; font-size: 0.85rem; margin-bottom: 18px; }
    .wizard-field { margin-bottom: 16px; }
    .wizard-field label { display: block; font-size: 0.8rem; color: #4a9ab8; margin-bottom: 6px; letter-spacing: 0.04em; text-transform: uppercase; }
    .wizard-field input, .wizard-field select {
      width: 100%; padding: 10px 12px; font-size: 1rem;
    }
    .wizard-actions { display: flex; justify-content: space-between; margin-top: 24px; }
    .wizard-error { color: #ff5a4a; font-size: 0.85rem; margin-top: 10px; }
    .status-draft { background: rgba(0,229,255,0.10); color: #00e5ff; border: 1px solid #00e5ff44; }
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.6);
      display: flex; align-items: center; justify-content: center; z-index: 1000;
    }
    .modal-box {
      background: rgba(13,21,32,0.97); border: 1px solid #0a4a60; border-radius: 8px;
      padding: 24px; max-width: 480px; box-shadow: 0 0 30px rgba(0,229,255,0.15);
    }
    .preed-option { margin-bottom: 10px; }
    .preed-option-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px; border: 1px solid #0a4a60; border-radius: 6px; cursor: pointer;
    }
    .preed-option-head:hover { border-color: #00e5ff; }
    .preed-option-head.unavailable { opacity: 0.5; cursor: default; }
    .preed-option-body { padding: 10px 14px; font-size: 0.85rem; color: #b0d8e8; }
  </style>
</head>
<body>

  <div class="app-shell">
    <nav class="sidebar">
      <div class="sidebar-logo">
        <div class="sidebar-logo-text">TRAVELLER</div>
        <div class="sidebar-user" id="sidebar-user"></div>
      </div>
      <div class="sidebar-group-label">Character Resources</div>
      <a href="character-record.html" class="sidebar-nav-item">Character Record</a>
      <a href="spacecraft-record.html" class="sidebar-nav-item">Spacecraft Record</a>
      <a href="character-list.html" class="sidebar-nav-item">Roster</a>
      <a href="character-creation.html" class="sidebar-nav-item active">Character Creation</a>
      <div class="sidebar-group-label">Reference</div>
      <a href="general-rules.html" class="sidebar-nav-item">General Rules</a>
      <a href="combat.html" class="sidebar-nav-item">Combat</a>
      <a href="vehicles.html" class="sidebar-nav-item">Vehicles</a>
      <a href="spacecraft-operations.html" class="sidebar-nav-item">Spacecraft Operations</a>
      <a href="spacecraft-combat.html" class="sidebar-nav-item">Spacecraft Combat</a>
      <a href="equipment.html" class="sidebar-nav-item">Equipment</a>
      <a href="weapons-armor.html" class="sidebar-nav-item">Weapons &amp; Armor</a>
      <a href="trade.html" class="sidebar-nav-item">Trade</a>
      <div class="sidebar-signout">
        <button onclick="doSignOut()">Sign Out</button>
      </div>
    </nav>

    <main class="page-main">
      <h1 class="page-title">CHARACTER CREATION</h1>

      <div class="wizard-shell" id="wizard-shell">
        <p class="placeholder-msg">Loading…</p>
      </div>
    </main>
  </div>

  <script src="../js/supabase-config.js"></script>
  <script src="../js/sidebar.js"></script>
  <script src="../js/skills-data.js"></script>
  <script>
    let currentUser = null;
    let draft = null;

    // Step registry — each step builds further on the Traveller 2022 core
    // rulebook creation flowchart (pp.8-15). Steps beyond STEP_COUNT are
    // not built yet.
    const STEP_COUNT = 8;
    const STEP_LABELS = [
      'Name & Species', 'Characteristics', 'Background Skills', 'Pre-Career Education',
      'Career', 'Terms', 'Mustering Out', 'Finalize'
    ];

    // Species characteristic modifiers + traits — Core Rulebook pp.53-54.
    // mods are applied to rolled characteristics in Step 2 (Characteristics).
    const SPECIES_DATA = {
      Human: { mods: {}, traits: [] },
      Aslan: {
        mods: { str: 2, dex: -2 },
        traits: [
          'Dewclaw: vicious close combat weapon, uses Melee (natural) skill, 1D+2 damage.',
          'Heightened Senses: DM+1 to Recon and Survival checks.'
        ]
      },
      Vargr: {
        mods: { str: -1, dex: 1, end_stat: -1 },
        traits: [
          'Bite: close combat weapon, uses Melee (natural) skill, 1D+1 damage.',
          'Heightened Senses: DM+1 to Recon and Survival checks; DM-1 to sight-based checks in dark conditions.'
        ]
      }
    };

    const SPECIES_NOTE_START = '[SPECIES TRAITS]';
    const SPECIES_NOTE_END = '[/SPECIES TRAITS]';

    function modsLine(mods) {
      const labels = { str: 'STR', dex: 'DEX', end_stat: 'END', int_stat: 'INT', edu: 'EDU', soc: 'SOC' };
      const parts = Object.keys(mods).map(k => `${labels[k]}${mods[k] > 0 ? '+' : ''}${mods[k]}`);
      return parts.length ? parts.join(', ') : 'None';
    }

    function buildSpeciesNote(species) {
      const sp = SPECIES_DATA[species] || SPECIES_DATA.Human;
      if (species === 'Human' || !sp.traits.length) return '';
      return `${SPECIES_NOTE_START}\n${species} — Characteristics: ${modsLine(sp.mods)}.\n` +
        sp.traits.map(t => `- ${t}`).join('\n') + `\n${SPECIES_NOTE_END}`;
    }

    // Replaces any existing species-traits block in notes, preserving the rest.
    function applySpeciesNote(existingNotes, species) {
      const notes = existingNotes || '';
      const startIdx = notes.indexOf(SPECIES_NOTE_START);
      const endIdx = notes.indexOf(SPECIES_NOTE_END);
      let rest = notes;
      if (startIdx !== -1 && endIdx !== -1) {
        rest = (notes.slice(0, startIdx) + notes.slice(endIdx + SPECIES_NOTE_END.length)).trim();
      }
      const block = buildSpeciesNote(species);
      if (!block) return rest;
      return rest ? `${block}\n\n${rest}` : block;
    }

    // ── Step 2: Characteristics ───────────────────────────────
    const CHARS = [
      { key: 'str',      label: 'STR' },
      { key: 'dex',      label: 'DEX' },
      { key: 'end_stat', label: 'END' },
      { key: 'int_stat', label: 'INT' },
      { key: 'edu',      label: 'EDU' },
      { key: 'soc',      label: 'SOC' }
    ];

    function charDM(v) {
      if (v <= 0)   return '−3';
      if (v <= 2)   return '−2';
      if (v <= 5)   return '−1';
      if (v <= 8)   return '+0';
      if (v <= 11)  return '+1';
      if (v <= 14)  return '+2';
      return '+3';
    }

    function rollDie() { return 1 + Math.floor(Math.random() * 6); }
    function roll2d6() { return rollDie() + rollDie(); }

    function step2State() {
      return (draft.creation_data && draft.creation_data.step2) || {};
    }

    async function saveStep2State(patch) {
      const data = draft.creation_data || {};
      data.step2 = Object.assign({}, step2State(), patch);
      draft.creation_data = data;
      await supabaseClient.from('characters').update({ creation_data: data }).eq('id', draft.id);
    }

    function renderStepCharacteristics() {
      const s = step2State();

      if (!s.method) {
        return `
          <div class="rule-card wizard-card">
            <div class="wizard-card-title">Characteristics</div>
            <div class="wizard-card-sub">Roll 2D for each of STR / DEX / END / INT / EDU / SOC, then assign the six results as you wish. (Core Rulebook p.9)</div>
            <div class="wizard-actions" style="justify-content:flex-start; gap:12px;">
              <button class="btn-outline" onclick="chooseStep2Method('auto')">Auto Roll for Me</button>
              <button class="btn-outline" onclick="chooseStep2Method('manual')">I'll Roll My Own Dice</button>
            </div>
            <div class="wizard-actions">
              <button class="btn-outline" onclick="goStep(1)">Back</button>
            </div>
          </div>
        `;
      }

      if (!s.values) {
        return s.method === 'auto' ? renderAutoRollPrompt() : renderManualEntry();
      }

      return renderAssignment();
    }

    function renderAutoRollPrompt() {
      return `
        <div class="rule-card wizard-card">
          <div class="wizard-card-title">Auto Roll</div>
          <div class="wizard-card-sub">Each roll simulates 2D6 — two separate 1-6 dice added together, not a flat 2-12 random number.</div>
          <div class="wizard-actions" style="justify-content:flex-start; gap:12px;">
            <button class="btn-outline" onclick="doAutoRoll()">Roll 2D × 6</button>
          </div>
          <div class="wizard-actions">
            <button class="btn-outline" onclick="changeStep2Method()">Back</button>
          </div>
        </div>
      `;
    }

    async function doAutoRoll() {
      const values = [];
      for (let i = 0; i < 6; i++) values.push(roll2d6());
      await saveStep2State({ values, assignment: {} });
      await logCreation(`Auto-rolled characteristics: ${values.join(', ')}.`);
      renderStep();
    }

    function renderManualEntry() {
      return `
        <div class="rule-card wizard-card">
          <div class="wizard-card-title">Enter Your Rolls</div>
          <div class="wizard-card-sub">Roll 2D6 six times yourself, then enter each total below (2-12).</div>
          <div style="display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:6px;">
            ${[0,1,2,3,4,5].map(i => `
              <div class="wizard-field" style="margin-bottom:0;">
                <label for="roll-${i}">Roll ${i + 1}</label>
                <input id="roll-${i}" type="number" min="2" max="12" step="1" />
              </div>
            `).join('')}
          </div>
          <div id="step2-error"></div>
          <div class="wizard-actions" style="justify-content:flex-start; gap:12px;">
            <button class="btn-outline" onclick="submitManualRolls()">Save Rolls</button>
          </div>
          <div class="wizard-actions">
            <button class="btn-outline" onclick="changeStep2Method()">Back</button>
          </div>
        </div>
      `;
    }

    async function submitManualRolls() {
      const values = [];
      for (let i = 0; i < 6; i++) {
        const v = parseInt(document.getElementById('roll-' + i).value, 10);
        if (isNaN(v) || v < 2 || v > 12) {
          document.getElementById('step2-error').innerHTML =
            '<p class="wizard-error">Enter all six rolls as whole numbers from 2 to 12.</p>';
          return;
        }
        values.push(v);
      }
      await saveStep2State({ values, assignment: {} });
      await logCreation(`Entered own characteristic rolls: ${values.join(', ')}.`);
      renderStep();
    }

    async function changeStep2Method() {
      await saveStep2State({ method: null, values: null, assignment: {} });
      renderStep();
    }

    async function chooseStep2Method(method) {
      await saveStep2State({ method });
      renderStep();
    }

    function speciesMod(key) {
      const sp = SPECIES_DATA[draft.species] || SPECIES_DATA.Human;
      return sp.mods[key] || 0;
    }

    function renderAssignment() {
      const s = step2State();
      const values = s.values;
      const assignment = s.assignment || {};
      const usedIdx = new Set(Object.values(assignment));

      const rows = CHARS.map(c => {
        const assignedIdx = assignment[c.key];
        const mod = speciesMod(c.key);
        const effective = assignedIdx !== undefined ? values[assignedIdx] + mod : null;
        return `
          <div style="display:grid; grid-template-columns: 70px 1fr 90px 60px; align-items:center; gap:10px; margin-bottom:10px;">
            <div style="color:#00e5ff; font-weight:600;">${c.label}</div>
            <select onchange="assignRoll('${c.key}', this.value)">
              <option value="">— choose a roll —</option>
              ${values.map((v, i) => `
                <option value="${i}" ${assignedIdx === i ? 'selected' : ''} ${usedIdx.has(i) && assignedIdx !== i ? 'disabled' : ''}>
                  Roll ${i + 1}: ${v}${mod ? ` (${mod > 0 ? '+' : ''}${mod} species = ${v + mod})` : ''}
                </option>
              `).join('')}
            </select>
            <div style="color:#4a9ab8; font-size:0.85rem;">${effective !== null ? 'Score ' + effective : '—'}</div>
            <div style="color:#00ffaa; font-size:0.85rem;">${effective !== null ? charDM(effective) : ''}</div>
          </div>
        `;
      }).join('');

      const allAssigned = CHARS.every(c => assignment[c.key] !== undefined);

      return `
        <div class="rule-card wizard-card">
          <div class="wizard-card-title">Assign Your Rolls</div>
          <div class="wizard-card-sub">Rolled: ${values.join(', ')}${draft.species !== 'Human' ? ` — species modifiers for ${draft.species} are applied automatically.` : ''}</div>
          ${rows}
          <div id="step2-error"></div>
          <div class="wizard-actions">
            <button class="btn-outline-danger" onclick="changeStep2Method()">Start Over</button>
            <div style="display:flex; gap:12px;">
              <button class="btn-outline" onclick="randomAssign()">Random Assign</button>
              <button class="btn-outline" onclick="clearAssignments()" ${Object.keys(assignment).length ? '' : 'disabled'}>Clear All Assignments</button>
              <button class="btn-outline" onclick="submitStepCharacteristics()" ${allAssigned ? '' : 'disabled'}>Continue</button>
            </div>
          </div>
        </div>
      `;
    }

    async function randomAssign() {
      const s = step2State();
      const idxs = s.values.map((_, i) => i);
      for (let i = idxs.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [idxs[i], idxs[j]] = [idxs[j], idxs[i]];
      }
      const assignment = {};
      CHARS.forEach((c, i) => { assignment[c.key] = idxs[i]; });
      await saveStep2State({ assignment });
      await logCreation('Randomly assigned characteristic rolls.');
      renderStep();
    }

    async function clearAssignments() {
      await saveStep2State({ assignment: {} });
      renderStep();
    }

    async function assignRoll(key, idxStr) {
      const s = step2State();
      const assignment = Object.assign({}, s.assignment);
      if (idxStr === '') {
        delete assignment[key];
      } else {
        assignment[key] = parseInt(idxStr, 10);
      }
      await saveStep2State({ assignment });
      renderStep();
    }

    async function submitStepCharacteristics() {
      const s = step2State();
      const values = s.values;
      const assignment = s.assignment || {};
      const errEl = document.getElementById('step2-error');

      if (!CHARS.every(c => assignment[c.key] !== undefined)) {
        errEl.innerHTML = '<p class="wizard-error">Assign all six rolls before continuing.</p>';
        return;
      }

      const update = { creation_step: 3 };
      CHARS.forEach(c => {
        update[c.key] = values[assignment[c.key]] + speciesMod(c.key);
      });

      const { error } = await supabaseClient.from('characters').update(update).eq('id', draft.id);
      if (error) {
        errEl.innerHTML = `<p class="wizard-error">${error.message}</p>`;
        return;
      }
      Object.assign(draft, update);
      draft.creation_step = 3;
      await logCreation(`Assigned characteristics — ${CHARS.map(c => `${c.label} ${update[c.key]} (${charDM(update[c.key])})`).join(', ')}.`);
      renderStep();
    }

    // ── Step 3: Background Skills ─────────────────────────────
    // Core Rulebook p.9 — gain (EDU DM + 3) background skills at level 0.
    const BACKGROUND_SKILLS = [
      { name: 'Admin' },
      { name: 'Animals', specialties: ['Handling', 'Training', 'Veterinary'] },
      { name: 'Art', specialties: ['Holography', 'Instrument', 'Performer', 'Sculpt', 'Write'] },
      { name: 'Athletics' },
      { name: 'Carouse' },
      { name: 'Drive', specialties: ['Hovercraft', 'Mole', 'Track', 'Walker', 'Wheel'] },
      { name: 'Electronics', specialties: ['Comms', 'Computers', 'Remote Ops', 'Sensors'] },
      { name: 'Flyer', specialties: ['Airship', 'Grav', 'Ornithopter', 'Rotor', 'Wing'] },
      { name: 'Language', specialties: ['Galanglic', 'Gvegh', 'Oynprith', 'Trokh', 'Vilani', 'Zdetl'] },
      { name: 'Mechanic' },
      { name: 'Medic' },
      { name: 'Profession', specialties: ['Belter', 'Biologicals', 'Civil Engineering', 'Construction', 'Hydroponics', 'Polymers'] },
      { name: 'Science', specialties: ['Archaeology', 'Astronomy', 'Biology', 'Chemistry', 'Cosmology', 'Cybernetics', 'Economics', 'Genetics', 'History', 'Linguistics', 'Philosophy', 'Physics', 'Planetology', 'Psionicology', 'Psychology', 'Robotics', 'Sophontology', 'Xenology'] },
      { name: 'Seafarer', specialties: ['Ocean Ships', 'Personal', 'Sail', 'Submarine'] },
      { name: 'Streetwise' },
      { name: 'Survival' },
      { name: 'Vacc Suit' }
    ];
    const BG_BY_NAME = {};
    BACKGROUND_SKILLS.forEach(s => { BG_BY_NAME[s.name] = s; });

    function dmNum(v) {
      if (v <= 0)   return -3;
      if (v <= 2)   return -2;
      if (v <= 5)   return -1;
      if (v <= 8)   return 0;
      if (v <= 11)  return 1;
      if (v <= 14)  return 2;
      return 3;
    }

    function bgAllowance() {
      return Math.max(0, Math.min(6, dmNum(draft.edu) + 3));
    }

    function bgState() {
      return (draft.creation_data && draft.creation_data.step3) || { selected: {} };
    }

    async function saveBgState(patch) {
      const data = draft.creation_data || {};
      data.step3 = Object.assign({}, bgState(), patch);
      draft.creation_data = data;
      await supabaseClient.from('characters').update({ creation_data: data }).eq('id', draft.id);
    }

    function bgValidCount(selected) {
      return Object.keys(selected).filter(name => selected[name].on).length;
    }

    function renderStepBackgroundSkills() {
      const allowed = bgAllowance();
      const s = bgState();
      const selected = s.selected || {};
      const validCount = bgValidCount(selected);
      const atCap = validCount >= allowed;

      const rows = BACKGROUND_SKILLS.map(def => {
        const sel = selected[def.name] || {};
        const disableCheck = !sel.on && atCap;
        return `
          <div style="display:flex; align-items:center; gap:10px; margin-bottom:8px;">
            <input type="checkbox" ${sel.on ? 'checked' : ''} ${disableCheck ? 'disabled' : ''}
                   onchange="toggleBgSkill('${def.name}', this.checked)" style="width:18px; height:18px; accent-color:#00e5ff;" />
            <span style="min-width:110px; ${sel.on ? 'color:#00ffaa;' : ''}">${def.name}</span>
          </div>
        `;
      }).join('');

      return `
        <div class="rule-card wizard-card">
          <div class="wizard-card-title">Background Skills</div>
          <div class="wizard-card-sub">
            Before your first career, adolescence leaves you with a grounding in everyday skills.
            You gain a number of level-0 background skills equal to your EDU DM + 3 — background skills are
            gained without a specialty. (Core Rulebook p.9)
          </div>
          <div style="color:#00e5ff; font-weight:600; margin-bottom:14px;">
            Selected ${validCount} of ${allowed}${draft.edu !== undefined ? ` (EDU ${draft.edu}, DM ${charDM(draft.edu)})` : ''}
          </div>
          ${rows}
          <div id="step3-error"></div>
          <div class="wizard-actions">
            <button class="btn-outline" onclick="goStep(2)">Back</button>
            <button class="btn-outline" onclick="submitStepBackgroundSkills()" ${validCount === allowed ? '' : 'disabled'}>Continue</button>
          </div>
        </div>
      `;
    }

    async function toggleBgSkill(name, checked) {
      const s = bgState();
      const selected = Object.assign({}, s.selected);
      selected[name] = { on: checked };
      await saveBgState({ selected });
      renderStep();
    }

    async function submitStepBackgroundSkills() {
      const allowed = bgAllowance();
      const s = bgState();
      const selected = s.selected || {};
      const errEl = document.getElementById('step3-error');

      if (bgValidCount(selected) !== allowed) {
        errEl.innerHTML = '<p class="wizard-error">Select exactly your allowed number of background skills.</p>';
        return;
      }

      const skills = Object.assign({}, draft.skills || {});
      Object.keys(selected).forEach(name => {
        if (!selected[name].on) return;
        skills[name] = { name, specialty: null, level: 0 };
      });

      const { error } = await supabaseClient.from('characters')
        .update({ skills, creation_step: 4 }).eq('id', draft.id);
      if (error) {
        errEl.innerHTML = `<p class="wizard-error">${error.message}</p>`;
        return;
      }
      draft.skills = skills;
      draft.creation_step = 4;
      const chosenNames = Object.keys(selected).filter(name => selected[name].on);
      await logCreation(`Chose background skills: ${chosenNames.join(', ') || 'none'}.`);
      renderStep();
    }

    // ── Step 4: Pre-Career Education ──────────────────────────
    // Core Rulebook pp.16-17 (University, Military Academy) +
    // Traveller Companion pp.31-34 (Colonial Upbringing, Merchant
    // Academy, Psionic Community, School of Hard Knocks, Spacer
    // Community). Service Skills / Broker / Merchant Marine tables
    // live in the not-yet-built Career step, so those skill grants
    // are recorded as a note rather than applied automatically.
    // All pre-career education skill grants are level 0, no specialty.
    const UNIVERSITY_SKILLS = [
      { name: 'Admin' }, { name: 'Advocate' }, { name: 'Animals' },
      { name: 'Art' }, { name: 'Astrogation' },
      { name: 'Electronics' }, { name: 'Engineer' },
      { name: 'Language' }, { name: 'Medic' }, { name: 'Navigation' },
      { name: 'Profession' }, { name: 'Science' }
    ];

    const PRE_ED_OPTIONS = [
      {
        id: 'university', name: 'University', source: 'Core Rulebook p.16',
        summary: 'A narrow but deep education in academic subjects — few other paths sharpen specific skills this quickly.',
        entry: (d) => ({ stat: 'edu', target: 6, extraDM: d.soc >= 9 ? 1 : 0, dmLabel: d.soc >= 9 ? 'DM+1 (SOC 9+)' : '' }),
        entryGrant: { chooseN: { n: 2, level: 0, from: UNIVERSITY_SKILLS } },
        graduation: (d) => ({ stat: 'int_stat', target: 7, honours: 11, extraDM: (d.end_stat >= 8 ? 1 : 0) + (d.soc >= 8 ? 1 : 0), dmLabel: 'DM+1 if END 8+, DM+1 if SOC 8+' }),
        benefits: [
          { id: 'bump_chosen', text: 'Increase both skills chosen at entry by one level.', type: 'bumpEntrySkills', amount: 1 },
          { id: 'edu1', text: 'Increase EDU by an additional +1.', type: 'stat', key: 'edu', amount: 1 },
          { id: 'qual_dm', text: 'DM+1 (DM+2 with honours) to qualify for Agent, Army, Citizen (corporate), Entertainer (journalist), Marines, Navy, Scholar, Scouts.', type: 'flag' },

    // spent in pre-career education, regardless of which option chosen.

    function step4State() {
      return (draft.creation_data && draft.creation_data.step4) || { phase: 'choose' };
    }

    async function saveStep4State(patch) {
      const data = draft.creation_data || {};
      data.step4 = Object.assign({}, step4State(), patch);
      draft.creation_data = data;
      await supabaseClient.from('characters').update({ creation_data: data }).eq('id', draft.id);
    }

    async function appendNote(text) {
      const notes = draft.background_notes ? draft.background_notes + '\n\n' + text : text;
      await supabaseClient.from('characters').update({ background_notes: notes }).eq('id', draft.id);
      draft.background_notes = notes;
    }

    // ── Creation Log — running record of decisions/rolls, shown on the
    // Character Record's "Creation Log" tab.
    async function logCreation(text) {
      const stamp = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const line = `[${stamp}] ${text}`;
      const log = draft.creation_log ? draft.creation_log + '\n' + line : line;
      await supabaseClient.from('characters').update({ creation_log: log }).eq('id', draft.id);
      draft.creation_log = log;
    }

    function skillKey(name, specialty) { return specialty ? `${name}|${specialty}` : name; }

    function grantSkillMin(skills, name, specialty, level) {
      const key = skillKey(name, specialty);
      const existing = skills[key];
      const newLevel = Math.min(4, Math.max(existing ? existing.level : -1, level));
      skills[key] = { name, specialty: specialty || null, level: newLevel };
    }

    function bumpSkill(skills, name, specialty, delta) {
      const key = skillKey(name, specialty);
      const existing = skills[key];
      const newLevel = Math.min(4, Math.max(0, (existing ? existing.level : -1) + delta));
      skills[key] = { name, specialty: specialty || null, level: newLevel };
    }

    function findOption(id) { return PRE_ED_OPTIONS.find(o => o.id === id); }

    function renderStepPreEd() {
      const s = step4State();
      switch (s.phase) {
        case 'branch':       return renderPreEdBranch();
        case 'entry':        return renderPreEdEntry();
        case 'entryResult':  return renderPreEdEntryResult();
        case 'entrySkills':  return renderPreEdEntrySkills();
        case 'events':       return renderPreEdEvents();
        case 'graduation':   return renderPreEdGraduation();
        case 'benefits':     return renderPreEdBenefits();
        default:             return renderPreEdChoose();
      }
    }

    function renderPreEdChoose() {
      const cards = PRE_ED_OPTIONS.map(opt => `
        <div class="preed-option">
          <div class="preed-option-head ${opt.unavailable ? 'unavailable' : ''}" onclick="togglePreEdInfo('${opt.id}')">
            <span style="font-weight:600; color:#00e5ff;">${opt.name}</span>
            <span style="font-size:0.75rem; color:#4a9ab8;">${opt.source}${opt.unavailable ? ' — unavailable' : ''}</span>
          </div>
          <div class="preed-option-body" id="preed-info-${opt.id}" style="display:none;">
            <p style="margin-bottom:10px;">${opt.summary}</p>
            ${opt.unavailable ? '' : `<button class="btn-outline" onclick="selectPreEdOption('${opt.id}')">Select ${opt.name}</button>`}
          </div>
        </div>
      `).join('');

      return `
        <div class="rule-card wizard-card" style="max-width:none;">
          <div class="wizard-card-title">Pre-Career Education</div>
          <div class="wizard-card-sub">
            Before your first career, you may attend University or a service academy to round out your education.
            It's optional and only available before your third term — gain a few targeted skills now, then attempt
            graduation for further benefits. Click an option for details. (Core Rulebook p.16-17, Traveller Companion p.31-34)
          </div>
          ${cards}
          <div class="wizard-actions">
            <button class="btn-outline" onclick="goStep(3)">Back</button>
            <button class="btn-outline" onclick="skipPreEd()">Skip — Go Straight to Career</button>
          </div>
        </div>
      `;
    }

    function togglePreEdInfo(id) {
      const el = document.getElementById('preed-info-' + id);
      el.style.display = el.style.display === 'none' ? 'block' : 'none';
    }

    async function selectPreEdOption(id) {
      const opt = findOption(id);
      if (opt.branchChoice) {
        await saveStep4State({ phase: 'branch', optionId: id });
      } else if (opt.curriculumChoice) {
        await saveStep4State({ phase: 'branch', optionId: id, isCurriculum: true });
      } else {
        await saveStep4State({ phase: 'entry', optionId: id });
      }
      await logCreation(`Selected pre-career education option: ${opt.name}.`);
      renderStep();
    }

    async function skipPreEd() {
      await appendNote('[PRE-CAREER EDUCATION]\nSkipped pre-career education — went straight to choosing a career.\n[/PRE-CAREER EDUCATION]');
      await supabaseClient.from('characters').update({ creation_step: 5 }).eq('id', draft.id);
      draft.creation_step = 5;
      await logCreation('Skipped pre-career education — went straight to choosing a career.');
      renderStep();
    }

    function renderPreEdBranch() {
      const s = step4State();
      const opt = findOption(s.optionId);
      const choices = opt.branchChoice || opt.curriculumChoice;
      const label = opt.branchChoice ? 'Choose a branch' : 'Choose a curriculum';
      return `
        <div class="rule-card wizard-card">
          <div class="wizard-card-title">${opt.name}</div>
          <div class="wizard-card-sub">${label}.</div>
          <div class="wizard-actions" style="justify-content:flex-start; gap:12px; flex-wrap:wrap;">
            ${choices.map(c => `<button class="btn-outline" onclick="choosePreEdBranch('${c.key}')">${c.label || c.key}</button>`).join('')}
          </div>
          <div class="wizard-actions">
            <button class="btn-outline" onclick="backToPreEdChoose()">Back</button>
          </div>
        </div>
      `;
    }

    async function choosePreEdBranch(key) {
      const s = step4State();
      const patch = s.isCurriculum ? { curriculum: key, phase: 'entry' } : { branch: key, phase: 'entry' };
      await saveStep4State(patch);
      await logCreation(`Chose ${s.isCurriculum ? 'curriculum' : 'branch'}: ${key}.`);
      renderStep();
    }

    async function backToPreEdChoose() {
      await saveStep4State({ phase: 'choose', optionId: null, branch: null, curriculum: null });
      renderStep();
    }

    function renderPreEdEntry() {
      const s = step4State();
      const opt = findOption(s.optionId);
      const branchOrCurriculum = s.branch || s.curriculum;
      const e = opt.entry(draft, branchOrCurriculum);
      const branchLabel = s.branch ? ` (${s.branch})` : s.curriculum ? ` (${s.curriculum})` : '';

      if (e.requiresSoc6 && !e.auto) {
        return `
          <div class="rule-card wizard-card">
            <div class="wizard-card-title">${opt.name}${branchLabel}</div>
            <div class="wizard-card-sub">Entry: ${e.dmLabel}. Your SOC (${draft.soc}) doesn't qualify for automatic entry.</div>
            <div class="wizard-actions">
              <button class="btn-outline" onclick="backToPreEdChoose()">Back</button>
            </div>
          </div>
        `;
      }

      if (e.auto) {
        return `
          <div class="rule-card wizard-card">
            <div class="wizard-card-title">${opt.name}${branchLabel}</div>
            <div class="wizard-card-sub">Entry: ${e.dmLabel}.</div>
            <div class="wizard-actions" style="justify-content:flex-start;">
              <button class="btn-outline" onclick="doPreEdEntry(true)">Confirm Entry</button>
            </div>
            <div class="wizard-actions">
              <button class="btn-outline" onclick="backToPreEdChoose()">Back</button>
            </div>
          </div>
        `;
      }

      const statLabel = (CHARS.find(c => c.key === e.stat) || { label: e.stat.toUpperCase() }).label;
      return `
        <div class="rule-card wizard-card">
          <div class="wizard-card-title">${opt.name}${branchLabel} — Entry</div>
          <div class="wizard-card-sub">
            Roll 2D + ${statLabel} DM${e.extraDM ? ' + ' + e.extraDM : ''} (need ${e.target}+).${e.dmLabel ? ' ' + e.dmLabel : ''}
          </div>
          <div class="wizard-actions" style="justify-content:flex-start;">
            <button class="btn-outline" onclick="doPreEdEntry(false)">Roll Entry</button>
          </div>
          <div class="wizard-actions">
            <button class="btn-outline" onclick="backToPreEdChoose()">Back</button>
          </div>
        </div>
      `;
    }

    async function doPreEdEntry(auto) {
      const s = step4State();
      const opt = findOption(s.optionId);
      const branchOrCurriculum = s.branch || s.curriculum;
      const e = opt.entry(draft, branchOrCurriculum);
      let result;

      if (auto) {
        result = { auto: true, success: true };
      } else {
        const d1 = rollDie(), d2 = rollDie();
        const statDM = dmNum(draft[e.stat] === undefined ? 0 : draft[e.stat]);
        const total = d1 + d2 + statDM + (e.extraDM || 0);
        result = { dice: [d1, d2], statDM, extraDM: e.extraDM || 0, target: e.target, total, success: total >= e.target };
      }

      await saveStep4State({ phase: 'entryResult', entryResult: result });
      renderStep();

      await logCreation(`${opt.name}${branchOrCurriculum ? ' (' + branchOrCurriculum + ')' : ''} — Entry ${result.success ? 'succeeded' : 'failed'}${result.total !== undefined ? ` (rolled ${result.total} vs ${result.target}+)` : ' (automatic)'}.`);

      if (!result.success) {
        await appendNote(`[PRE-CAREER EDUCATION]\nAttempted ${opt.name}${branchOrCurriculum ? ' (' + branchOrCurriculum + ')' : ''} — failed Entry${result.total !== undefined ? ` (rolled ${result.total} vs ${result.target}+)` : ''}.\n[/PRE-CAREER EDUCATION]`);
      }
    }

    function renderPreEdEntryResult() {
      const s = step4State();
      const opt = findOption(s.optionId);
      const r = s.entryResult;

      if (r.auto || r.success) {
        return `
          <div class="rule-card wizard-card">
            <div class="wizard-card-title">${opt.name} — Entry Succeeded</div>
            <div class="wizard-card-sub">
              ${r.dice ? `Rolled ${r.total} (${r.dice.join(' + ')} + ${r.statDM} stat DM${r.extraDM ? ' + ' + r.extraDM : ''}), needed ${r.target}+.` : 'Entry was automatic.'}
            </div>
            <div class="wizard-actions">
              <button class="btn-outline" onclick="goToEntrySkills()">Continue to Skills</button>
            </div>
          </div>
        `;
      }

      return `
        <div class="rule-card wizard-card">
          <div class="wizard-card-title">${opt.name} — Entry Failed</div>
          <div class="wizard-card-sub">Rolled ${r.total} (${r.dice.join(' + ')} + ${r.statDM}${r.extraDM ? ' + ' + r.extraDM : ''}), needed ${r.target}+. No pre-career education this time.</div>
          <div class="wizard-actions">
            <button class="btn-outline" onclick="finishPreEdFail()">Continue to Career</button>
          </div>
        </div>
      `;
    }

    async function goToEntrySkills() {
      await saveStep4State({ phase: 'entrySkills' });
      renderStep();
    }

    async function finishPreEdFail() {
      await supabaseClient.from('characters').update({ creation_step: 5 }).eq('id', draft.id);
      draft.creation_step = 5;
      await logCreation('Pre-career education entry failed — moving on to choosing a career.');
      renderStep();
    }

    function renderPreEdEntrySkills() {
      const s = step4State();
      const opt = findOption(s.optionId);
      const grant = opt.entryGrant;
      const chooser = s.entrySkillChooser || {};

      let pickerHtml = '';
      if (grant.chooseN) {
        const chosen = chooser.chosen || [];
        pickerHtml = `
          <div class="wizard-card-sub">Choose ${grant.chooseN.n} of the following, gained at level ${grant.chooseN.level} (selected ${chosen.length} of ${grant.chooseN.n}):</div>
          ${grant.chooseN.from.map(sk => {
            const isChosen = chosen.some(c => c.name === sk.name);
            const disable = !isChosen && chosen.length >= grant.chooseN.n;
            return `
              <div style="display:flex; align-items:center; gap:10px; margin-bottom:8px;">
                <input type="checkbox" ${isChosen ? 'checked' : ''} ${disable ? 'disabled' : ''}
                       onchange="toggleEntryChooseN('${sk.name}', this.checked)" style="width:18px; height:18px; accent-color:#00e5ff;" />
                <span style="min-width:110px;">${sk.name}</span>
              </div>
            `;
          }).join('')}
        `;
      } else if (grant.auto && !grant.chooseN) {
        pickerHtml = `<p style="color:#4a9ab8;">Skills below are granted automatically.</p>`;
      }

      const autoText = grant.auto ? grant.auto.map(sk => `${sk.name} ${sk.level || 0}`).join(', ') : '';
      const ready = grant.chooseN
        ? (chooser.chosen || []).length === grant.chooseN.n
        : true;

      return `
        <div class="rule-card wizard-card">
          <div class="wizard-card-title">${opt.name} — Entry Skills</div>
          ${autoText ? `<div class="wizard-card-sub">Automatic: ${autoText}</div>` : ''}
          ${grant.note ? `<div class="wizard-card-sub" style="color:#4a9ab8;">${grant.note}</div>` : ''}
          ${pickerHtml}
          <div class="wizard-actions">
            <button class="btn-outline" onclick="goEntryEvents()" ${ready ? '' : 'disabled'}>Continue</button>
          </div>
        </div>
      `;
    }

    async function toggleEntryChooseN(name, checked) {
      const s = step4State();
      const chooser = s.entrySkillChooser || {};
      let chosen = (chooser.chosen || []).slice();
      if (checked) {
        chosen.push({ name });
      } else {
        chosen = chosen.filter(c => c.name !== name);
      }
      await saveStep4State({ entrySkillChooser: { chosen } });
      renderStep();
    }

    async function goEntryEvents() {
      const s = step4State();
      const opt = findOption(s.optionId);
      const grant = opt.entryGrant;
      const skills = Object.assign({}, draft.skills || {});

      if (grant.auto) {
        grant.auto.forEach(sk => grantSkillMin(skills, sk.name, null, sk.level || 0));
      }
      const chooser = s.entrySkillChooser || {};
      if (grant.chooseN) {
        (chooser.chosen || []).forEach(c => grantSkillMin(skills, c.name, null, grant.chooseN.level));
      }

      await supabaseClient.from('characters').update({ skills }).eq('id', draft.id);
      const before = draft.skills || {};
      const gainedNames = Object.keys(skills).filter(k => !before[k] || before[k].level !== skills[k].level)
        .map(k => `${skills[k].name}${skills[k].specialty ? ' (' + skills[k].specialty + ')' : ''} ${skills[k].level}`);
      draft.skills = skills;

      if (grant.deferred) {
        await appendNote(`[PRE-CAREER EDUCATION]\n${opt.name}: ${grant.note}\n[/PRE-CAREER EDUCATION]`);
      }

      await logCreation(`${opt.name} — entry skills: ${gainedNames.join(', ') || (grant.deferred ? 'deferred (see Background Notes)' : 'none')}.`);

      await saveStep4State({ phase: 'events' });
      renderStep();
    }

    function renderPreEdEvents() {
      const s = step4State();
      const opt = findOption(s.optionId);
      const eventRoll = s.eventRoll;

      if (!eventRoll) {
        return `
          <div class="rule-card wizard-card">
            <div class="wizard-card-title">${opt.name} — Pre-Career Events</div>
            <div class="wizard-card-sub">Roll 2D on the Pre-Career Events table. (Core Rulebook p.17)</div>
            <div class="wizard-actions" style="justify-content:flex-start;">
              <button class="btn-outline" onclick="rollPreEdEvent()">Roll Event</button>
            </div>
          </div>
        `;
      }

      const resolved = !!(s.eventMechanic && s.eventMechanic.resolved);

      return `
        <div class="rule-card wizard-card">
          <div class="wizard-card-title">${opt.name} — Pre-Career Events</div>
          <div class="wizard-card-sub">Rolled ${eventRoll.total} (${eventRoll.dice.join(' + ')}).</div>
          <p style="margin-bottom:14px;">${PRE_ED_EVENTS[eventRoll.total]}</p>
          ${renderEventMechanic(eventRoll.total)}
          ${resolved ? renderConnectionWidget('event4_' + (draft.id || '')) : ''}
          <div class="wizard-actions">
            <button class="btn-outline" onclick="goToPreEdGraduation()" ${resolved ? '' : 'disabled'}>Continue to Graduation</button>
          </div>
        </div>
      `;
    }

    async function rollPreEdEvent() {
      const d1 = rollDie(), d2 = rollDie();
      const total = d1 + d2;
      let mechanic = {};

      if (total === 5) {
        const skills = Object.assign({}, draft.skills || {});
        grantSkillMin(skills, 'Carouse', null, 1);
        await supabaseClient.from('characters').update({ skills }).eq('id', draft.id);
        draft.skills = skills;
        mechanic.resolved = true;
      } else if (total === 12) {
        const update = { soc: (draft.soc || 0) + 1 };
        await supabaseClient.from('characters').update(update).eq('id', draft.id);
        Object.assign(draft, update);
        mechanic.resolved = true;
      } else if (total === 3) {
        mechanic = { resolved: true, gradForcedFail: true };
      } else if (total === 2 || total === 7) {
        mechanic.resolved = true;
      }

      await saveStep4State({ eventRoll: { dice: [d1, d2], total }, eventMechanic: mechanic });
      await logCreation(`Pre-Career Event roll: ${total} — ${PRE_ED_EVENTS[total]}`);
      renderStep();
    }

    async function goToPreEdGraduation() {
      const s = step4State();
      const opt = findOption(s.optionId);
      await appendNote(`[PRE-CAREER EVENT]\n${opt.name} — rolled ${s.eventRoll.total}: ${PRE_ED_EVENTS[s.eventRoll.total]}\n[/PRE-CAREER EVENT]`);
      await saveStep4State({ phase: 'graduation' });
      renderStep();
    }

    // ── Pre-Career Event mechanics (rolls 4, 6, 8, 9, 10, 11) ─────
    async function saveEventMechanic(patch) {
      const s = step4State();
      const mechanic = Object.assign({}, s.eventMechanic, patch);
      await saveStep4State({ eventMechanic: mechanic });
    }

    async function addAssociate(type, name, description) {
      if (!name) return;
      await supabaseClient.from('character_associates').insert({ character_id: draft.id, type, name, description: description || null });
    }

    function renderEventMechanic(total) {
      const s = step4State();
      const m = s.eventMechanic || {};

      if (total === 4) return renderEvent4(m);
      if (total === 6) return renderEvent6(m);
      if (total === 8) return renderEvent8(m);
      if (total === 9) return renderEvent9(m);
      if (total === 10) return renderEvent10(m);
      if (total === 11) return renderEvent11(m);
      return '';
    }

    function renderEvent4(m) {
      if (!m.rolled) {
        return `
          <div class="wizard-actions" style="justify-content:flex-start; margin-top:0;">
            <button class="btn-outline" onclick="rollEvent4()">Roll SOC 8+</button>
          </div>
        `;
      }
      if (!m.resolved) {
        return `
          <div class="wizard-card-sub">Rolled ${m.total} (need 8+) — ${m.outcome === 'rival' ? 'gain a Rival.' : 'gain an Enemy.'}${m.natural2 ? ' Rolled a natural 2 — you also fail to graduate and must take the Prisoner career next term.' : ''}</div>
          <div class="wizard-field">
            <label>${m.outcome === 'rival' ? 'Rival' : 'Enemy'} name</label>
            <input id="event4-name" type="text" placeholder="Name" />
          </div>
          <div class="wizard-actions" style="justify-content:flex-start; margin-top:0;">
            <button class="btn-outline" onclick="confirmEvent4()">Confirm</button>
          </div>
        `;
      }
      return `<div class="wizard-card-sub" style="color:#00ffaa;">Resolved.</div>`;
    }

    async function rollEvent4() {
      const d1 = rollDie(), d2 = rollDie();
      const total = d1 + d2 + dmNum(draft.soc);
      const outcome = total >= 8 ? 'rival' : 'enemy';
      const natural2 = (d1 + d2) === 2;
      await saveEventMechanic({ rolled: true, total, outcome, natural2, gradForcedFail: natural2 || undefined });
      renderStep();
    }

    async function confirmEvent4() {
      const s = step4State();
      const m = s.eventMechanic;
      const name = document.getElementById('event4-name').value.trim() || 'Unnamed';
      await addAssociate(m.outcome, name, 'From a pre-career education event.');
      await saveEventMechanic({ resolved: true });
      await logCreation(`Event 4 outcome: gained ${name} as a ${m.outcome}.`);
      renderStep();
    }

    function renderEvent6(m) {
      if (!m.count) {
        return `
          <div class="wizard-actions" style="justify-content:flex-start; margin-top:0;">
            <button class="btn-outline" onclick="rollEvent6()">Roll D3</button>
          </div>
        `;
      }
      if (!m.resolved) {
        return `
          <div class="wizard-card-sub">Rolled D3 = ${m.count}. Name your new Allies:</div>
          ${Array.from({ length: m.count }).map((_, i) => `
            <div class="wizard-field">
              <label>Ally ${i + 1}</label>
              <input id="event6-name-${i}" type="text" placeholder="Name" />
            </div>
          `).join('')}
          <div class="wizard-actions" style="justify-content:flex-start; margin-top:0;">
            <button class="btn-outline" onclick="confirmEvent6()">Confirm</button>
          </div>
        `;
      }
      return `<div class="wizard-card-sub" style="color:#00ffaa;">Resolved.</div>`;
    }

    async function rollEvent6() {
      const count = Math.ceil(rollDie() / 2);
      await saveEventMechanic({ count });
      renderStep();
    }

    async function confirmEvent6() {
      const s = step4State();
      const m = s.eventMechanic;
      const names = [];
      for (let i = 0; i < m.count; i++) {
        const name = document.getElementById('event6-name-' + i).value.trim();
        if (name) { await addAssociate('ally', name, 'A lifelong friend from a tightly knit clique.'); names.push(name); }
      }
      await saveEventMechanic({ resolved: true });
      await logCreation(`Event 6 outcome: gained ${names.length} Allies — ${names.join(', ') || 'none named'}.`);
      renderStep();
    }

    function renderEvent8(m) {
      if (!m.rolled) {
        return `
          <div class="wizard-actions" style="justify-content:flex-start; margin-top:0;">
            <button class="btn-outline" onclick="rollEvent8()">Roll SOC 8+</button>
          </div>
        `;
      }
      if (m.success && !m.resolved) {
        return `
          <div class="wizard-card-sub">Rolled ${m.total} (need 8+) — success! You become a leading figure.</div>
          <div class="wizard-field"><label>Ally (within the movement)</label><input id="event8-ally" type="text" placeholder="Name" /></div>
          <div class="wizard-field"><label>Enemy (in wider society)</label><input id="event8-enemy" type="text" placeholder="Name" /></div>
          <div class="wizard-actions" style="justify-content:flex-start; margin-top:0;">
            <button class="btn-outline" onclick="confirmEvent8()">Confirm</button>
          </div>
        `;
      }
      if (!m.success && !m.resolved) {
        return `<div class="wizard-card-sub">Rolled ${m.total} (need 8+) — no special outcome this time.</div>`;
      }
      return `<div class="wizard-card-sub" style="color:#00ffaa;">Resolved.</div>`;
    }

    async function rollEvent8() {
      const d1 = rollDie(), d2 = rollDie();
      const total = d1 + d2 + dmNum(draft.soc);
      const success = total >= 8;
      await saveEventMechanic({ rolled: true, total, success, resolved: !success });
      if (!success) await logCreation(`Event 8 outcome: rolled ${total} (need 8+) — no special outcome.`);
      renderStep();
    }

    async function confirmEvent8() {
      const allyName = document.getElementById('event8-ally').value.trim();
      const enemyName = document.getElementById('event8-enemy').value.trim();
      if (allyName) await addAssociate('ally', allyName, 'A fellow member of the political movement.');
      if (enemyName) await addAssociate('enemy', enemyName, 'Opposed your rise within the political movement.');
      await saveEventMechanic({ resolved: true });
      await logCreation(`Event 8 outcome: became a leading figure — Ally ${allyName || 'none'}, Enemy ${enemyName || 'none'}.`);
      renderStep();
    }

    function renderEvent9(m) {
      if (m.resolved) return `<div class="wizard-card-sub" style="color:#00ffaa;">Gained ${m.skillName}${m.specialty ? ' (' + m.specialty + ')' : ''} 0.</div>`;
      const chosen = m.skillName;
      const def = chosen ? SKILLS.find(sk => sk.name === chosen) : null;
      return `
        <div class="wizard-field">
          <label>Skill</label>
          <select onchange="setEvent9Skill(this.value)">
            <option value="">— choose a skill —</option>
            ${SKILLS.filter(sk => sk.name !== 'Jack-of-All-Trades').map(sk => `<option value="${sk.name}" ${chosen === sk.name ? 'selected' : ''}>${sk.name}</option>`).join('')}
          </select>
        </div>
        ${def && def.specialties.length ? `
          <div class="wizard-field">
            <label>Specialty</label>
            <select onchange="setEvent9Specialty(this.value)">
              <option value="">— specialty —</option>
              ${def.specialties.map(sp => `<option value="${sp.name}" ${m.specialty === sp.name ? 'selected' : ''}>${sp.name}</option>`).join('')}
            </select>
          </div>
        ` : ''}
        <div class="wizard-actions" style="justify-content:flex-start; margin-top:0;">
          <button class="btn-outline" onclick="confirmEvent9()" ${chosen && (!def || !def.specialties.length || m.specialty) ? '' : 'disabled'}>Confirm</button>
        </div>
      `;
    }

    async function setEvent9Skill(name) { await saveEventMechanic({ skillName: name, specialty: '' }); renderStep(); }
    async function setEvent9Specialty(sp) { await saveEventMechanic({ specialty: sp }); renderStep(); }

    async function confirmEvent9() {
      const s = step4State();
      const m = s.eventMechanic;
      const skills = Object.assign({}, draft.skills || {});
      grantSkillMin(skills, m.skillName, m.specialty || null, 0);
      await supabaseClient.from('characters').update({ skills }).eq('id', draft.id);
      draft.skills = skills;
      await saveEventMechanic({ resolved: true });
      await logCreation(`Event 9 outcome: gained ${m.skillName}${m.specialty ? ' (' + m.specialty + ')' : ''} 0.`);
      renderStep();
    }

    function termSkillOptions() {
      const s = step4State();
      const opt = findOption(s.optionId);
      const keys = new Set();
      if (opt.entryGrant.auto) opt.entryGrant.auto.forEach(sk => keys.add(skillKey(sk.name, sk.specialty)));
      const chooser = s.entrySkillChooser || {};
      if (chooser.chosen) {
        const vals = Array.isArray(chooser.chosen) ? chooser.chosen : Object.values(chooser.chosen);
        vals.forEach(c => keys.add(skillKey(c.name, c.specialty)));
      }
      return Array.from(keys).filter(k => draft.skills && draft.skills[k]).map(k => ({ key: k, ...draft.skills[k] }));
    }

    function renderEvent10(m) {
      if (m.resolved) {
        return `<div class="wizard-card-sub" style="color:#00ffaa;">Rolled ${m.total} (need 9+) — ${m.success ? `gained a level in ${m.skillName}, tutor becomes a Rival.` : 'no success this time, but the tutor still becomes a Rival.'}</div>`;
      }
      const opts = termSkillOptions();
      if (!opts.length) {
        return `<div class="wizard-card-sub">You have no skills learned this term to roll against.</div>
          <div class="wizard-actions" style="justify-content:flex-start; margin-top:0;"><button class="btn-outline" onclick="skipEvent10()">Continue</button></div>`;
      }
      return `
        <div class="wizard-field">
          <label>Skill learned this term</label>
          <select id="event10-skill">
            <option value="">— choose —</option>
            ${opts.map(o => `<option value="${o.key}">${o.name}${o.specialty ? ' (' + o.specialty + ')' : ''} ${o.level}</option>`).join('')}
          </select>
        </div>
        <div class="wizard-actions" style="justify-content:flex-start; margin-top:0;">
          <button class="btn-outline" onclick="rollEvent10()">Roll 9+</button>
        </div>
      `;
    }

    async function rollEvent10() {
      const sel = document.getElementById('event10-skill').value;
      if (!sel) return;
      const skillData = draft.skills[sel];
      const d1 = rollDie(), d2 = rollDie();
      const total = d1 + d2 + skillData.level;
      const success = total >= 9;
      if (success) {
        const skills = Object.assign({}, draft.skills);
        bumpSkill(skills, skillData.name, skillData.specialty, 1);
        await supabaseClient.from('characters').update({ skills }).eq('id', draft.id);
        draft.skills = skills;
      }
      await addAssociate('rival', 'A demanding tutor', 'Met during pre-career education.');
      await saveEventMechanic({ resolved: true, total, success, skillName: skillData.name });
      await logCreation(`Event 10 outcome: rolled ${total} (need 9+) on ${skillData.name} — ${success ? 'gained a level, ' : 'no success, '}tutor gained as a Rival.`);
      renderStep();
    }

    async function skipEvent10() {
      await saveEventMechanic({ resolved: true });
      renderStep();
    }

    function renderEvent11(m) {
      if (m.avoided) return `<div class="wizard-card-sub" style="color:#00ffaa;">Avoided the draft — proceed to graduation as normal.</div>`;
      if (m.resolved) return `<div class="wizard-card-sub">${m.outcome}</div>`;
      if (!m.checkedAvoid) {
        return `
          <div class="wizard-actions" style="justify-content:flex-start; margin-top:0;">
            <button class="btn-outline" onclick="rollEvent11Avoid()">Roll SOC 9+ to Avoid the Draft</button>
          </div>
        `;
      }
      return `
        <div class="wizard-card-sub">Rolled ${m.avoidTotal} (need 9+) — did not avoid the draft. Choose:</div>
        <div class="wizard-actions" style="justify-content:flex-start; gap:12px; margin-top:0;">
          <button class="btn-outline" onclick="event11Flee()">Flee (join Drifter next term)</button>
          <button class="btn-outline" onclick="event11AcceptDraft()">Accept the Draft</button>
        </div>
      `;
    }

    async function rollEvent11Avoid() {
      const d1 = rollDie(), d2 = rollDie();
      const total = d1 + d2 + dmNum(draft.soc);
      if (total >= 9) {
        await saveEventMechanic({ checkedAvoid: true, avoidTotal: total, avoided: true, resolved: true });
        await logCreation(`Event 11 outcome: rolled ${total} (need 9+) — avoided the draft.`);
      } else {
        await saveEventMechanic({ checkedAvoid: true, avoidTotal: total });
        await logCreation(`Event 11: rolled ${total} (need 9+) — did not avoid the draft.`);
      }
      renderStep();
    }

    async function event11Flee() {
      await saveEventMechanic({ resolved: true, gradForcedFail: true, outcome: 'You flee and will join the Drifter career next term. You do not graduate this term.' });
      await logCreation('Event 11 outcome: fled — will join the Drifter career next term.');
      renderStep();
    }

    async function event11AcceptDraft() {
      const branchRoll = rollDie();
      const branch = branchRoll <= 3 ? 'Army' : branchRoll <= 5 ? 'Marine' : 'Navy';
      await saveEventMechanic({ resolved: true, gradForcedFail: true, outcome: `Drafted into the ${branch} — that career begins next term (once Careers is built). You do not graduate this term.` });
      await logCreation(`Event 11 outcome: drafted into the ${branch}.`);
      renderStep();
    }

    // ── Connections Rule widget (shared by event/graduation screens) ──
    function connectionsUsed() { return (draft.creation_data && draft.creation_data.connectionsUsed) || 0; }

    function renderConnectionWidget(tag) {
      if (connectionsUsed() >= 2) {
        return `<div style="font-size:0.8rem; color:#4a9ab8; margin-bottom:14px;">Connections used: 2 of 2 (maximum reached).</div>`;
      }
      return `
        <div style="margin-bottom:14px;">
          <button class="btn-outline" onclick="openConnectionPicker('${tag}')">Add Connection</button>
          <span style="font-size:0.78rem; color:#4a9ab8; margin-left:10px;">Connections used: ${connectionsUsed()} of 2</span>
        </div>
        <div id="connection-picker-${tag}"></div>
      `;
    }

    async function openConnectionPicker(tag) {
      const { data } = await supabaseClient.from('characters')
        .select('id,name').neq('id', draft.id).order('name');
      const el = document.getElementById('connection-picker-' + tag);
      if (!data || !data.length) {
        el.innerHTML = `<p class="wizard-error">No other characters in the Roster to connect with yet.</p>`;
        return;
      }
      el.innerHTML = `
        <div class="wizard-field">
          <label>Connect with</label>
          <select id="connection-target-${tag}">
            <option value="">— choose a Traveller —</option>
            ${data.map(c => `<option value="${c.id}">${c.name}</option>`).join('')}
          </select>
        </div>
        <button class="btn-outline" onclick="confirmConnection('${tag}')">Confirm Connection</button>
      `;
    }

    async function confirmConnection(tag) {
      const sel = document.getElementById('connection-target-' + tag);
      const targetId = sel.value;
      if (!targetId) return;
      const targetName = sel.options[sel.selectedIndex].text;

      const data = draft.creation_data || {};
      data.connectionsUsed = (data.connectionsUsed || 0) + 1;
      draft.creation_data = data;
      await supabaseClient.from('characters').update({ creation_data: data }).eq('id', draft.id);

      await appendNote(`[CONNECTION]\nFormed a connection with ${targetName} — gained one free skill choice (max 2 from connections, can't exceed level 3, no Jack-of-all-Trades).\n[/CONNECTION]`);
      await logCreation(`Formed a connection with ${targetName} — gained one free skill choice.`);

      document.getElementById('connection-picker-' + tag).innerHTML =
        `<p style="color:#00ffaa; font-size:0.85rem;">Connection recorded with ${targetName}. Add the skill bump on ${targetName}'s sheet directly, and remember to add one on yours too.</p>`;
      renderStep();
    }

    function renderPreEdGraduation() {
      const s = step4State();
      const opt = findOption(s.optionId);
      const g = opt.graduation(draft);
      const gradRoll = s.gradRoll;

      if (!gradRoll && s.eventMechanic && s.eventMechanic.gradForcedFail) {
        return `
          <div class="rule-card wizard-card">
            <div class="wizard-card-title">${opt.name} — Graduation</div>
            <div class="wizard-card-sub">This term's event means you do not graduate — no roll needed.</div>
            <div class="wizard-actions">
              <button class="btn-outline" onclick="forceFailGraduation()">Continue</button>
            </div>
          </div>
        `;
      }

      if (!gradRoll) {
        const statLabel = (CHARS.find(c => c.key === g.stat) || { label: (g.stat || '').toUpperCase() }).label;
        return `
          <div class="rule-card wizard-card">
            <div class="wizard-card-title">${opt.name} — Graduation</div>
            <div class="wizard-card-sub">
              Roll 2D + ${statLabel} DM${g.extraDM ? ' + ' + g.extraDM : ''} (need ${g.target}+, honours on ${g.honours}+).${g.dmLabel ? ' ' + g.dmLabel : ''}
            </div>
            <div class="wizard-actions" style="justify-content:flex-start;">
              <button class="btn-outline" onclick="rollPreEdGraduation()">Roll Graduation</button>
            </div>
          </div>
        `;
      }

      return `
        <div class="rule-card wizard-card">
          <div class="wizard-card-title">${opt.name} — Graduation</div>
          <div class="wizard-card-sub">
            Rolled ${gradRoll.total} (need ${g.target}+). ${gradRoll.success ? (gradRoll.honours ? 'Graduated with honours!' : 'Graduated.') : 'Did not graduate.'}
          </div>
          <div class="wizard-actions">
            <button class="btn-outline" onclick="goToPreEdBenefits()">Continue</button>
          </div>
        </div>
      `;
    }

    async function rollPreEdGraduation() {
      const s = step4State();
      const opt = findOption(s.optionId);
      const g = opt.graduation(draft);
      const d1 = rollDie(), d2 = rollDie();
      const statDM = dmNum(draft[g.stat] === undefined ? 0 : draft[g.stat]);
      const total = d1 + d2 + statDM + (g.extraDM || 0);
      const success = total >= g.target;
      const honours = success && total >= g.honours;
      await saveStep4State({ gradRoll: { dice: [d1, d2], total, success, honours, target: g.target } });
      await logCreation(`${opt.name} — Graduation roll: ${total} (need ${g.target}+) — ${success ? (honours ? 'graduated with honours.' : 'graduated.') : 'did not graduate.'}`);
      renderStep();
    }

    async function goToPreEdBenefits() {
      await saveStep4State({ phase: 'benefits' });
      renderStep();
    }

    async function forceFailGraduation() {
      await saveStep4State({ gradRoll: { success: false, forced: true }, phase: 'benefits' });
      await logCreation('Graduation skipped — forced fail from a Pre-Career Event.');
      renderStep();
    }

    function renderPreEdBenefits() {
      const s = step4State();
      const opt = findOption(s.optionId);

      if (!s.gradRoll.success) {
        return `
          <div class="rule-card wizard-card">
            <div class="wizard-card-title">${opt.name} — No Graduation</div>
            <div class="wizard-card-sub">You did not graduate, so no Graduation Benefits apply. Moving on to choosing a career.</div>
            <div class="wizard-actions">
              <button class="btn-outline" onclick="finishPreEd()">Continue to Career</button>
            </div>
          </div>
        `;
      }

      const applicable = opt.benefits.filter(b => !b.honoursOnly || s.gradRoll.honours);
      const applied = s.benefitsApplied || {};

      const rows = applicable.map(b => {
        const isAuto = b.type === 'stat' || b.type === 'multiStat' || b.type === 'fixedSkill' || b.type === 'bumpEntrySkills';
        const done = applied[b.id];
        return `
          <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:14px; margin-bottom:10px; padding:10px; border:1px solid #0a4a60; border-radius:6px;">
            <div style="font-size:0.85rem;">${b.text}</div>
            ${isAuto
              ? `<button class="btn-outline" onclick="applyPreEdBenefit('${b.id}')" ${done ? 'disabled' : ''} style="flex-shrink:0;">${done ? 'Applied' : 'Apply'}</button>`
              : `<span style="font-size:0.75rem; color:#4a9ab8; flex-shrink:0;">Recorded as a note</span>`
            }
          </div>
        `;
      }).join('');

      const allDone = applicable.every(b => b.type !== 'stat' && b.type !== 'multiStat' && b.type !== 'fixedSkill' && b.type !== 'bumpEntrySkills' ? true : applied[b.id]);

      return `
        <div class="rule-card wizard-card">
          <div class="wizard-card-title">${opt.name} — Graduation Benefits${s.gradRoll.honours ? ' (Honours)' : ''}</div>
          ${rows}
          ${renderConnectionWidget('grad4_' + (draft.id || ''))}
          <div class="wizard-actions">
            <button class="btn-outline" onclick="finishPreEd()" ${allDone ? '' : 'disabled'}>Continue to Career</button>
          </div>
        </div>
      `;
    }

    async function applyPreEdBenefit(benefitId) {
      const s = step4State();
      const opt = findOption(s.optionId);
      const b = opt.benefits.find(x => x.id === benefitId);
      const update = {};

      if (b.type === 'stat') {
        update[b.key] = (draft[b.key] || 0) + b.amount;
      } else if (b.type === 'multiStat') {
        Object.keys(b.changes).forEach(k => { update[k] = (draft[k] || 0) + b.changes[k]; });
      } else if (b.type === 'fixedSkill') {
        const skills = Object.assign({}, draft.skills || {});
        grantSkillMin(skills, b.name, b.specialty, b.level);
        update.skills = skills;
      } else if (b.type === 'bumpEntrySkills') {
        const chosen = s.entrySkillChooser && s.entrySkillChooser.chosen;
        const skills = Object.assign({}, draft.skills || {});
        if (chosen) {
          Object.values(chosen).forEach(c => bumpSkill(skills, c.name, c.specialty, b.amount));
        }
        update.skills = skills;
      }

      await supabaseClient.from('characters').update(update).eq('id', draft.id);
      Object.assign(draft, update);

      const applied = Object.assign({}, s.benefitsApplied, { [benefitId]: true });
      await saveStep4State({ benefitsApplied: applied });
      await logCreation(`Applied Graduation Benefit: ${b.text}`);
      renderStep();
    }

    async function finishPreEd() {
      const s = step4State();
      const opt = findOption(s.optionId);
      const flagNotes = opt.benefits
        .filter(b => b.type === 'flag' && (!b.honoursOnly || (s.gradRoll && s.gradRoll.honours)))
        .map(b => `- ${b.text}`).join('\n');

      let note = `[PRE-CAREER EDUCATION]\n${opt.name}`;
      if (s.branch) note += ` (${s.branch})`;
      if (s.curriculum) note += ` (${s.curriculum})`;
      note += s.gradRoll
        ? (s.gradRoll.success ? (s.gradRoll.honours ? ' — graduated with honours.' : ' — graduated.') : ' — entered but did not graduate.')
        : ' — entered automatically.';
      if (flagNotes) note += `\nOutstanding benefits to apply by hand once Careers is built:\n${flagNotes}`;
      if (opt.ageNote) note += `\n${opt.ageNote}`;
      note += '\n[/PRE-CAREER EDUCATION]';

      await appendNote(note);
      await supabaseClient.from('characters').update({ creation_step: 5 }).eq('id', draft.id);
      draft.creation_step = 5;
      await logCreation(`Finished pre-career education (${opt.name}) — moving on to choosing a career.`);
      renderStep();
    }
