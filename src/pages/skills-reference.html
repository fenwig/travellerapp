<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skills Reference — Traveller</title>
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/reference.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="stars"></div>

  <div class="container">
    <header class="page-header">
      <a href="../../index.html" class="back-link">← Dashboard</a>
      <h1 class="page-title">SKILLS &amp; TASKS</h1>
    </header>

    <!-- Tab Navigation -->
    <div class="tab-nav">
      <button class="tab-btn active" onclick="showTab('skills')">Skills</button>
      <button class="tab-btn" onclick="showTab('tasks')">Tasks</button>
      <button class="tab-btn" onclick="showTab('combat')">Combat</button>
    </div>

    <!-- SKILLS TAB -->
    <div id="tab-skills" class="tab-content">

      <div class="skill-controls">
        <input type="text" id="skill-search" placeholder="Search skills..." oninput="filterSkills()" />
        <div class="filter-row">
          <button class="filter-btn active" onclick="filterCategory('all', this)">All</button>
          <button class="filter-btn" onclick="filterCategory('combat', this)">Combat</button>
          <button class="filter-btn" onclick="filterCategory('social', this)">Social</button>
          <button class="filter-btn" onclick="filterCategory('technical', this)">Technical</button>
          <button class="filter-btn" onclick="filterCategory('spacecraft', this)">Spacecraft</button>
          <button class="filter-btn" onclick="filterCategory('physical', this)">Physical</button>
        </div>
      </div>

      <div id="skill-grid" class="skill-grid"></div>
    </div>

    <!-- TASKS TAB -->
    <div id="tab-tasks" class="tab-content" style="display:none">
      <p style="color:#4a9ab8; margin-bottom: 1.5rem; font-size: 0.9rem;">Coming soon</p>
    </div>

    <!-- COMBAT TAB -->
    <div id="tab-combat" class="tab-content" style="display:none">
      <p style="color:#4a9ab8; margin-bottom: 1.5rem; font-size: 0.9rem;">Coming soon</p>
    </div>

  </div>

  <script src="../js/supabase-config.js"></script>
  <script src="../js/skills-data.js"></script>
  <script src="../js/skills-reference.js"></script>
</body>
</html>
