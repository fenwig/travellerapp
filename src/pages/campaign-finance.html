<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Campaign Finance — Traveller</title>
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/reference.css" />
  <link rel="stylesheet" href="../css/calculators.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/nav.js" defer></script>
  <style>
    .cf-wrap .calc-block { max-width: 1100px; }
    .cf-fund { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
    .cf-balance { font-size: 2.1rem; font-weight: 700; color: #00ffaa; letter-spacing: 0.04em; }
    .cf-sub { color: #4a9ab8; font-size: 0.82rem; }
    .cf-wrap .calc-block { max-width: none; }
    .cf-top { margin-bottom: 14px; padding: 10px 18px; }
    .cf-top .cf-fund { gap: 18px; }
    .cf-top .cf-balance { font-size: 1.8rem; }
    .cf-layout { display: grid; grid-template-columns: 7fr 3fr; gap: 14px; align-items: start; max-width: 1500px; }
    .cf-main, .cf-side { min-width: 0; }
    .cf-side .calc-block, .cf-main > .calc-block { margin-bottom: 14px; }
    .cf-tick { display: flex; flex-direction: column; gap: 1px; }
    .cf-tick .cf-check { font-size: 0.8rem; color: #b0d8e8; padding: 1px 0; margin: 0; line-height: 1.25; }
    .cf-mini td { padding: 2px 6px; font-size: 0.78rem; }
    .cf-ships { margin-top: 8px; border-top: 1px solid #0a4a60; padding-top: 6px; font-size: 0.76rem; color: #4a9ab8; }
    .cf-ships div { display: flex; justify-content: space-between; gap: 8px; padding: 1px 0; }
    .cf-ships span:last-child { color: #b0d8e8; }
    .cf-pct { display: flex; flex-direction: column; gap: 8px; }
    .cf-pct label { flex-direction: row; align-items: center; justify-content: space-between; font-size: 0.8rem; }
    .cf-pct input { width: 80px; }
    .cf-pct .cf-btn { align-self: flex-start; }
    @media (max-width: 1000px) { .cf-layout { grid-template-columns: 1fr; } }
    .cf-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-bottom: 14px; }
    .cf-grid .calc-block { margin-bottom: 0; }
    @media (max-width: 1400px) { .cf-grid { grid-template-columns: 1fr; } }
    .cf-row { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: flex-end; }
    .cf-row label { display: flex; flex-direction: column; gap: 3px; font-size: 0.72rem; color: #4a9ab8; }
    .cf-row input, .cf-row select { margin: 0; padding: 6px 8px; width: 100px; }
    .cf-row select { width: 170px; }
    .cf-row input.cf-wide { width: 150px; }
    .cf-row .btn-outline, .cf-btn { width: auto; padding: 7px 16px; font-size: 0.85rem; }
    .cf-preview { color: #4a9ab8; font-size: 0.8rem; margin-top: 8px; min-height: 1.1em; }
    .cf-msg { margin: 0 0 14px; padding: 9px 14px; border-radius: 6px; font-size: 0.85rem; display: none; max-width: 1100px; }
    .cf-msg.err { display: block; border: 1px solid #ff5a4a; background: rgba(255,90,74,0.12); color: #ff8a7a; }
    .cf-msg.ok { display: block; border: 1px solid #00ffaa66; background: rgba(0,255,170,0.08); color: #00ffaa; }
    .cf-table { width: 100%; border-collapse: collapse; font-size: 0.84rem; }
    .cf-table th { text-align: right; color: #4a9ab8; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.07em; padding: 5px 8px; border-bottom: 1px solid #0a4a60; }
    .cf-table td { text-align: right; padding: 4px 8px; border-bottom: 1px solid rgba(10,74,96,0.3); color: #b0d8e8; vertical-align: top; }
    .cf-table th.l, .cf-table td.l { text-align: left; }
    .cf-table tr.cf-total td { color: #00ffaa; font-weight: 700; border-top: 1px solid #00e5ff44; }
    .cf-table tr.cf-rev td { opacity: 0.45; text-decoration: line-through; }
    .cf-detail { color: #4a9ab8; font-size: 0.74rem; }
    .cf-pos { color: #00ffaa !important; } .cf-neg { color: #ff8a7a !important; }
    .cf-table .btn-small { padding: 2px 8px; font-size: 0.72rem; }
    .cf-pct label { min-width: 120px; }
    .cf-check { display: flex; align-items: center; gap: 6px; cursor: pointer; }
    .cf-check input { margin: 0; width: auto; }
  </style>
</head>
<body>

  <div class="app-shell">
    <nav class="sidebar">
      <div class="sidebar-logo">
        <div class="sidebar-logo-text">TRAVELLER</div>
        <div class="sidebar-user" id="sidebar-user"></div>
      </div>
      <div class="sidebar-signout">
        <button onclick="doSignOut()">Sign Out</button>
      </div>
    </nav>

    <main class="page-main">
      <h1 class="page-title">CAMPAIGN FINANCE</h1>
      <div class="cf-wrap" id="cf-root"><div class="cf-sub">Loading…</div></div>
    </main>
  </div>

  <script src="../js/supabase-config.js"></script>
  <script src="../js/sidebar.js"></script>
  <script src="../js/ship-expenses.js"></script>
  <script>
    let currentUser = null, campaignId = null, campaignName = '';
    let fund = 0, settings = null, actives = [], ledger = [], unbanked = [], shipData = [];
    let ticked = null;     // Set of character ids who share in the next payout (defaults to everyone active)
    const DISMISSED = '00000000-0000-0000-0000-000000000000';
    const INCOME_TYPES = [['Passenger', 'pct_passenger'], ['Freight', 'pct_freight'], ['Cargo', 'pct_cargo'], ['Mission', 'pct_mission']];

    const cr = n => (n < 0 ? '−' : '') + 'Cr' + Math.abs(Math.round(n)).toLocaleString();
    const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const val = id => { const el = document.getElementById(id); return el ? el.value : ''; };
    const amt = id => Math.floor(parseFloat(val(id)) || 0);

    async function init() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) { window.location.href = '../../index.html'; return; }
      currentUser = session.user;
      document.getElementById('sidebar-user').textContent = currentUser.user_metadata?.display_name || currentUser.email;
      const list = await loadCampaigns();
      campaignId = await currentCampaignId();
      if (!campaignId) { document.getElementById('cf-root').innerHTML = '<div class="cf-sub">Campaigns are not set up yet.</div>'; return; }
      campaignName = (list.find(c => c.id === campaignId) || {}).name || '';
      await loadAll();
    }

    async function loadAll() {
      try {
        const f = await supabaseClient.from('party_fund').select('*').eq('campaign_id', campaignId);
        if (f.error) throw f.error;
        fund = f.data && f.data[0] ? Number(f.data[0].balance) : 0;

        let s = await supabaseClient.from('party_settings').select('*').eq('campaign_id', campaignId);
        if (s.error) throw s.error;
        if (!s.data || !s.data[0]) {
          const ins = await supabaseClient.from('party_settings').insert({ campaign_id: campaignId }).select().single();
          if (ins.error) throw ins.error;
          settings = ins.data;
        } else settings = s.data[0];

        const c = await supabaseClient.from('characters').select('id,name,player_name,cash_on_hand').eq('campaign_id', campaignId).eq('status', 'active').order('name');
        actives = c.data || [];
        if (!ticked) ticked = new Set(actives.map(a => a.id));
        else ticked = new Set([...ticked].filter(id => actives.some(a => a.id === id)));

        const l = await supabaseClient.from('party_ledger').select('*').eq('campaign_id', campaignId).order('created_at', { ascending: false }).limit(500);
        ledger = l.data || [];

        const ships = await supabaseClient.from('spacecraft').select('id,name').eq('campaign_id', campaignId);
        const names = {}; (ships.data || []).forEach(x => { names[x.id] = x.name; });
        const ids = Object.keys(names);
        unbanked = [];
        if (ids.length) {
          const t = await supabaseClient.from('spacecraft_trade_log').select('*').in('spacecraft_id', ids).is('banked_ledger_id', null).order('sold_at', { ascending: false });
          unbanked = (t.data || []).map(r => ({ ...r, shipName: names[r.spacecraft_id] }));
        }
        shipData = await loadShipExpenses(campaignId);
        render();
      } catch (e) {
        document.getElementById('cf-root').innerHTML = '<div class="cf-msg err">Could not load Campaign Finance: ' + esc(e.message) + ' (Has docs/campaign-finance.sql been run in Supabase?)</div>';
      }
    }

    // ── money maths ──
    // Equal split of a total among ids. Any left-over credits stay with the fund.
    function equalSplit(total, ids) {
      if (!ids.length) return { each: 0, left: total };
      const each = Math.floor(total / ids.length);
      return { each, left: total - each * ids.length };
    }
    // Income: fund takes pct, the rest is shared equally among the ticked players.
    function incomeSplit(gross, pct, ids) {
      const fundShare = Math.round(gross * pct / 100);
      const sp = equalSplit(gross - fundShare, ids);
      return { fund: fundShare + sp.left, each: sp.each, players: sp.each > 0 ? ids.map(id => ({ id, amount: sp.each })) : [] };
    }
    const nameOf = id => { const a = actives.find(x => x.id === id); return a ? a.name : '?'; };
    const withNames = players => players.map(p => ({ ...p, name: nameOf(p.id) }));

    // ── actions ──
    function flash(text, ok) {
      const el = document.getElementById('cf-msg');
      if (!el) return;
      el.textContent = text; el.className = 'cf-msg ' + (ok ? 'ok' : 'err');
      if (ok) setTimeout(() => { if (el.textContent === text) el.className = 'cf-msg'; }, 4000);
    }
    async function apply(kind, category, note, fundDelta, players, details) {
      const { data, error } = await supabaseClient.rpc('party_apply', {
        p_campaign: campaignId, p_kind: kind, p_category: category, p_note: note || null,
        p_fund_delta: fundDelta, p_players: players || [], p_details: details || {}
      });
      if (error) { flash(error.message, false); return null; }
      return data;
    }
    async function done(msg) { await loadAll(); flash(msg, true); }

    async function deposit() {
      const a = amt('cf-dep-amt'); if (a <= 0) return flash('Enter an amount to deposit.', false);
      if (await apply('deposit', 'General', val('cf-dep-note'), a)) await done('Deposited ' + cr(a) + '.');
    }
    async function withdraw() {
      const a = amt('cf-wd-amt'); if (a <= 0) return flash('Enter an amount to withdraw.', false);
      if (await apply('withdraw', 'General', val('cf-wd-note'), -a)) await done('Withdrew ' + cr(a) + '.');
    }
    function disbursePlan() {
      const total = amt('cf-ds-amt'), to = val('cf-ds-to');
      if (total <= 0) return null;
      if (to === 'ALL') {
        const ids = [...ticked]; if (!ids.length) return { err: 'Tick at least one active player.' };
        const sp = equalSplit(total, ids);
        if (sp.each <= 0) return { err: 'That is less than Cr1 each.' };
        return { delta: -(sp.each * ids.length), players: ids.map(id => ({ id, amount: sp.each })), each: sp.each, n: ids.length };
      }
      return { delta: -total, players: [{ id: to, amount: total }], each: total, n: 1 };
    }
    function previewDisburse() {
      const p = disbursePlan(), el = document.getElementById('cf-ds-prev');
      el.textContent = !p ? '' : p.err ? p.err : p.n > 1 ? 'Cr' + p.each.toLocaleString() + ' to each of ' + p.n + ' players (' + cr(-p.delta) + ' from the fund).' : cr(-p.delta) + ' from the fund to ' + nameOf(p.players[0].id) + '.';
    }
    async function disburse() {
      const p = disbursePlan(); if (!p) return flash('Enter an amount to disburse.', false);
      if (p.err) return flash(p.err, false);
      if (await apply('disbursement', 'Disbursement', val('cf-ds-note'), p.delta, withNames(p.players))) await done('Disbursed ' + cr(-p.delta) + '.');
    }
    function incomePlan() {
      const type = val('cf-in-type'), gross = amt('cf-in-amt');
      if (gross <= 0) return null;
      const pct = Number(settings[INCOME_TYPES.find(t => t[0] === type)[1]]);
      return { type, gross, pct, ...incomeSplit(gross, pct, [...ticked]) };
    }
    function previewIncome() {
      const p = incomePlan(), el = document.getElementById('cf-in-prev');
      el.textContent = !p ? '' : 'Party fund ' + cr(p.fund) + ' (' + p.pct + '% + rounding)' + (p.players.length ? ' · ' + p.players.length + ' player' + (p.players.length === 1 ? '' : 's') + ' get ' + cr(p.each) + ' each' : ' · no players ticked, so the fund keeps it all');
    }
    async function recordIncome() {
      const p = incomePlan(); if (!p) return flash('Enter the amount received.', false);
      const id = await apply('income', p.type, val('cf-in-note'), p.fund, withNames(p.players), { gross: p.gross, pct: p.pct });
      if (id) await done(p.type + ' income of ' + cr(p.gross) + ' recorded.');
    }

    // Cargo sales from the Sell Cargo log, banked once each.
    function bankAmount(r, basis) {
      const net = (Number(r.gross) || 0) - (Number(r.broker_fee) || 0);
      return basis === 'net' ? net : net - (Number(r.purchase_price) || 0) * (Number(r.tons) || 0);
    }
    async function bankOne(rowId, silent) {
      const r = unbanked.find(x => x.id === rowId); if (!r) return false;
      const basis = val('cf-bank-basis'), a = Math.round(bankAmount(r, basis));
      if (a <= 0) { if (!silent) flash('That sale made no ' + (basis === 'net' ? 'proceeds' : 'profit') + ', so there is nothing to bank. Use Dismiss to clear it.', false); return false; }
      const pct = Number(settings.pct_cargo), sp = incomeSplit(a, pct, [...ticked]);
      const id = await apply('income', 'Cargo', 'Sale: ' + r.good_name + ' ×' + r.tons + 't' + (r.sold_world ? ' at ' + r.sold_world : ''),
        sp.fund, withNames(sp.players), { gross: a, pct, trade_log: r.id });
      if (!id) return false;
      await supabaseClient.from('spacecraft_trade_log').update({ banked_ledger_id: id }).eq('id', r.id);
      return true;
    }
    async function bank(rowId) { if (await bankOne(rowId)) await done('Sale banked.'); }
    async function bankAll() {
      let n = 0;
      for (const r of [...unbanked]) { if (await bankOne(r.id, true)) n++; }
      await done(n ? n + ' sale' + (n === 1 ? '' : 's') + ' banked.' : 'Nothing to bank.');
    }
    async function dismissSale(rowId) {
      await supabaseClient.from('spacecraft_trade_log').update({ banked_ledger_id: DISMISSED }).eq('id', rowId);
      await loadAll();
    }

    async function reverse(id) {
      const { error } = await supabaseClient.rpc('party_reverse', { p_ledger: id });
      if (error) return flash(error.message, false);
      await done('Entry reversed.');
    }

    async function saveSettings() {
      const row = { campaign_id: campaignId };
      INCOME_TYPES.forEach(([, col]) => { row[col] = Math.max(0, Math.min(100, Math.round(parseFloat(val('cf-set-' + col)) || 0))); });
      const { error } = await supabaseClient.from('party_settings').upsert(row, { onConflict: 'campaign_id' });
      if (error) return flash(error.message, false);
      await done('Payout percentages saved.');
    }

    function toggleTick(id, on) { if (on) ticked.add(id); else ticked.delete(id); previewDisburse(); previewIncome(); }

    // ── drawing ──
    const KIND = { deposit: 'Deposit', withdraw: 'Withdrawal', disbursement: 'Disbursement', income: 'Income', expense: 'Expense', reverse: 'Reversal' };
    function render() {
      const allTotal = shipData.reduce((n, r) => n + r.ex.total, 0);
      const rows = [['Mortgage Payment', 'mortgage'], ['Maintenance', 'maintenance'], ['Life Support', 'lifeSupport'],
        ['Crew Salaries', 'salaries'], ['Berthing', 'berthing'], ['Other', 'other']];
      const several = shipData.length > 1;

      document.getElementById('cf-root').innerHTML = `
        <div id="cf-msg" class="cf-msg"></div>

        <div class="calc-block cf-top">
          <div class="cf-fund"><span class="cf-sub" style="text-transform:uppercase;letter-spacing:0.08em">${esc(campaignName)} — Party Fund</span>
            <span class="cf-balance">${cr(fund)}</span>
            <span class="cf-sub">Shared by the whole party. It cannot go below zero.</span></div>
        </div>

        <div class="cf-layout">
          <div class="cf-main">
            <div class="cf-grid">
              <div class="calc-block">
                <div class="calc-block-title">Deposit</div>
                <div class="cf-row"><label>Amount (Cr)<input type="number" id="cf-dep-amt" min="1" /></label>
                  <label>Note<input class="cf-wide" id="cf-dep-note" placeholder="what is it for" /></label>
                  <button class="btn-outline cf-btn" onclick="deposit()">Deposit</button></div>
              </div>
              <div class="calc-block">
                <div class="calc-block-title">Income — passenger, freight, mission</div>
                <div class="cf-row"><label>Type<select id="cf-in-type" onchange="previewIncome()">${INCOME_TYPES.map(([t, col]) => `<option value="${t}">${t} (${settings[col]}% to fund)</option>`).join('')}</select></label>
                  <label>Amount received (Cr)<input type="number" id="cf-in-amt" min="1" oninput="previewIncome()" /></label>
                  <label>Note<input class="cf-wide" id="cf-in-note" placeholder="optional" /></label>
                  <button class="btn-outline cf-btn" onclick="recordIncome()">Record</button></div>
                <div class="cf-preview" id="cf-in-prev"></div>
              </div>
              <div class="calc-block">
                <div class="calc-block-title">Withdraw</div>
                <div class="cf-row"><label>Amount (Cr)<input type="number" id="cf-wd-amt" min="1" /></label>
                  <label>Note<input class="cf-wide" id="cf-wd-note" placeholder="what is it for" /></label>
                  <button class="btn-outline cf-btn" onclick="withdraw()">Withdraw</button></div>
              </div>
              <div class="calc-block">
                <div class="calc-block-title">Disbursement — fund to players</div>
                <div class="cf-row"><label>Total from fund (Cr)<input type="number" id="cf-ds-amt" min="1" oninput="previewDisburse()" /></label>
                  <label>To<select id="cf-ds-to" onchange="previewDisburse()"><option value="ALL">All ticked players</option>${actives.map(a => `<option value="${a.id}">${esc(a.name)}</option>`).join('')}</select></label>
                  <label>Note<input class="cf-wide" id="cf-ds-note" placeholder="optional" /></label>
                  <button class="btn-outline cf-btn" onclick="disburse()">Disburse</button></div>
                <div class="cf-preview" id="cf-ds-prev"></div>
              </div>
            </div>

            <div class="calc-block">
              <div class="calc-block-title">Cargo sales waiting to be banked</div>
              ${unbanked.length ? `
                <div class="cf-row" style="margin-bottom:8px"><label>Bank the<select id="cf-bank-basis"><option value="profit">profit (after the cost of the goods)</option><option value="net">net proceeds (gross less broker fee)</option></select></label>
                  <button class="btn-outline cf-btn" onclick="bankAll()">Bank all</button>
                  <span class="cf-sub">Uses the Cargo % in Payout settings: that share goes to the fund, the rest to the ticked players.</span></div>
                <table class="cf-table"><thead><tr><th class="l">Sold</th><th class="l">Ship</th><th class="l">Good</th><th>Tons</th><th>Gross</th><th>Broker fee</th><th>Cost of goods</th><th>Profit</th><th></th></tr></thead><tbody>
                ${unbanked.map(r => { const cost = (Number(r.purchase_price) || 0) * (Number(r.tons) || 0), profit = (Number(r.gross) || 0) - (Number(r.broker_fee) || 0) - cost;
                  return `<tr><td class="l">${new Date(r.sold_at).toLocaleDateString()}</td><td class="l">${esc(r.shipName)}</td><td class="l">${esc(r.good_name)}${r.sold_world ? ' · ' + esc(r.sold_world) : ''}</td><td>${r.tons}</td><td>${cr(r.gross || 0)}</td><td>${cr(r.broker_fee || 0)}</td><td>${cr(cost)}</td><td class="${profit >= 0 ? 'cf-pos' : 'cf-neg'}">${cr(profit)}</td>
                  <td><button class="btn-small" onclick="bank('${r.id}')">Bank</button> <button class="btn-small" onclick="dismissSale('${r.id}')" title="Clear it without moving any money">Dismiss</button></td></tr>`; }).join('')}
              </tbody></table>` : '<div class="cf-sub">Every logged cargo sale has been banked.</div>'}
            </div>

            <div class="calc-block">
              <div class="calc-block-title">Ledger <span class="cf-sub" style="font-weight:400">(latest 500 entries)</span></div>
              ${ledger.length ? `<table class="cf-table"><thead><tr><th class="l">When</th><th class="l">By</th><th class="l">Entry</th><th class="l">Note</th><th>Fund</th><th>Balance</th><th></th></tr></thead><tbody>
                ${ledger.map(l => { const pl = (l.details && l.details.players) || [], rev = !!l.reversed_by;
                  return `<tr class="${rev ? 'cf-rev' : ''}"><td class="l">${new Date(l.created_at).toLocaleString()}</td><td class="l">${esc(l.user_name || '')}</td>
                  <td class="l">${KIND[l.kind] || l.kind}${l.category && l.category !== 'General' ? ' · ' + esc(l.category) : ''}</td>
                  <td class="l">${esc(l.note || '')}${pl.length ? '<div class="cf-detail">→ ' + pl.map(p => esc(p.name || '') + ' ' + cr(p.amount)).join(', ') + '</div>' : ''}</td>
                  <td class="${l.amount >= 0 ? 'cf-pos' : 'cf-neg'}">${l.amount >= 0 ? '+' : ''}${cr(l.amount)}</td><td>${cr(l.balance_after)}</td>
                  <td>${!rev && l.kind !== 'reverse' && l.category !== 'Maintenance Period' ? `<button class="btn-small" onclick="reverse('${l.id}')">Reverse</button>` : ''}</td></tr>`; }).join('')}
              </tbody></table>` : '<div class="cf-sub">Nothing recorded yet.</div>'}
            </div>
          </div>

          <div class="cf-side">
            <div class="calc-block">
              <div class="calc-block-title">Player payouts</div>
              ${actives.length ? `<div class="cf-tick">${actives.map(a => `<label class="cf-check"><input type="checkbox" ${ticked.has(a.id) ? 'checked' : ''} onchange="toggleTick('${a.id}', this.checked)" />${esc(a.name)}</label>`).join('')}</div>
              <div class="cf-sub" style="margin-top:6px">Ticked players share the next payout.</div>`
              : '<div class="cf-sub">No active characters. Set each player\'s character to Active on the Roster.</div>'}
            </div>
            <div class="calc-block">
              <div class="calc-block-title">Expenses per 28 days</div>
              ${shipData.length ? `<table class="cf-table cf-mini"><tbody>
                ${rows.map(([label, key]) => `<tr><td class="l">${label}</td><td>${cr(shipData.reduce((n, r) => n + r.ex[key], 0))}</td></tr>`).join('')}
                <tr class="cf-total"><td class="l">Total</td><td>${cr(allTotal)}</td></tr>
              </tbody></table>
              ${several ? '<div class="cf-ships">' + shipData.map(r => '<div><span>' + esc(r.ship.name) + '</span><span>' + cr(r.ex.total) + '</span></div>').join('') + '</div>' : ''}
              <div class="cf-sub" style="margin-top:6px">Active ships, fuel not included. Pay it from the <a href="time-tracker.html" style="color:#00e5ff">Time Tracker</a>.</div>`
              : '<div class="cf-sub">No active spacecraft in this campaign.</div>'}
            </div>
            <div class="calc-block">
              <div class="calc-block-title">Payout settings</div>
              <div class="cf-sub" style="margin-bottom:8px">% to the party fund. The rest is shared equally among ticked players.</div>
              <div class="cf-pct">${INCOME_TYPES.map(([t, col]) => `<label>${t} %<input type="number" id="cf-set-${col}" min="0" max="100" value="${settings[col]}" /></label>`).join('')}
                <button class="btn-outline cf-btn" onclick="saveSettings()">Save</button></div>
            </div>
          </div>
        </div>`;
      previewDisburse(); previewIncome();
    }

    async function doSignOut() {
      await supabaseClient.auth.signOut();
      window.location.href = '../../index.html';
    }

    init();
  </script>
</body>
</html>
